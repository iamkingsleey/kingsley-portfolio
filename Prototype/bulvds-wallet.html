<title>Bulvds Wallet prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* The Bulvds Wallet, rebuilt from the Figma flows so it stays sharp at any size. One file, five flows (?flow=home|fund|withdraw|history|checkout),
   each playing on its own with a finger showing every tap. Drawn on a 1200×800 stage that scales to the 3:2 frame. */
:root { --ink: #040e01; --dk: #103505; --lime: #a4fe22; --lime2: #d5ff99; --g: #359817; --gbg: #e3f7da; --red: #f04438; --rbg: #fdd9d6;
  --mut: #9b9e95; --line: #eef0ec; --app: #fafaf9; --field: #d0d5dd; --ease: cubic-bezier(.33, 0, .67, 1); color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6 }
body { font: 400 14px/1.4 Inter, system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased }
#st { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0 }
/* left: what's happening */
.side { position: absolute; left: 100px; top: 50%; translate: 0 -50%; width: 440px }
.side .k { font: 600 12px/1 "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #6b7f63 }
.side h2 { margin: 14px 0 36px; font: 600 38px/1.08 Geist, Inter, system-ui, sans-serif; letter-spacing: -.045em; color: var(--ink) }
/* the steps on a dial: ticks down the side, a red needle that tunes to the step on screen */
.dial { position: relative; padding-left: 44px }
.dial .tk { position: absolute; left: 0; top: 0; bottom: 0; width: 26px }
.dial .tk i { position: absolute; left: 0; height: 1px; background: var(--ink); border-radius: 1px }
.dial .nd { position: absolute; left: -6px; width: 28px; height: 2px; margin-top: -1px; background: #ff4a1c; border-radius: 1px; opacity: 0; transition: opacity .3s }
.dial.live .nd { opacity: 1 }
.dial ol { list-style: none; padding: 0; margin: 0 }
.dial li { height: 48px; display: flex; align-items: center; font: 500 18px/1.2 Geist, Inter, system-ui, sans-serif; letter-spacing: -.015em; color: #a7ada4; transition: color .35s, transform .45s cubic-bezier(.33, 0, .67, 1) }
.dial li.on { color: var(--ink); transform: translateX(6px) } .dial li.done { color: #59645a }
/* the phone */
.dev { position: absolute; left: 650px; top: 52px; width: 375px; height: 812px; transform: scale(.856); transform-origin: 0 0; border-radius: 54px; padding: 0;
  box-shadow: 0 0 0 9px #0d0f0c, 0 0 0 10px #2a2d29, 0 40px 80px -30px rgba(16, 24, 40, .45) }
.app { position: absolute; inset: 0; border-radius: 54px; overflow: hidden; background: var(--app) }
.scr { position: absolute; inset: 0; background: var(--app); transform: translateX(100%); transition: transform .38s var(--ease); overflow: hidden }
.scr.on { transform: none } .scr.back { transform: translateX(-28%) } .scr.fade { transition: opacity .35s; transform: none; opacity: 0 } .scr.fade.on { opacity: 1 }
.scr.white { background: #fff }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 38px; font: 600 16px Inter; position: relative; z-index: 2 }
.sb svg { display: block }
.bk { width: 44px; height: 44px; display: grid; place-items: center; margin: 4px 0 0 12px }
.hdr { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid #f0f1ee }
.hdr .bk { margin: 0 } .hdr b { font-size: 20px; font-weight: 600; letter-spacing: -.02em }
.pad { padding: 0 16px }

.card .l { font-size: 12px; font-weight: 500; opacity: .95 }
.card .amt { display: flex; align-items: center; gap: 10px; margin-top: 4px; font: 700 30px/1.1 Inter; letter-spacing: -.02em }
.card .br { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--lime) }
.card .btns { position: absolute; left: 24px; right: 24px; bottom: 26px; display: grid; grid-template-columns: 147fr 135fr; gap: 12px }
.cbtn { height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--dk); background: #fff; transition: transform .12s, filter .15s }
.cbtn.w { background: var(--lime2) } .cbtn.prs, .btn.prs, .opt.prs, .row.prs { transform: scale(.97); filter: brightness(.96) }
.rt { display: flex; justify-content: space-between; align-items: center; margin: 34px 16px 10px; font-size: 12px; color: var(--mut); letter-spacing: .02em }
.rt a { display: inline-flex; gap: 4px; align-items: center; color: var(--dk); font-weight: 500; font-size: 12px }
.list { margin: 0 16px; background: #fff; border-radius: 16px; overflow: hidden }
.row { display: flex; align-items: center; gap: 12px; height: 80px; padding: 0 8px; border-bottom: 1px solid #f2f3f0; transition: transform .12s, background .2s }
.row:last-child { border-bottom: 0 } .row.new { animation: rin .6s var(--ease) both } @keyframes rin { from { opacity: 0; transform: translateY(-10px) } }
.ic { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--lime2) } .ic.f { background: var(--rbg) }
.row .t { flex: 1; min-width: 0 } .row .t b { display: block; font-size: 14px; font-weight: 500 } .row .t span { font-size: 12px; color: var(--mut) }
.row .r { text-align: right } .row .r b { display: block; font-size: 14px; font-weight: 500 }
.bad { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; color: var(--g); background: var(--gbg) } .bad.f { color: var(--red); background: var(--rbg) }
/* sheets and modals */
.dim { position: absolute; inset: 0; background: rgba(28, 33, 26, .42); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5 }
.dim.on { opacity: 1 }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 18px 34px; transform: translateY(105%); transition: transform .38s var(--ease) }
.sheet.on { transform: none } .sheet .gr { width: 40px; height: 5px; border-radius: 3px; background: #dfe2dc; margin: 0 auto 22px }
.sheet h3 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 18px }
.opt { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-radius: 12px; transition: transform .12s, background .2s }
.opt > svg, .opt > .ic { flex: none } .opt b { display: block; font-size: 15px; font-weight: 500 } .opt div span { display: block; margin-top: 4px; font-size: 14px; color: var(--mut); line-height: 1.45 }
.modal { position: absolute; left: 16px; right: 16px; top: 214px; z-index: 6; background: #fff; border-radius: 20px; padding: 20px 20px 22px; text-align: center; opacity: 0; transform: scale(.94); transition: opacity .25s, transform .4s var(--ease); pointer-events: none }
.modal.on { opacity: 1; transform: none }
.modal .x { width: 44px; height: 44px; border-radius: 12px; background: #f5f6f3; display: grid; place-items: center; margin-left: auto }
.modal h4 { font-size: 24px; font-weight: 700; letter-spacing: -.02em } .modal p { margin: 8px 12px 0; color: var(--mut); font-size: 15px; line-height: 1.45 }
/* forms */
.tt { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 22px 0 6px } .st { color: var(--mut); font-size: 14px; margin-bottom: 18px }
.lab { font-size: 14px; font-weight: 500; margin: 16px 0 8px }
.inp { height: 44px; border: 1px solid #b5b8b0; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 16px; background: #fff; transition: border-color .2s, box-shadow .2s }
.inp.ro { border-color: transparent; background: #f5f5f4 } .inp.foc { border-color: var(--dk); box-shadow: 0 0 0 3px rgba(53, 152, 23, .14) }
.inp .ph { color: #a7aaa3 } .inp .v:empty + .ph { display: inline } .inp .v:not(:empty) + .ph { display: none }
.inp.area { height: 128px; align-items: flex-start; padding-top: 12px }
.car { display: inline-block; width: 1.5px; height: 18px; background: var(--ink); margin-left: -8px; opacity: 0 } .inp.foc .car { opacity: 1; animation: bl 1s steps(1) infinite } @keyframes bl { 50% { opacity: 0 } }
.hint { font-size: 13px; color: var(--mut); margin-top: 6px }
.warn svg { flex: none; margin-top: 1.5px } .warn { display: flex; gap: 8px; margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: #fdf3b1; font-size: 12px; line-height: 1.45; color: #3d3200 }
.bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 38px; background: #fff; border-top: 1px solid #f0f1ee }
.btn { height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 500; color: var(--lime); background: var(--dk); transition: transform .12s, filter .15s, background .3s, color .3s }
.btn.off { background: #c9cfc5; color: #eef2ea } .btn.ghost { background: #fff; color: var(--dk); border: 1px solid #b5b8b0 } .btn.lime { background: var(--lime2); color: var(--dk) }
.otp { display: grid; grid-template-columns: repeat(4, 64px); justify-content: space-between; margin-top: 60px }
.otp i { height: 64px; border: 1px solid #b5b8b0; border-radius: 8px; display: grid; place-items: center; transition: border-color .2s } .otp i.foc { border-color: var(--dk); box-shadow: 0 0 0 3px rgba(53, 152, 23, .14) }
.otp i b { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .2s var(--ease) } .otp i.f b { transform: none }
.spin { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -64px 0 0 -32px; animation: sp 1s linear infinite }
.spin i { position: absolute; border-radius: 50%; border: .5px solid rgba(0,0,0,.4) } @keyframes sp { to { transform: rotate(360deg) } }
.logo { display: block; margin: 6px 0 0 12px }
.ok h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 18px } .ok p { color: var(--mut); font-size: 15px; margin-top: 8px; line-height: 1.45 }
.ok .il { display: block; margin: 90px auto 0 }
/* history */
.tabs { display: flex; gap: 8px; align-items: center; padding: 12px 16px } .tabs span { height: 28px; padding: 0 16px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; color: var(--mut); background: #eef0ec } .tabs span.on { background: #fff; color: var(--ink); border: 1px solid var(--dk) }
.tabs .fl { margin-left: auto; width: 32px; height: 32px; border-radius: 6px; border: 1px solid #e3e5e0; display: grid; place-items: center; background: #fff }
.det .big { text-align: center; margin: 4px 0 18px } .det .big b { display: block; margin-top: 10px; font-size: 24px; font-weight: 700 } .det .big span { font-size: 14px; color: var(--mut) }
.kv { display: flex; justify-content: space-between; padding: 9px 0; font-size: 13px } .kv span { color: #4b5247 } .kv b { font-weight: 500 }
/* checkout */
.bkg { padding: 0 16px; transition: transform .6s var(--ease) }
.bkg h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 16px 0 12px }
.box { background: #fff; border: 1px solid #edefea; border-radius: 16px; padding: 18px 22px }
.prop { display: flex; gap: 16px; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #edefea } .prop img { width: 100px; height: 100px; border-radius: 16px; object-fit: cover }
.prop b { font-size: 18px; font-weight: 600 } .prop p { color: var(--mut); font-size: 14px; margin-top: 6px; display: flex; gap: 5px; align-items: center } .prop p svg { flex: none } .prop .st2 { color: var(--ink) }
.res { padding: 18px 0; border-bottom: 1px solid #edefea } .res .h { display: flex; justify-content: space-between; align-items: center } .res b { font-size: 16px; font-weight: 500 }
.chg { font-size: 11px; padding: 3px 8px; border: 1px solid #9a9d96; border-radius: 6px; color: #4b5247 }
.res p { color: var(--mut); font-size: 14px; margin-top: 10px }
.dd { margin-top: 18px; height: 40px; border: 1px solid #e2e5df; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #4b5b6b; font-size: 14px }
.ao { display: flex; align-items: flex-start; gap: 12px; padding: 8px 4px; animation: none } .ao.new { animation: rin .6s var(--ease) both }
.ao .cb { flex: none; width: 18px; height: 18px; border-radius: 3px; border: 1.5px solid #9aa196; margin-top: 2px; display: grid; place-items: center; transition: background .2s, border-color .2s } .ao.on .cb { background: var(--dk); border-color: var(--dk) }
.ao .cb svg { opacity: 0 } .ao.on .cb svg { opacity: 1 }
.ao b { display: block; font-size: 15px; font-weight: 400 } .ao span { font-size: 12px; color: #6a7a8c } .ao .tr { margin-left: auto; align-self: center; display: grid }
.addb { margin-top: 10px; height: 52px; border-radius: 10px; background: var(--lime2); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; transition: transform .12s, filter .15s }
.cp { margin-top: 18px } .cp b { font-size: 15px; font-weight: 500 } .cp p { color: var(--mut); font-size: 13px; margin: 6px 0 10px }
.tot { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 0 6px; border-top: 1px solid #edefea; margin-top: 18px } .tot b { font-size: 16px; font-weight: 500 } .tot p { color: var(--mut); font-weight: 600; margin-top: 8px; font-size: 15px }
.sum { border: 1px solid #edefea; border-radius: 12px; overflow: hidden; margin: 10px 0 20px } .sum div { display: flex; justify-content: space-between; padding: 12px 14px; font-size: 14px } .sum .t { background: #f8f9f7; font-weight: 600 }
.pm > svg { flex: none; width: 24px; height: 24px } .pm { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border: 1px solid #edefea; border-radius: 12px; margin-bottom: 10px; transition: transform .12s, border-color .2s, background .2s }
.pm.hl { border-color: var(--g); background: #f8fdf3 } .pm .tx { flex: 1 } .pm b { font-size: 15px; font-weight: 500; display: block } .pm span { font-size: 12.5px; color: var(--mut); display: block; margin-top: 2px }
/* the finger */
.touch { position: absolute; left: 0; top: 0; z-index: 20; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(40, 46, 38, .22); border: 2px solid rgba(255, 255, 255, .85);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .18); opacity: 0; pointer-events: none; transform: translate(var(--x, 190px), var(--y, 700px)) scale(var(--s, 1)); transition: transform .5s cubic-bezier(.33, 0, .67, 1), opacity .25s }
.touch.on { opacity: 1 } .touch.dn { --s: .78; transition: transform .12s }
.touch::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(53, 152, 23, .7); opacity: 0 } .touch.tap::after { animation: rip .5s ease-out } @keyframes rip { 0% { transform: scale(.6); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
/* phones and narrow frames: a vertical stage, the title and the current step on top, the phone below */
#st.v { width: 600px }
#st.v .side { left: 44px; top: 40px; translate: none; width: 512px }
#st.v .side h2 { margin: 10px 0 6px; font-size: 32px }
#st.v .dial { padding-left: 0 } #st.v .dial .tk, #st.v .dial .nd { display: none }
#st.v .dial li { display: none; height: 40px } #st.v .dial li.on { display: flex; transform: none; color: var(--ink) }
#st.v .dial li.on::before { content: attr(data-n); font: 600 12px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; color: #ff4a1c; margin-right: 12px }
[data-theme="dark"] #st.v .dial li.on { color: #f2f5ef }
#st.v .dev { left: 157px; top: 172px; transform: scale(.76) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important } .touch { display: none } }
/* dark mode darkens only the stage around the phone: the app itself always stays light */
html[data-theme="dark"], html[data-theme="dark"] body { background: #16181b }
[data-theme="dark"] .side .k { color: #8aa07f } [data-theme="dark"] .side h2 { color: #f2f5ef }
[data-theme="dark"] .dial .tk i { background: #f2f5ef } [data-theme="dark"] .dial li { color: #5f685c } [data-theme="dark"] .dial li.on { color: #f2f5ef } [data-theme="dark"] .dial li.done { color: #a3ac9f }
[data-theme="dark"] .dev { box-shadow: 0 0 0 9px #000, 0 0 0 10px #3b3f3a, 0 40px 80px -30px rgba(0, 0, 0, .7) }
:root { --icon: #103505 }
.app svg { color: var(--icon) } .cbtn svg, .ic svg, .addb svg { color: #103505 }
