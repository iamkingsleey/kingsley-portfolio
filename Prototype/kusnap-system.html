:root { color-scheme: light }

.cp { position: absolute; left: 1.1vw; right: 1.1vw; bottom: 1vw; font: 500 max(9px, .82vw)/1.3 "Geist Mono", ui-monospace, monospace; color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2 }
.fit { position: absolute; left: 50%; top: 50%; display: block; width: max-content; transform-origin: center; transform: translate(-50%, -50%) }
.sw { width: 92px; height: 92px; border-radius: 16px; background: #0776D8; box-shadow: inset 0 0 0 1px rgb(1 24 43 / .06) }
.again { position: absolute; right: 1vw; top: .9vw; z-index: 3; border: 0; background: rgb(255 255 255 / .9); color: #000; font: 500 max(10px, .85vw)/1 Inter, sans-serif; padding: .5vw .8vw; border-radius: 99px; cursor: pointer; opacity: 0; transition: opacity .2s }

.kb.sec.st-focused { border-color: #0776D8 }

.kb.soft { background: #FFF4F4; color: #830000 }
.kb.solid { background: #DB0000; border-color: #DB0000; color: #fff }
