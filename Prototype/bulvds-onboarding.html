<style>
/* Bulvds onboarding, rebuilt from the Figma flow: the splash, three slides with Kingsley's isometric illustrations, then sign-up by email.
   Two flows: ?flow=explorer (renters) and ?flow=host (agents and landlords). Drawn on a 1200×800 stage that scales to the 3:2 frame. */
:root { --ink: #040e01; --dk: #103505; --lime: #a4fe22; --lime2: #d5ff99; --mut: #9b9e95; --red: #f04438; --ease: cubic-bezier(.33, 0, .67, 1); color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6 }
body { font: 400 14px/1.4 Inter, system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased }
#st { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0 }
.side { position: absolute; left: 100px; top: 50%; translate: 0 -50%; width: 440px }
.side .k { font: 600 12px/1 "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #6b7f63 }
.side h2 { margin: 14px 0 36px; font: 600 38px/1.08 Geist, Inter, system-ui, sans-serif; letter-spacing: -.045em; color: var(--ink) }
/* the steps on a dial: ticks down the side, a red needle that tunes to the step on screen */
.dial { position: relative; padding-left: 44px }
.dial .tk { position: absolute; left: 0; top: 0; bottom: 0; width: 26px }
.dial .tk i { position: absolute; left: 0; height: 1px; background: var(--ink); border-radius: 1px }
.dial .nd { position: absolute; left: -6px; width: 28px; height: 2px; margin-top: -1px; background: #ff4a1c; border-radius: 1px; opacity: 0; transition: opacity .3s }
.dial.live .nd { opacity: 1 }
.dial ol { list-style: none; padding: 0; margin: 0 }
.dial li { height: 48px; display: flex; align-items: center; font: 500 18px/1.2 Geist, Inter, system-ui, sans-serif; letter-spacing: -.015em; color: #a7ada4; transition: color .35s, transform .45s cubic-bezier(.33, 0, .67, 1) }
.dial li.on { color: var(--ink); transform: translateX(6px) } .dial li.done { color: #59645a }
.dev { position: absolute; left: 650px; top: 52px; width: 375px; height: 812px; transform: scale(.856); transform-origin: 0 0; border-radius: 54px;
  box-shadow: 0 0 0 9px #0d0f0c, 0 0 0 10px #2a2d29, 0 40px 80px -30px rgba(16, 24, 40, .45) }
.app { position: absolute; inset: 0; border-radius: 54px; overflow: hidden; background: #fff }
.scr { position: absolute; inset: 0; background: #fff; transform: translateX(100%); transition: transform .38s var(--ease); overflow: hidden }
.scr.on { transform: none } .scr.back { transform: translateX(-30%); filter: brightness(.94) } .scr { transition: transform .38s var(--ease), filter .38s } .scr.fade { transform: none; opacity: 0; transition: opacity .5s } .scr.fade.on { opacity: 1 }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 38px; font: 600 16px Inter; position: relative; z-index: 2 }
.sb.w { color: #fff } .sb svg { display: block }
/* splash */
.splash { background: #103505; display: grid; place-items: center } .splash .sb { position: absolute; left: 0; right: 0; top: 0 } .splash .lg { display: grid; justify-items: center; gap: 12px; margin-top: -40px; animation: pop .9s var(--ease) both } @keyframes pop { from { opacity: 0; transform: scale(.8) } }
/* slides */
.skip { position: absolute; right: 24px; top: 76px; font-size: 16px; font-weight: 500 }
.hd { position: absolute; left: 16px; right: 16px; top: 146px } .hd h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3 } .hd p { margin-top: 10px; font-size: 14px; color: var(--mut); line-height: 1.5 }
.il { position: absolute; left: 50%; top: 360px; translate: -50% 0; display: grid; place-items: center }
.il img { display: block; animation: float 4.5s ease-in-out infinite } @keyframes float { 50% { transform: translateY(-8px) } }
.scr.on .il img { animation: rise .8s var(--ease) both, float 4.5s ease-in-out .8s infinite } @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96) } }
.dots { position: absolute; left: 54px; top: 694px; display: grid; grid-template-columns: repeat(4, 64px); gap: 4px } .dots i { height: 4px; border-radius: 2px; background: #c9cdc5 } .dots i.on { background: var(--dk) }
.bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 36px }
.btn { height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 500; color: var(--lime); background: var(--dk); transition: transform .12s, filter .15s } .btn.prs { transform: scale(.97); filter: brightness(1.1) }
.btn.ghost { background: #fff; color: var(--dk); border: 1px solid #b5b8b0 } .btn.soc { background: #fff; color: var(--ink); border: 1px solid var(--dk); display: flex; gap: 10px; justify-content: center; align-items: center; height: 44px; font-size: 15px }
/* forms */
.pad { padding: 0 16px } .tt { font-size: 24px; font-weight: 600; letter-spacing: -.02em } .stx { color: var(--mut); font-size: 14px; margin-top: 8px; line-height: 1.5 }
.lab { font-size: 14px; font-weight: 500; margin: 16px 0 8px }
.inp { height: 44px; border: 1px solid #b5b8b0; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; transition: border-color .2s, box-shadow .2s }
.inp.foc { border-color: var(--dk); box-shadow: 0 0 0 3px rgba(53, 152, 23, .14) } .inp.new { border-color: #f5a39b; box-shadow: 0 0 0 3px rgba(240, 68, 56, .08) }
.inp .ph { color: #a7aaa3 } .inp .v:not(:empty) + .ph { display: none } .inp .eye { margin-left: auto }
.car { display: inline-block; width: 1.5px; height: 18px; background: var(--ink); margin-left: -8px; opacity: 0 } .inp.foc .car { opacity: 1; animation: bl 1s steps(1) infinite } @keyframes bl { 50% { opacity: 0 } }
.note { font-size: 12.5px; margin-top: 8px; color: var(--ink); max-height: 0; overflow: hidden; opacity: 0; transition: max-height .4s var(--ease), opacity .3s } .note.on { max-height: 30px; opacity: 1 }
.alt { text-align: center; font-size: 14px; color: #3d4439 } .alt a { display: inline-block; margin-top: 8px; color: var(--dk); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; transition: transform .12s } .alt a.prs { transform: scale(.96) }
.tc { font-size: 11.5px; color: #3d4439; margin-top: 14px; line-height: 1.5 } .tc b { font-weight: 500; color: var(--dk) }
.or { text-align: center; color: var(--mut); font-size: 12px; margin: 14px 0 }
.feed .fl { position: absolute; left: 0; top: 0; width: 375px; will-change: transform } .feed .fl img, .feed .fx { display: block; width: 375px } .feed .fx { position: absolute; left: 0; z-index: 2 } .feed .fx.h { top: 0 } .feed .fx.t { bottom: 0 }
.long { position: absolute; left: 0; right: 0; top: 50px; transition: transform .8s var(--ease) }
.host ul { margin: 18px 0 0; padding-left: 18px; color: var(--mut); font-size: 14px; line-height: 1.5; display: grid; gap: 10px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.touch { position: absolute; left: 0; top: 0; z-index: 20; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(40, 46, 38, .22); border: 2px solid rgba(255, 255, 255, .85);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .18); opacity: 0; pointer-events: none; transform: translate(var(--x, 190px), var(--y, 700px)) scale(var(--s, 1)); transition: transform .5s cubic-bezier(.33, 0, .67, 1), opacity .25s }
.touch.on { opacity: 1 } .touch.dn { --s: .78; transition: transform .12s }
.touch::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(53, 152, 23, .7); opacity: 0 } .touch.tap::after { animation: rip .5s ease-out } @keyframes rip { 0% { transform: scale(.6); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
/* phones and narrow frames: a vertical stage, the title and the current step on top, the phone below */
#st.v { width: 600px; height: 880px }
#st.v .side { left: 44px; top: 56px; translate: none; width: 512px; text-align: center }
#st.v .side h2 { margin: 10px 0 6px; font-size: 32px }
#st.v .dial { padding-left: 0 } #st.v .dial .tk, #st.v .dial .nd { display: none }
#st.v .dial li { display: none; height: 40px } #st.v .dial li.on { display: flex; justify-content: center; transform: none; color: var(--ink) }
#st.v .dial li.on::before { content: attr(data-n); font: 600 12px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; color: #ff4a1c; margin-right: 12px }
[data-theme="dark"] #st.v .dial li.on { color: #f5f5f5 }
#st.v .dev { left: 157px; top: 206px; transform: scale(.76) }
/* motion: screens glide on a spring, sheets and dialogs bounce into place, their contents rise one after another, taps squish */
:root { --out: cubic-bezier(.22, 1, .36, 1); --pop: cubic-bezier(.34, 1.56, .64, 1) }
.scr { transition: transform .6s var(--out), filter .6s var(--out) } .scr.back { transform: translateX(-24%) scale(.96) }

.btn.prs, .cbtn.prs, .opt.prs, .row.prs, .inp.prs { transform: scale(.94) !important; transition-duration: .12s }
@keyframes rise2 { from { opacity: 0; transform: translateY(22px) scale(.97) } to { opacity: 1; transform: none } }
@keyframes popin { 0% { opacity: 0; transform: scale(.4) } 60% { opacity: 1; transform: scale(1.08) } 80% { transform: scale(.97) } 100% { transform: none } }
@keyframes bob { 0% { transform: translateY(18px) scale(.9); opacity: 0 } 55% { transform: translateY(-6px) scale(1.03); opacity: 1 } 75% { transform: translateY(2px) } 100% { transform: none } }
.st1 { --d: .04s } .st2 { --d: .1s } .st3 { --d: .16s } .st4 { --d: .22s } .st5 { --d: .28s } .st6 { --d: .34s } .st7 { --d: .4s } .st8 { --d: .46s }

.scr.on .hd h1 { animation: rise2 .65s var(--pop) .12s both } .scr.on .hd p { animation: rise2 .65s var(--pop) .2s both } .scr.on .bot .btn { animation: rise2 .6s var(--pop) .28s both }

.splash.on .lg { animation: popin .9s var(--out) .15s both }
.inp.foc { box-shadow: 0 0 0 4px rgba(164, 254, 34, .35) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important } .touch { display: none } }
/* dark mode darkens only the stage around the phone: the app itself always stays light */

[data-theme="dark"] .side .k { color: #8c8c8c } [data-theme="dark"] .side h2 { color: #f5f5f5 }

[data-theme="dark"] .dev { box-shadow: 0 0 0 9px #000, 0 0 0 10px #333333, 0 40px 80px -30px rgba(0, 0, 0, .7) }
#st.fs .side { display: none }
</style>
