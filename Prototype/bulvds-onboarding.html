<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// light or dark: follow the case study page (it tells us when its toggle changes), else the system setting
(function () { const set = t => { document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; };
  let t; try { t = parent !== window && parent.document.documentElement.dataset.theme; } catch (e) {}
  set(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  addEventListener('message', e => { if (e.data && e.data.theme) set(e.data.theme); });
  // on the portfolio the page is on the same site: follow its toggle directly
  try { if (parent !== window) { const r = parent.document.documentElement; new MutationObserver(() => set(r.dataset.theme)).observe(r, { attributes: true, attributeFilter: ['data-theme'] }); } } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulvds onboarding prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bulvds onboarding, rebuilt from the Figma flow: the splash, three slides with Kingsley's isometric illustrations, then sign-up by email.
   Two flows: ?flow=explorer (renters) and ?flow=host (agents and landlords). Drawn on a 1200×800 stage that scales to the 3:2 frame. */
:root { --ink: #040e01; --dk: #103505; --lime: #a4fe22; --lime2: #d5ff99; --mut: #9b9e95; --red: #f04438; --ease: cubic-bezier(.33, 0, .67, 1); color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6 }
body { font: 400 14px/1.4 Inter, system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased }
#st { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0 }
.side { position: absolute; left: 100px; top: 50%; translate: 0 -50%; width: 440px }
.side .k { font: 600 12px/1 "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #6b7f63 }
.side h2 { margin: 14px 0 36px; font: 600 38px/1.08 Geist, Inter, system-ui, sans-serif; letter-spacing: -.045em; color: var(--ink) }
/* the steps on a dial: ticks down the side, a red needle that tunes to the step on screen */
.dial { position: relative; padding-left: 44px }
.dial .tk { position: absolute; left: 0; top: 0; bottom: 0; width: 26px }
.dial .tk i { position: absolute; left: 0; height: 1px; background: var(--ink); border-radius: 1px }
.dial .nd { position: absolute; left: -6px; width: 28px; height: 2px; margin-top: -1px; background: #ff4a1c; border-radius: 1px; opacity: 0; transition: opacity .3s }
.dial.live .nd { opacity: 1 }
.dial ol { list-style: none; padding: 0; margin: 0 }
.dial li { height: 48px; display: flex; align-items: center; font: 500 18px/1.2 Geist, Inter, system-ui, sans-serif; letter-spacing: -.015em; color: #a7ada4; transition: color .35s, transform .45s cubic-bezier(.33, 0, .67, 1) }
.dial li.on { color: var(--ink); transform: translateX(6px) } .dial li.done { color: #59645a }
.dev { position: absolute; left: 650px; top: 52px; width: 375px; height: 812px; transform: scale(.856); transform-origin: 0 0; border-radius: 54px;
  box-shadow: 0 0 0 9px #0d0f0c, 0 0 0 10px #2a2d29, 0 40px 80px -30px rgba(16, 24, 40, .45) }
.app { position: absolute; inset: 0; border-radius: 54px; overflow: hidden; background: #fff }
.scr { position: absolute; inset: 0; background: #fff; transform: translateX(100%); transition: transform .38s var(--ease); overflow: hidden }
.scr.on { transform: none } .scr.back { transform: translateX(-30%); filter: brightness(.94) } .scr { transition: transform .38s var(--ease), filter .38s } .scr.fade { transform: none; opacity: 0; transition: opacity .5s } .scr.fade.on { opacity: 1 }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 38px; font: 600 16px Inter; position: relative; z-index: 2 }
.sb.w { color: #fff } .sb svg { display: block }
/* splash */
.splash { background: #103505; display: grid; place-items: center } .splash .sb { position: absolute; left: 0; right: 0; top: 0 } .splash .lg { display: grid; justify-items: center; gap: 12px; margin-top: -40px; animation: pop .9s var(--ease) both } @keyframes pop { from { opacity: 0; transform: scale(.8) } }
/* slides */
.skip { position: absolute; right: 24px; top: 76px; font-size: 16px; font-weight: 500 }
.hd { position: absolute; left: 16px; right: 16px; top: 146px } .hd h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3 } .hd p { margin-top: 10px; font-size: 14px; color: var(--mut); line-height: 1.5 }
.il { position: absolute; left: 50%; top: 360px; translate: -50% 0; display: grid; place-items: center }
.il img { display: block; animation: float 4.5s ease-in-out infinite } @keyframes float { 50% { transform: translateY(-8px) } }
.scr.on .il img { animation: rise .8s var(--ease) both, float 4.5s ease-in-out .8s infinite } @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96) } }
.dots { position: absolute; left: 54px; top: 694px; display: grid; grid-template-columns: repeat(4, 64px); gap: 4px } .dots i { height: 4px; border-radius: 2px; background: #c9cdc5 } .dots i.on { background: var(--dk) }
.bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 36px }
.btn { height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 500; color: var(--lime); background: var(--dk); transition: transform .12s, filter .15s } .btn.prs { transform: scale(.97); filter: brightness(1.1) }
.btn.ghost { background: #fff; color: var(--dk); border: 1px solid #b5b8b0 } .btn.soc { background: #fff; color: var(--ink); border: 1px solid var(--dk); display: flex; gap: 10px; justify-content: center; align-items: center; height: 44px; font-size: 15px }
/* forms */
.pad { padding: 0 16px } .tt { font-size: 24px; font-weight: 600; letter-spacing: -.02em } .stx { color: var(--mut); font-size: 14px; margin-top: 8px; line-height: 1.5 }
.lab { font-size: 14px; font-weight: 500; margin: 16px 0 8px }
.inp { height: 44px; border: 1px solid #b5b8b0; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; transition: border-color .2s, box-shadow .2s }
.inp.foc { border-color: var(--dk); box-shadow: 0 0 0 3px rgba(53, 152, 23, .14) } .inp.new { border-color: #f5a39b; box-shadow: 0 0 0 3px rgba(240, 68, 56, .08) }
.inp .ph { color: #a7aaa3 } .inp .v:not(:empty) + .ph { display: none } .inp .eye { margin-left: auto }
.car { display: inline-block; width: 1.5px; height: 18px; background: var(--ink); margin-left: -8px; opacity: 0 } .inp.foc .car { opacity: 1; animation: bl 1s steps(1) infinite } @keyframes bl { 50% { opacity: 0 } }
.note { font-size: 12.5px; margin-top: 8px; color: var(--ink); max-height: 0; overflow: hidden; opacity: 0; transition: max-height .4s var(--ease), opacity .3s } .note.on { max-height: 30px; opacity: 1 }
.alt { text-align: center; font-size: 14px; color: #3d4439 } .alt a { display: inline-block; margin-top: 8px; color: var(--dk); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; transition: transform .12s } .alt a.prs { transform: scale(.96) }
.tc { font-size: 11.5px; color: #3d4439; margin-top: 14px; line-height: 1.5 } .tc b { font-weight: 500; color: var(--dk) }
.or { text-align: center; color: var(--mut); font-size: 12px; margin: 14px 0 }
.feed .fl { position: absolute; left: 0; top: 0; width: 375px; will-change: transform } .feed .fl img, .feed .fx { display: block; width: 375px } .feed .fx { position: absolute; left: 0; z-index: 2 } .feed .fx.h { top: 0 } .feed .fx.t { bottom: 0 }
.long { position: absolute; left: 0; right: 0; top: 50px; transition: transform .8s var(--ease) }
.host ul { margin: 18px 0 0; padding-left: 18px; color: var(--mut); font-size: 14px; line-height: 1.5; display: grid; gap: 10px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.touch { position: absolute; left: 0; top: 0; z-index: 20; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(40, 46, 38, .22); border: 2px solid rgba(255, 255, 255, .85);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .18); opacity: 0; pointer-events: none; transform: translate(var(--x, 190px), var(--y, 700px)) scale(var(--s, 1)); transition: transform .5s cubic-bezier(.33, 0, .67, 1), opacity .25s }
.touch.on { opacity: 1 } .touch.dn { --s: .78; transition: transform .12s }
.touch::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(53, 152, 23, .7); opacity: 0 } .touch.tap::after { animation: rip .5s ease-out } @keyframes rip { 0% { transform: scale(.6); opacity: 1 } 100% { transform: scale(1.9); opacity: 0 } }
/* phones and narrow frames: a vertical stage, the title and the current step on top, the phone below */
#st.v { width: 600px; height: 880px }
#st.v .side { left: 44px; top: 56px; translate: none; width: 512px; text-align: center }
#st.v .side h2 { margin: 10px 0 6px; font-size: 32px }
#st.v .dial { padding-left: 0 } #st.v .dial .tk, #st.v .dial .nd { display: none }
#st.v .dial li { display: none; height: 40px } #st.v .dial li.on { display: flex; justify-content: center; transform: none; color: var(--ink) }
#st.v .dial li.on::before { content: attr(data-n); font: 600 12px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; color: #ff4a1c; margin-right: 12px }
[data-theme="dark"] #st.v .dial li.on { color: #f2f5ef }
#st.v .dev { left: 157px; top: 206px; transform: scale(.76) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important } .touch { display: none } }
/* dark mode darkens only the stage around the phone: the app itself always stays light */
html[data-theme="dark"], html[data-theme="dark"] body { background: #16181b }
[data-theme="dark"] .side .k { color: #8aa07f } [data-theme="dark"] .side h2 { color: #f2f5ef }
[data-theme="dark"] .dial .tk i { background: #f2f5ef } [data-theme="dark"] .dial li { color: #5f685c } [data-theme="dark"] .dial li.on { color: #f2f5ef } [data-theme="dark"] .dial li.done { color: #a3ac9f }
[data-theme="dark"] .dev { box-shadow: 0 0 0 9px #000, 0 0 0 10px #3b3f3a, 0 40px 80px -30px rgba(0, 0, 0, .7) }
</style>
</head>

  <div class="side"><span class="k">Bulvds onboarding</span><h2 id="ttl"></h2><div class="dial" id="dial"><div class="tk" id="tk"></div><i class="nd" id="nd"></i><ol id="steps"></ol></div></div>
  <div class="dev"><div class="app" id="app"></div></div>
</div>

  <div class="lab">First name</div><div class="inp" id="fn"><span class="v"></span><span class="ph">Enter your first name</span><span class="car"></span></div>
  <div class="lab">Last name</div><div class="inp" id="ln"><span class="v"></span><span class="ph">Enter your last name</span><span class="car"></span></div>
  <div class="lab">Password</div><div class="inp" id="pw"><span class="v"></span><span class="ph">Enter your password</span><span class="car"></span>${eye}</div>
  <div class="lab">Confirm password</div><div class="inp" id="pw2"><span class="v"></span><span class="ph">Re-enter your password</span><span class="car"></span>${eye}</div>
  <p class="tc">By agreeing and continuing, you accept our <b>Privacy Policy</b> and <b>Terms and Conditions</b></p>
  <div class="btn" id="agree" style="margin-top:16px">Agree and continue</div><p class="or">or</p>
  <div class="btn soc">${G}Continue with Google</div><div class="btn soc" style="margin-top:12px">${FB}Continue with Facebook</div>
  <div class="alt" style="margin-top:34px">${host ? 'Looking to rent a space?' : 'Want to list your property?'}<br><a>${host ? 'Continue as Explorer' : 'Continue as Host'}</a></div>
  <div class="alt" style="margin-top:22px">Already have an account? <a style="margin:0">Log in</a></div></div></div></div>`;
const hostIntro = () => `<div class="scr host" id="hi">${sbar()}<div style="display:grid;place-items:center;margin-top:46px"><img src="${IMG.host}" alt="" style="width:192px;animation:float 4.5s ease-in-out infinite"></div>
  <div class="pad" style="margin-top:34px"><div class="tt">Let's get your <br>properties online</div><p class="stx">For Agents, Landlords, and Property Managers.</p>
  <ul><li>List verified properties, screen, and attract quality tenants.</li><li>Access all-in-one tools for communication and payments.</li><li>Grow your business faster and easier.</li></ul></div>
  <div class="bot two"><div class="btn ghost">Back</div><div class="btn" id="hcont">Continue</div></div></div>`;
const feed = () => `<div class="scr fade feed" id="fd"><div class="fl" id="fdl"><img src="${IMG.feed}" alt="Bulvds home feed: popular areas, top picks, getaways and more"></div><img class="fx h" src="${IMG.fhead}" alt=""><img class="fx t" src="${IMG.ftab}" alt=""></div>`;
const FLOWS = {
  explorer: { t: 'Getting started as a renter', s: ['Open the app', 'See what Bulvds does', 'Start with just an email', 'Create the account', 'Land on the feed'] },
  host: { t: 'A way in for hosts', s: ['Continue as Host', 'See what hosts get', 'Create a host account'] },
};
const flow = (new URLSearchParams(location.search).get('flow') || 'explorer').replace(/[^a-z]/g, ''), F = FLOWS[flow] || FLOWS.explorer;
document.getElementById('ttl').textContent = F.t; document.getElementById('steps').innerHTML = F.s.map((s, i, a) => `<li data-n="${String(i + 1).padStart(2, '0')} / ${String(a.length).padStart(2, '0')}">${s}</li>`).join('');
const st = document.getElementById('st'), app = document.getElementById('app'), steps = [...document.querySelectorAll('#steps li')];
const fit = () => { const v = innerWidth / innerHeight < 1, W = v ? 600 : 1200, H = v ? 880 : 800; st.classList.toggle('v', v);   // portrait frame: the vertical stage
  const k = Math.min(innerWidth / W, innerHeight / H); st.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`; };
fit(); addEventListener('resize', fit);
const sleep = ms => new Promise(r => setTimeout(r, ms * .66)), $ = s => app.querySelector(s);   // everything plays about a third faster
let touch;
function build() {
  app.innerHTML = (flow === 'host'
    ? email().replace('class="scr"', 'class="scr on"') + hostIntro() + create(true)
    : `<div class="scr fade on splash" id="sp">${sbar('w')}<div class="lg">${LOGO}${WORD}</div></div>` + SL.map(slide).join('') + welcome() + email() + create(false) + feed()) + '<span class="touch" aria-hidden="true"></span>';
  touch = $('.touch');
}
// the dial: ticks every 6px, a longer one at each step; ticks swell as the needle passes
const dial = document.getElementById('dial'), tk = document.getElementById('tk'), nd = document.getElementById('nd'), ROW = 48, TK = [];
for (let y = 3; y <= steps.length * ROW - 3; y += 6) { const e = document.createElement('i'); e.style.top = y + 'px'; tk.append(e); TK.push({ e, y, major: Math.abs(((y - ROW / 2) % ROW + ROW) % ROW) < 3.1 }); }
let ny = ROW / 2, ty = ROW / 2, raf = 0;
const drawDial = () => { raf = 0; ny += (ty - ny) * .16; if (Math.abs(ty - ny) < .2) ny = ty; else raf = requestAnimationFrame(drawDial);
  nd.style.top = ny.toFixed(1) + 'px';
  TK.forEach(t => { const d = (t.y - ny) / 22, b = Math.exp(-d * d); t.e.style.width = ((t.major ? 13 : 6) + b * 8).toFixed(1) + 'px'; t.e.style.opacity = ((t.major ? .45 : .14) + b * .45).toFixed(3); }); };
drawDial();
const step = i => { steps.forEach((l, j) => { l.classList.toggle('on', j === i); l.classList.toggle('done', j < i); }); dial.classList.toggle('live', i >= 0); ty = Math.max(0, i) * ROW + ROW / 2; if (!raf) raf = requestAnimationFrame(drawDial); };
const pt = (el, fx = .5, fy = .5) => { const r = el.getBoundingClientRect(), a = app.getBoundingClientRect(), k = a.width / 375; return [(r.left - a.left + r.width * fx) / k, (r.top - a.top + r.height * fy) / k]; };
const go = async (el, fx, fy, ms = 700) => { const [x, y] = pt(el, fx, fy); touch.classList.add('on'); touch.style.setProperty('--x', x + 'px'); touch.style.setProperty('--y', y + 'px'); await sleep(ms); };
const tap = async el => { touch.classList.add('dn'); if (el) el.classList.add('prs'); await sleep(130); touch.classList.remove('dn', 'tap'); void touch.offsetWidth; touch.classList.add('tap'); if (el) el.classList.remove('prs'); await sleep(160); };
const press = async (el, fx, fy, ms) => { await go(el, fx, fy, ms); await tap(el); };
const show = (id, from) => { const n = $('#' + id); if (from) { const o = $('#' + from); o.classList.add('back'); o.classList.remove('on'); } n.classList.add('on'); };
const type = async (el, text, d = 70, mask) => { const v = el.querySelector('.v'); el.classList.add('foc'); for (const c of text) { v.textContent += mask ? '•' : c; await sleep(d + Math.random() * 35); } await sleep(150); el.classList.remove('foc'); };
// a finger drag: the feed and the touch travel together, then the feed glides on a little
const swipe = async (y0, y1, to, ms = 900) => { const fl = $('#fdl'), e = 'var(--ease)'; touch.style.transition = 'none'; touch.style.setProperty('--x', '228px'); touch.style.setProperty('--y', y0 + 'px'); touch.classList.add('on'); void touch.offsetWidth; touch.style.transition = '';
  await sleep(200); touch.classList.add('dn'); await sleep(120); touch.style.transition = `transform ${ms * .66}ms ${e}, opacity .3s`; fl.style.transition = `transform ${ms * .66 * 1.25}ms cubic-bezier(.2, .7, .3, 1)`;
  touch.style.setProperty('--y', y1 + 'px'); fl.style.transform = `translateY(${to}px)`; await sleep(ms); touch.classList.remove('dn'); touch.classList.remove('on'); await sleep(ms * .45); touch.style.transition = ''; };
const PLAY = {
  async explorer() {
    step(0); await sleep(1700); show('s0'); $('#sp').classList.remove('on'); step(1); await sleep(2300);
    for (let i = 0; i < 3; i++) { await press($('#c' + i), .5, .5, i ? 650 : 800); show(i < 2 ? 's' + (i + 1) : 'wel', 's' + i); await sleep(2300); }
    step(2); await press($('#gs')); show('em', 'wel'); await sleep(900);
    await press($('#mail'), .35); await type($('#mail'), 'johndoe@gmail.com', 60); await sleep(200); await press($('#ecta'));
    const m = $('#mail'); m.classList.add('new'); m.insertAdjacentHTML('beforeend', alertI); $('#nnew').classList.add('on'); $('#ecta').textContent = 'Create account'; await sleep(1500);
    step(3); await press($('#ecta')); show('ca', 'em'); await sleep(900);
    await press($('#fn'), .3); await type($('#fn'), 'John', 70); await press($('#ln'), .3, .5, 380); await type($('#ln'), 'Doe', 70);
    await press($('#pw'), .3, .5, 380); await type($('#pw'), 'password1', 32, true); await press($('#pw2'), .3, .5, 380); await type($('#pw2'), 'password1', 32, true);
    $('#calong').style.transform = 'translateY(-150px)'; await sleep(900); await press($('#agree')); touch.classList.remove('on');
    step(4); show('fd'); await sleep(1500);
    const max = -(2869 - 812); await swipe(640, 260, -620); await sleep(700); await swipe(640, 240, -1400); await sleep(700); await swipe(640, 260, max); await sleep(1100);
    await swipe(220, 620, -1100); await sleep(600); await swipe(220, 640, 0); await sleep(1800);
  },
  async host() {
    step(0); await sleep(1200); await press($('#ashost'), .5, .5, 900); show('hi', 'em'); step(1); await sleep(3200);
    await press($('#hcont')); show('ca', 'hi'); step(2); await sleep(900);
    await press($('#fn'), .3); await type($('#fn'), 'Ada', 70); await press($('#ln'), .3, .5, 380); await type($('#ln'), 'Okafor', 65);
    await press($('#pw'), .3, .5, 380); await type($('#pw'), 'password1', 32, true); await press($('#pw2'), .3, .5, 380); await type($('#pw2'), 'password1', 32, true);
    $('#calong').style.transform = 'translateY(-150px)'; await sleep(900); await go($('#agree'), .5, .5, 600); await tap($('#agree')); touch.classList.remove('on'); await sleep(2600);
  },
};
let visible = true; new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(document.body);
async function loop() {
  build(); step(-1); if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  while (true) { while (!visible) await sleep(300); await (PLAY[flow] || PLAY.explorer)(); await sleep(400); build(); step(-1); await sleep(300); }
}
addEventListener('load', loop);
</script>
