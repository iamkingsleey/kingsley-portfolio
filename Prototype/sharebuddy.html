<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// light or dark: follow the case study page, else the system setting. Only the stage changes; the app stays as designed.
(function () { const set = t => { document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; };
  let t; try { t = parent !== window && parent.document.documentElement.dataset.theme; } catch (e) {}
  set(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  addEventListener('message', e => { if (e.data && e.data.theme) set(e.data.theme); });
  try { if (parent !== window) { const r = parent.document.documentElement; new MutationObserver(() => set(r.dataset.theme)).observe(r, { attributes: true, attributeFilter: ['data-theme'] }); } } catch (e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareBuddy prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Geist:wght@500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ShareBuddy flows, played from Kingsley's Figma screens, split into layers so the pieces can move: ?flow=start | scan | split | pay | circle.
   A 1200×800 stage (600×880 when the frame is portrait) with the steps on a dial and a phone that plays the flow. */
:root { --ink: #0b0b0b; --ease: cubic-bezier(.33, 0, .67, 1); --out: cubic-bezier(.22, 1, .36, 1); --pop: cubic-bezier(.34, 1.56, .64, 1); --red: #ff4a1c; --sb: #ff0a3c; color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6 }
body { font: 500 14px/1.4 Geist, system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased }
#st { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0 }
.side { position: absolute; left: 100px; top: 50%; translate: 0 -50%; width: 440px }
.side .k { font: 600 12px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #a05a63 }
.side h2 { margin: 14px 0 36px; font: 600 38px/1.08 Geist, system-ui, sans-serif; letter-spacing: -.045em }
.dial { position: relative; padding-left: 44px }
.dial .tk { position: absolute; left: 0; top: 0; bottom: 0; width: 26px }
.dial .tk i { position: absolute; left: 0; height: 1px; background: var(--ink); border-radius: 1px }
.dial .nd { position: absolute; left: -6px; width: 28px; height: 2px; margin-top: -1px; background: var(--red); border-radius: 1px; opacity: 0; transition: opacity .3s }
.dial.live .nd { opacity: 1 }
.dial ol { list-style: none; padding: 0; margin: 0 }
.dial li { height: 48px; display: flex; align-items: center; font: 500 18px/1.2 Geist, system-ui, sans-serif; letter-spacing: -.015em; color: #a9aaa8; transition: color .35s, transform .45s var(--ease) }
.dial li.on { color: var(--ink); transform: translateX(6px) } .dial li.done { color: #5c5d5a }
.dev { position: absolute; left: 640px; top: 54px; width: 390px; height: 844px; transform: scale(.82); transform-origin: 0 0; border-radius: 56px;
  box-shadow: 0 0 0 10px #0d0d0d, 0 0 0 11px #2c2c2c, 0 40px 80px -30px rgba(16, 24, 40, .45) }
.app { position: absolute; inset: 0; overflow: hidden; border-radius: 56px; background: #040404; isolation: isolate }

/* screens: push in on a soft spring; the one underneath sinks back */
.scr { position: absolute; inset: 0; z-index: 1; isolation: isolate; background: #040404; overflow: hidden; transform: translateX(100%); transition: transform .62s var(--out), filter .62s var(--out), opacity .4s }
.scr.on { transform: none } .scr.back { transform: translateX(-24%) scale(.96); filter: brightness(.55) }
.scr.fade { transform: none; opacity: 0; transition: opacity .45s var(--out) } .scr.fade.on { opacity: 1 }
.scr.zoom { transform: scale(1.06); opacity: 0; transition: transform .7s var(--out), opacity .5s } .scr.zoom.on { transform: none; opacity: 1 }
.scr img, .scr video { position: absolute; display: block; pointer-events: none; user-select: none }
.full { left: 0; top: 0; width: 390px }
.long { position: absolute; left: 0; top: 0; width: 390px; transition: transform .9s cubic-bezier(.2, .7, .3, 1); will-change: transform }
.fix { z-index: 3 }
/* pieces rise into place one after another, with a little overshoot */
.r { opacity: 0 } .on .r, .r.in { animation: rise .75s var(--pop) var(--d, 0s) both }
@keyframes rise { from { opacity: 0; transform: translateY(34px) scale(.94) } to { opacity: 1; transform: none } }
.from-r { } .on .from-r { animation-name: slidein } @keyframes slidein { from { opacity: 0; transform: translateX(48px) } to { opacity: 1; transform: none } }
.press { animation: press .32s var(--pop) } @keyframes press { 40% { transform: scale(.93) } }

/* overlays: a dim that fades, and a sheet or card that springs */
.ov { position: absolute; inset: 0; z-index: 5; pointer-events: none; visibility: hidden }
.ov.on { visibility: visible }
.ov img { position: absolute; display: block; pointer-events: none; user-select: none }
.ov .dim { position: absolute; inset: 0; width: 390px; opacity: 0; transition: opacity .35s var(--out) } .ov.on .dim { opacity: 1 }
.ov .sheet { transform: translateY(105%); transition: transform .62s var(--pop) } .ov.on .sheet { transform: none }
.ov.out .sheet { transform: translateY(105%); transition: transform .38s var(--ease) } .ov.out .dim { opacity: 0 }
.ov .card { opacity: 0; transform: scale(.55); transition: transform .6s var(--pop), opacity .25s } .ov.on .card { opacity: 1; transform: none }
.ov.out .card { opacity: 0; transform: scale(.85); transition: transform .3s var(--ease), opacity .25s }
/* the + menu: options fly out of the button and land with a bounce */
.ov .opt { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.2); transition: transform .55s var(--pop) var(--d), opacity .25s var(--d) }
.ov.on .opt { opacity: 1; transform: none }
.ov.out .opt { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.2); transition: transform .3s var(--ease), opacity .2s }
.ov .x { transform: rotate(-90deg) scale(.6); opacity: 0; transition: transform .55s var(--pop), opacity .2s } .ov.on .x { transform: none; opacity: 1 }
/* Buddy drops in and squashes */
.ov.on .buddy { animation: drop 1s var(--out) .18s both }
@keyframes drop { 0% { transform: translateY(-160px) } 45% { transform: translateY(0) scale(1.12, .86) } 62% { transform: translateY(-16px) scale(.96, 1.05) } 78% { transform: none } 88% { transform: scale(1.03, .97) } 100% { transform: none } }
.buddy.wob { animation: wob 1.6s ease-in-out infinite } @keyframes wob { 50% { transform: rotate(-4deg) translateY(-3px) } }
/* the chosen option: a red dot pops in */
/* Add Buddies: a search that filters the list as you type, rows that tick, chips that pop into the bar */
.srch { position: absolute; left: 60px; top: 210px; height: 24px; z-index: 2; display: flex; align-items: center; font: 400 14.5px/1 "DM Sans", system-ui, sans-serif; color: #fff }
.srch .ph { color: #7c7c7c; position: absolute; left: 0; white-space: nowrap; transition: opacity .15s } .srch.has .ph { opacity: 0 }
.srch .caret { width: 1.5px; height: 17px; background: var(--sb); margin-left: 1px; opacity: 0 } .srch.foc .caret { opacity: 1; animation: blink 1s steps(1) infinite } @keyframes blink { 50% { opacity: 0 } }
.brow { position: absolute; left: 0; width: 390px; height: 64px; transition: transform .55s var(--out), opacity .3s } .brow > img:first-child { position: absolute; left: 0; top: 0 }
.brow.hide { opacity: 0; transform: translateY(var(--ty, 0)) scale(.96); pointer-events: none }
.bbar { position: absolute; left: 0; top: 660px; width: 390px; height: 184px; z-index: 3; transform: translateY(100%); transition: transform .55s var(--pop) } .bbar.on { transform: none }
.chipx { opacity: 0; transform: scale(.3); transition: transform .5s var(--pop), opacity .2s } .chipx.on { opacity: 1; transform: none }
.pill { position: absolute; left: 184px; top: 112px; width: 96px; height: 28px; border-radius: 99px; background: #fff; color: var(--sb); display: grid; place-items: center; font: 700 14px "DM Sans", system-ui, sans-serif; letter-spacing: -.2px }
.pill.bump { animation: bump .4s var(--pop) } @keyframes bump { 40% { transform: scale(1.18) } }
.rv { opacity: 0 } .rv.in { animation: rise .7s var(--pop) var(--d, 0s) both }

/* card checkout: a sheet in ShareBuddy's own style, with made-up card details, an OTP step and a celebration */
.ck2 { position: absolute; left: 0; bottom: -60px; width: 390px; height: 735px; padding: 16px 22px 96px; background: #161616; border-radius: 28px 28px 0 0; color: #fff; font-family: "DM Sans", system-ui, sans-serif }
.ck2 .gr { width: 40px; height: 5px; border-radius: 3px; background: #333; margin: 0 auto 22px }
.ck2 .hd2 { display: flex; justify-content: space-between; align-items: center } .ck2 .hd2 b { font: 700 20px "DM Sans", system-ui, sans-serif } .ck2 .lock { font: 500 12px "DM Sans", system-ui, sans-serif; color: #8a8a8a; display: flex; gap: 6px; align-items: center }
.ck2 .amt { margin: 20px 0 0; padding: 14px 16px; border-radius: 16px; background: #222; display: flex; justify-content: space-between; align-items: baseline } .ck2 .amt span { color: #9a9a9a; font-size: 13px } .ck2 .amt b { font: 700 24px "DM Sans", system-ui, sans-serif; letter-spacing: -.5px }
.ck2 .card { position: relative; height: 184px; border-radius: 20px; padding: 18px; background: linear-gradient(140deg, #232323 0%, #0b0b0b 100%); border: 1px solid #2c2c2c; overflow: hidden }
.ck2 .card::after { content: ''; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, .04) }
.ck2 .card .chipc { width: 36px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #ffe08a, #d9a536) }
.ck2 .card .num { margin-top: 36px; font: 600 19px "Geist Mono", ui-monospace, monospace; letter-spacing: 2px; min-height: 26px }
.ck2 .card .bt { margin-top: 14px; display: flex; justify-content: space-between; font: 500 11px "DM Sans", system-ui, sans-serif; opacity: .85 } .ck2 .card .bt b { display: block; font: 600 13px "DM Sans", system-ui, sans-serif; opacity: 1; margin-top: 2px; letter-spacing: .5px }
.ck2 .card .brand { position: absolute; right: 18px; top: 16px; display: flex } .ck2 .card .brand i { width: 26px; height: 26px; border-radius: 50%; background: #ffbf00; opacity: .95 } .ck2 .card .brand i + i { background: #fff; margin-left: -10px; opacity: .8 }
.ck2 .card.flip { animation: cflip .7s var(--soft) } @keyframes cflip { 40% { transform: perspective(600px) rotateY(14deg) scale(.97) } }
.ck2 .fl { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px } .ck2 .fld { min-width: 0; overflow: hidden; white-space: nowrap; padding: 13px 16px; border-radius: 16px; background: #222; border: 1.5px solid transparent; transition: border-color .3s, box-shadow .3s } .ck2 .fld.full { grid-column: 1 / -1; width: auto }
.ck2 .fld span { display: block; font-size: 11.5px; color: #8a8a8a } .ck2 .fld b { display: block; min-height: 22px; font: 600 15.5px "DM Sans", system-ui, sans-serif; letter-spacing: .3px; margin-top: 2px }
.ck2 .fld.foc { border-color: var(--sb); box-shadow: 0 0 0 4px rgba(255, 10, 60, .18) }
.ck2 .pay { margin-top: 30px; height: 56px; border-radius: 99px; background: var(--sb); display: grid; place-items: center; font: 700 16px "DM Sans", system-ui, sans-serif; color: #fff; transition: opacity .3s, transform .5s var(--soft) } .ck2 .pay.off { opacity: .35 }
.ck2 .pay .sp { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .7s linear infinite; display: none } .ck2 .pay.busy .sp { display: block } .ck2 .pay.busy em { display: none } .ck2 .pay em { font-style: normal }
.ck2 .note { margin-top: 14px; text-align: center; font-size: 11.5px; color: #6f6f6f }
.ck2 .step { transition: opacity .45s var(--drift), transform .7s var(--glide) } .ck2 .step { position: absolute; left: 22px; right: 22px; top: 178px } .ck2 .step.gone { opacity: 0; transform: translateX(-40px); pointer-events: none } .ck2 .step.later { opacity: 0; transform: translateX(40px) }
.ck2 .otpw { text-align: center; padding-top: 40px } .ck2 .otpw h5 { font: 700 20px "DM Sans", system-ui, sans-serif } .ck2 .otpw p { color: #9a9a9a; font-size: 13.5px; margin: 8px 0 32px }
.ck2 .otp { display: flex; gap: 12px; justify-content: center } .ck2 .otp i { width: 54px; height: 62px; border-radius: 16px; background: #222; display: grid; place-items: center; font: 700 24px "DM Sans", system-ui, sans-serif; font-style: normal; border: 1.5px solid transparent; transition: border-color .25s }
.ck2 .otp i.on { border-color: #fff } .ck2 .otp i b { animation: dot .45s var(--soft) both }
.okp { position: absolute; inset: 0; z-index: 8; background: #040404; display: grid; place-items: center; text-align: center; color: #fff; font-family: "DM Sans", system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity .6s var(--drift) } .okp.on { opacity: 1 }
.okp .ring { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; background: #12d27a; display: grid; place-items: center; transform: scale(0) } .okp.on .ring { animation: dot .8s var(--soft) .1s both }
.okp .ring svg { width: 56px; height: 56px; stroke: #04140b; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60 } .okp.on .ring svg { animation: draw .5s var(--drift) .55s forwards } @keyframes draw { to { stroke-dashoffset: 0 } }
.okp h4 { font: 800 28px "DM Sans", system-ui, sans-serif; margin-top: 4px; letter-spacing: -.5px } .okp p { color: #9a9a9a; margin-top: 8px; font-size: 14.5px; line-height: 1.45 } .okp .ref { margin-top: 22px; display: inline-block; padding: 8px 14px; border-radius: 99px; background: #1b1b1b; font: 500 12px "Geist Mono", monospace; color: #bbb }
.okp.on h4, .okp.on p, .okp.on .ref { animation: rise .9s var(--soft) both } .okp.on h4 { animation-delay: .35s } .okp.on p { animation-delay: .45s } .okp.on .ref { animation-delay: .55s }
.conf { position: absolute; left: 50%; top: 38%; width: 9px; height: 14px; border-radius: 2px; opacity: 0 } .okp.on .conf { animation: conf 1.6s var(--glide) var(--cd) both }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0) } 100% { opacity: 0; transform: translate(var(--cx), var(--cy)) rotate(var(--cr)) } }
/* a check mark pops into an empty box */
.ck { z-index: 2; opacity: 0; transform: scale(.2) rotate(-25deg); transition: transform .45s var(--pop), opacity .15s } .ck.on { opacity: 1; transform: none }
.dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--sb); z-index: 7; transform: scale(0) }
.dot.on { animation: dot .5s var(--pop) both } @keyframes dot { to { transform: scale(1) } }

/* the camera: a receipt slides into the frame, the corners lock on, a scan line reads it */
.cam { position: absolute; left: 16px; top: 132px; width: 358px; height: 470px; z-index: 2 }
.paper { position: absolute; left: 31px; top: 62px; width: 198px; scale: 1.5; transform-origin: 0 0; padding: 16px 14px 18px; background: #f6f2ea; color: #222; border-radius: 3px; font: 500 8.6px/1.55 "Geist Mono", ui-monospace, Menlo, monospace;
  box-shadow: 0 14px 30px rgba(0, 0, 0, .55); transform: translateY(420px) rotate(-9deg); opacity: 0; transition: transform .9s var(--pop), opacity .3s;
  -webkit-mask: radial-gradient(4px at 6px 100%, transparent 98%, #000) -6px 0 / 12px 100% repeat-x; }
.paper.in { transform: rotate(-1.5deg); opacity: 1 }
.paper h4 { font: 700 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-align: center } .paper .d { text-align: center; color: #777; margin: 4px 0 10px }
.paper p { display: flex; justify-content: space-between; border-radius: 2px; transition: background .25s } .paper p.hit { background: rgba(255, 10, 60, .16) }
.paper hr { border: 0; border-top: 1px dashed #aaa; margin: 8px 0 }
.paper .tot { font-weight: 700; font-size: 10px }
.brk { position: absolute; width: 26px; height: 26px; border: 3px solid #fff; transition: all .5s var(--pop); opacity: .9 }
.brk.a { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0 } .brk.b { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0 }
.brk.c { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px } .brk.d { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0 }
.cam.lock .brk { border-color: var(--sb) } .cam.lock .brk.a { left: 18px; top: 50px } .cam.lock .brk.b { right: 18px; top: 50px } .cam.lock .brk.c { left: 18px; bottom: 50px } .cam.lock .brk.d { right: 18px; bottom: 50px }
.scanl { position: absolute; left: 26px; right: 26px; top: 58px; height: 3px; border-radius: 2px; background: var(--sb); box-shadow: 0 0 18px 6px rgba(255, 10, 60, .55); opacity: 0 }
.scanl.go { animation: scan 1.5s ease-in-out 2 }
@keyframes scan { 0% { opacity: 0; top: 58px } 10% { opacity: 1 } 50% { top: 408px } 90% { opacity: 1 } 100% { opacity: 0; top: 58px } }
.chip { position: absolute; left: 50%; top: 614px; z-index: 4; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: #fff; color: #111; font: 600 13px Geist, sans-serif; opacity: 0; transform: translateY(10px) scale(.9); transition: all .45s var(--pop) }
.chip.on { opacity: 1; transform: none } .chip i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ddd; border-top-color: var(--sb); animation: spin .7s linear infinite } @keyframes spin { to { transform: rotate(360deg) } }
.chip.done i { animation: none; border-color: #12b76a; background: #12b76a }
.flash { position: absolute; inset: 0; z-index: 9; background: #fff; opacity: 0; pointer-events: none } .flash.on { animation: flash .45s ease-out } @keyframes flash { 0% { opacity: .9 } 100% { opacity: 0 } }

.touch { position: absolute; left: 0; top: 0; z-index: 20; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255, 255, 255, .22); border: 2px solid rgba(255, 255, 255, .9);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .3); opacity: 0; pointer-events: none; transform: translate(var(--x, 195px), var(--y, 700px)) scale(var(--s, 1)); transition: transform .5s var(--out), opacity .25s }
.touch.on { opacity: 1 } .touch.dn { --s: .74; transition: transform .12s }
.touch::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(255, 10, 60, .85); opacity: 0 } .touch.tap::after { animation: rip .5s ease-out }
@keyframes rip { 0% { transform: scale(.6); opacity: 1 } 100% { transform: scale(2); opacity: 0 } }

/* portrait frames (phones): the title and the current step on top, the phone below */
#st.v { width: 600px; height: 880px }
#st.v .side { left: 44px; top: 56px; translate: none; width: 512px; text-align: center }
#st.v .side h2 { margin: 10px 0 6px; font-size: 32px }
#st.v .dial { padding-left: 0 } #st.v .dial .tk, #st.v .dial .nd { display: none }
#st.v .dial li { display: none; height: 40px } #st.v .dial li.on { display: flex; justify-content: center; transform: none }
#st.v .dial li.on::before { content: attr(data-n); font: 600 12px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--red); margin-right: 12px }
#st.v .dev { left: 163px; top: 206px; transform: scale(.7) }
/* dark: only the stage changes */
html[data-theme="dark"], html[data-theme="dark"] body { background: #16181b }
[data-theme="dark"] .side .k { color: #d58a93 } [data-theme="dark"] .side h2 { color: #f2f2ef }
[data-theme="dark"] .dial .tk i { background: #f2f2ef } [data-theme="dark"] .dial li { color: #5f615d } [data-theme="dark"] .dial li.on { color: #f2f2ef } [data-theme="dark"] .dial li.done { color: #a4a6a1 }
[data-theme="dark"] .dev { box-shadow: 0 0 0 10px #000, 0 0 0 11px #3a3a3a, 0 40px 80px -30px rgba(0, 0, 0, .7) }
/* fluid: long, soft curves everywhere. Screens glide in over the one before (which drifts back and dims), crossfades breathe,
   sheets settle with a gentle spring, the finger travels on an arc-like ease, and scrolling carries on after the finger lifts */
:root { --glide: cubic-bezier(.16, 1, .3, 1); --soft: cubic-bezier(.25, 1.25, .45, 1); --drift: cubic-bezier(.45, 0, .2, 1) }
.app > * { transition: opacity .5s var(--drift) } .app.rest > * { opacity: 0 !important }   /* between loops the screen fades to black, never to the page colour */
.scr { transition: transform .85s var(--glide), filter .85s var(--glide), opacity .6s var(--drift), box-shadow .85s var(--glide); will-change: transform }
.scr.on:not(.fade):not(.zoom) { box-shadow: -24px 0 48px -12px rgba(0, 0, 0, .6) }
.scr.back { transform: translateX(-30%) scale(.94); filter: brightness(.45) blur(1px) }
.scr.fade { transform: scale(.985); opacity: 0; transition: opacity .7s var(--drift), transform .9s var(--glide) } .scr.fade.on { opacity: 1; transform: none }
.scr.zoom { transform: scale(1.08); opacity: 0; transition: transform 1s var(--glide), opacity .7s var(--drift) }
.long { transition: transform 1.25s cubic-bezier(.12, .8, .2, 1) }
.on .r, .r.in, .rv.in { animation-duration: .95s; animation-timing-function: var(--soft) }
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.96); filter: blur(2px) } 60% { filter: blur(0) } to { opacity: 1; transform: none; filter: none } }
.ov .dim { transition: opacity .55s var(--drift) }
.ov .sheet { transition: transform .85s var(--soft) } .ov.out .sheet { transition: transform .5s var(--drift) }
.ov .card { transition: transform .8s var(--soft), opacity .35s var(--drift) } .ov.out .card { transition: transform .45s var(--drift), opacity .35s var(--drift) }
.ov .opt { transition: transform .75s var(--soft) var(--d), opacity .35s var(--drift) var(--d) }
.ov .x { transition: transform .75s var(--soft), opacity .3s }
.touch { transition: transform .75s var(--drift), opacity .35s var(--drift) } .touch.dn { transition: transform .16s var(--drift) }
.touch.tap::after { animation: rip .65s var(--glide) }
.brow { transition: transform .7s var(--glide), opacity .45s var(--drift) }
.bbar { transition: transform .8s var(--soft) } .chipx { transition: transform .7s var(--soft), opacity .3s } .ck { transition: transform .6s var(--soft), opacity .2s }
.paper { transition: transform 1.15s var(--soft), opacity .5s var(--drift) } .brk { transition: all .7s var(--soft) }
.chip { transition: all .6s var(--soft) }
.press { animation: press .45s var(--soft) }
/* opening: the sign-up screen opens as a circle from the Buddy on the splash; sign up opens Home as a circle from the button */
.scr.curtain { z-index: 6; transform: translateY(-104%) !important; border-radius: 0 0 56px 56px; transition: transform 1.05s cubic-bezier(.7, 0, .2, 1), border-radius 1.05s; opacity: 1 !important }
.scr.under { transform: translateY(70px) scale(.94); opacity: .3; filter: none; transition: none }
.scr.under.go { transform: none; opacity: 1; transition: transform 1.15s var(--glide) .12s, opacity .7s var(--drift) .12s }
.scr.circ { z-index: 6; transform: none; opacity: 1; clip-path: circle(0 at var(--cx) var(--cy)); transition: clip-path 1s cubic-bezier(.65, 0, .25, 1) }
.scr.circ.on { clip-path: circle(140% at var(--cx) var(--cy)) }
.scr.sunk { transform: scale(.94); filter: brightness(.6); transition: transform 1s var(--glide), filter 1s var(--drift) }
/* the camera opens on a live view: the receipt is already on the table, the picture drifts a little like a hand-held phone */
.feed { position: absolute; left: -14px; top: 118px; width: 418px; height: 498px; z-index: 1; overflow: hidden;
  background: radial-gradient(120% 80% at 30% 20%, rgba(255, 220, 170, .18), transparent 60%), repeating-linear-gradient(94deg, #6b4a2f 0 14px, #5f412a 14px 22px, #735036 22px 41px, #5a3d27 41px 52px);
  filter: saturate(.9) brightness(.82) }
.feed .glare { position: absolute; inset: -20%; background: radial-gradient(40% 30% at 70% 30%, rgba(255, 255, 255, .12), transparent 70%) }
.on .feed, .on .cam { animation: sway 3.2s ease-in-out infinite alternate } @keyframes sway { 0% { transform: translate(0, 0) rotate(0) } 50% { transform: translate(3px, -2px) rotate(.4deg) } 100% { transform: translate(-2px, 3px) rotate(-.3deg) } }
.cam.lock, .on .cam.lock { animation: none }
.paper.in { transform: rotate(-4deg) translate(4px, 6px); transition: transform .8s var(--soft) } .cam.lock .paper.in { transform: rotate(-1.5deg) }
.scr.on .cam { transition: none }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important } .touch { display: none } .r { opacity: 1 } }
