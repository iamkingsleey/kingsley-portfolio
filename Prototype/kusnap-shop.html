<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store verification, from the dashboard</title>
<style>
/* Store verification from the seller dashboard: Get Verified Now → the store verification intro → Start Application → the eligibility check.
   A cursor plays it on a loop. Everything is sized in vw so it scales with the 3:2 frame. */
:root { color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6 }
body { display: grid; place-items: center }
.win { position: relative; width: 84vw; height: 56vw; border-radius: 1vw; overflow: hidden; background: #fff;
  box-shadow: 0 .4vw 1vw rgba(16, 24, 40, .05), 0 3vw 6vw -3vw rgba(16, 24, 40, .22) }
.scr { position: absolute; inset: 0; opacity: 0; transform: translateY(1.2vw); transition: opacity .22s ease, transform 0s .22s; pointer-events: none }
/* the old screen clears first, then the new one rises in, so the two never overlap */
.scr.on { opacity: 1; transform: none; transition: opacity .45s ease .2s, transform .65s cubic-bezier(.2, .8, .2, 1) .2s }
.scr img { display: block; width: 100%; height: auto }
/* cursor */
.cu { position: absolute; left: 0; top: 0; width: 2.1vw; height: 2.1vw; z-index: 5; pointer-events: none; opacity: 0;
  transform: translate(var(--x, 60vw), var(--y, 40vw)); transition: transform .95s cubic-bezier(.45, .05, .2, 1), opacity .35s; filter: drop-shadow(0 .15vw .25vw rgba(16, 24, 40, .25)) }
.cu.on { opacity: 1 }
.cu svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .12s, opacity .15s; transform-origin: 25% 15% }
.cu .hd { opacity: 0 } .cu.hand .hd { opacity: 1 } .cu.hand .ar { opacity: 0 } .cu.down svg { transform: scale(.84) }
.cu i { position: absolute; left: .5vw; top: .3vw; width: 3vw; height: 3vw; margin: -1.5vw 0 0 -1.5vw; border-radius: 50%; background: rgba(30, 135, 229, .28); transform: scale(0); opacity: 0 }
.cu.tap i { animation: tap .5s ease-out } @keyframes tap { 0% { transform: scale(.2); opacity: 1 } 100% { transform: scale(1.4); opacity: 0 } }
/* a light press on the button under the cursor */
.hl { position: absolute; border-radius: .5vw; background: rgba(255, 255, 255, .14); opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 4 }
/* the secondary buttons on the eligibility check have no outline at rest: the outline only appears on hover */
.hl.on { opacity: 1 } .hl.ln { background: transparent; box-shadow: inset 0 0 0 1px #101828; border-radius: var(--r) }
@media (prefers-reduced-motion: reduce) { .scr { transition: none } .cu { display: none } }
</style>
</head>
<body>
<div class="win" id="w">
  <div class="scr on" data-w="1440"><img alt="Kusnap seller dashboard, Manage › Shops, with a Get Your Store Verified card and a Get Verified Now button" src="kusnap-shop-img/i-b4ac1994.webp"></div>
  <div class="scr" data-w="1536"><img alt="Get Your Store Verified: a verified store illustration, the benefits of verification and a Start Application button" src="kusnap-shop-img/i-32d254eb.webp"></div>
  <div class="scr" data-w="1536"><img alt="Check Your Eligibility: uploaded products 3 of 5 with Upload Product, shop status with Create Shop, and Continue disabled" src="kusnap-shop-img/i-b34d48d9.webp"></div>
  <div class="hl" id="hl"></div>
  <span class="cu" id="cu" aria-hidden="true"><i></i><svg class="ar" viewBox="0 0 26 26"><path d="M6 3.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5h6.3z" fill="#101828" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="hd" viewBox="0 0 26 26"><path d="M9.2 12.4V5.6a1.7 1.7 0 0 1 3.4 0v5.3l.1-1.2a1.6 1.6 0 0 1 3.2.2v1.3a1.6 1.6 0 0 1 3.1.4v1.1a1.5 1.5 0 0 1 3 .3v4.4c0 3.5-2.6 6.1-6.1 6.1h-1.6c-2 0-3.4-.8-4.6-2.4l-3.6-4.8a1.6 1.6 0 0 1 2.4-2.1z" fill="#fff" stroke="#101828" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
</div>
<script>
const w = document.getElementById('w'), scr = [...w.querySelectorAll('.scr')], cu = document.getElementById('cu'), hl = document.getElementById('hl');
const sleep = ms => new Promise(r => setTimeout(r, ms));
// screen pixels → window pixels, for whichever screen is showing
const k = i => w.clientWidth / +scr[i].dataset.w;
const at = (i, x, y) => { cu.style.setProperty('--x', x * k(i) - cu.clientWidth * .25 + 'px'); cu.style.setProperty('--y', y * k(i) - cu.clientHeight * .12 + 'px'); };
const box = (i, x0, y0, x1, y1, light) => { const s = k(i); Object.assign(hl.style, { left: x0 * s + 'px', top: y0 * s + 'px', width: (x1 - x0) * s + 'px', height: (y1 - y0) * s + 'px' }); hl.classList.toggle('ln', !!light); hl.style.setProperty('--r', 9 * s + 'px'); };
const show = i => scr.forEach((s, j) => s.classList.toggle('on', i === j));
const hover = async on => { cu.classList.toggle('hand', on); hl.classList.toggle('on', on); };
const click = async () => { cu.classList.add('down'); await sleep(130); cu.classList.remove('down', 'tap'); void cu.offsetWidth; cu.classList.add('tap'); await sleep(160); };
let visible = true; new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(document.body);
async function loop() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  while (true) {
    while (!visible) await sleep(300);
    show(0); cu.style.transition = 'none'; at(0, 900, 700); void cu.offsetWidth; cu.style.transition = ''; await sleep(900);
    // 1 · dashboard: Get Verified Now
    cu.classList.add('on'); at(0, 1312, 166); await sleep(1100);
    box(0, 1242, 143, 1380, 183); await hover(true); await sleep(450); await click(); await hover(false);
    show(1); await sleep(300); at(1, 700, 760); await sleep(1500);
    // 2 · the intro: Start Application
    at(1, 484, 880); await sleep(1000);
    box(1, 414, 860, 551, 897); await hover(true); await sleep(450); await click(); await hover(false);
    show(2); await sleep(300); at(2, 820, 520); await sleep(1300);
    // 3 · eligibility: look over what's still needed
    at(2, 1074, 483); await sleep(1000); box(2, 1012, 463, 1134, 499, true); await hover(true); await sleep(1100); await hover(false);
    at(2, 1074, 644); await sleep(800); box(2, 1012, 624, 1134, 660, true); await hover(true); await sleep(1100); await hover(false);
    at(2, 1150, 900); await sleep(1600);
    cu.classList.remove('on'); await sleep(600);
  }
}
addEventListener('load', loop);
</script>
</body>
</html>
