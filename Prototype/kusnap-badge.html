<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified badge, desktop to mobile</title>
<style>
/* One device that reshapes itself: a desktop browser that narrows into a phone, keeping the seller's verified tick in view. Sized in vw so it scales with the frame. */
:root { --ease: cubic-bezier(.65, 0, .25, 1); color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f3f6; font-family: Inter, system-ui, -apple-system, sans-serif }
body { display: grid; place-items: center }
.stage { position: relative; display: grid; justify-items: center; gap: 1.6vw }
.dev { position: relative; width: 78vw; height: 52vw; border-radius: 1.2vw; padding: 0; background: #fff; overflow: hidden;
  box-shadow: 0 .4vw 1vw rgba(16, 24, 40, .06), 0 3vw 6vw -3vw rgba(16, 24, 40, .28);
  transition: width 1.25s var(--ease), height 1.25s var(--ease), border-radius 1.25s var(--ease), padding 1.25s var(--ease), background 1.25s var(--ease) }
.m .dev { width: 24vw; height: 51vw; border-radius: 3.8vw; padding: .75vw; background: #101828 }
.scr { position: relative; width: 100%; height: 100%; border-radius: 0; overflow: hidden; background: #fff; transition: border-radius 1.25s var(--ease) }
.m .scr { border-radius: 3.1vw }
/* desktop browser bar */
.bar { height: 3vw; display: flex; align-items: center; gap: .55vw; padding: 0 1.2vw; border-bottom: .1vw solid #eaecf0; background: #fafbfc; transition: height 1s var(--ease), opacity .5s }
.bar i { width: .75vw; height: .75vw; border-radius: 50%; background: #e4e7ec } .bar span { margin: 0 auto; font-size: 1vw; color: #667085; background: #f2f4f7; padding: .3vw 1.6vw; border-radius: 9vw; translate: -2vw 0 }
.m .bar { height: 0; opacity: 0 }
.lay { position: absolute; left: 0; right: 0; top: 3vw; transition: opacity .7s ease, top 1s var(--ease) }
.m .lay { top: 0 }
.lay img { display: block; width: 100%; height: auto }
.desk { opacity: 1; transition: opacity .6s ease .55s, top 1s var(--ease) } .m .desk { opacity: 0; transition: opacity .5s ease .2s, top 1s var(--ease) }
.mob { opacity: 0 } .m .mob { opacity: 1; transition: opacity .7s ease .45s, top 1s var(--ease) }
.mob .roll { transition: transform 1.6s var(--ease) }
/* the pulse on the tick */
.ring { position: absolute; width: 4vw; height: 4vw; margin: -2vw 0 0 -2vw; border-radius: 50%; pointer-events: none }
.ring::before, .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: .2vw solid #0b6fd6; opacity: 0 }
.ring.go::before { animation: pulse 1.2s var(--ease) 2 } .ring.go::after { animation: pulse 1.2s var(--ease) .35s 2 }
@keyframes pulse { 0% { transform: scale(.35); opacity: .9 } 100% { transform: scale(1.5); opacity: 0 } }
.lbl { display: flex; gap: 1.6vw; font-size: 1.3vw; font-weight: 500; color: #98a2b3; letter-spacing: .02em }
.lbl b { font-weight: 500; transition: color .4s } .lbl b.on { color: #101828 }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation: none !important } }

<script>
const st = document.getElementById('st'), roll = document.getElementById('roll'), mimg = document.getElementById('mimg');
const rd = document.querySelector('#cd .vb'), rm = document.querySelector('#cm .vb'), ld = document.getElementById('ld'), lm = document.getElementById('lm');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pulse = async r => { r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); await sleep(2700); r.classList.remove('go'); };
// scroll the phone so the seller card sits a little above the middle of its screen
const toSeller = () => { const sh = roll.parentElement.parentElement.clientHeight, ih = mimg.clientHeight; roll.style.transform = `translateY(${-(ih * .4847 - sh * .42)}px)`; };
let visible = true; new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(document.body);
async function loop() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  await sleep(700);
  while (true) {
    while (!visible) await sleep(300);
    await pulse(rd); await sleep(300);
    st.classList.add('m'); ld.classList.remove('on'); lm.classList.add('on'); await sleep(1600);
    toSeller(); await sleep(1800);
    await pulse(rm); await sleep(500);
    roll.style.transform = 'translateY(0)'; await sleep(900);
    st.classList.remove('m'); lm.classList.remove('on'); ld.classList.add('on'); await sleep(1800);
  }
}
addEventListener('load', loop);
</script>
