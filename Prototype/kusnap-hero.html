<title>Kusnap bento</title>
<style>
/* The bento cover, assembled tile by tile. Each tile shows its own patch of the full picture, rising into place in reading order;
   the full picture then settles on top so stickers that cross tile edges are whole again. */
:root { --ease: cubic-bezier(.2, .8, .2, 1); color-scheme: light }
* { box-sizing: border-box; margin: 0 }
html, body { height: 100%; overflow: hidden; background: #f1f4f9 }
.b { position: absolute; inset: 0 }
.t { position: absolute; background-image: var(--img); background-size: var(--bw) var(--bh); background-position: var(--bx) var(--by); background-repeat: no-repeat;
  opacity: 0; transform: translateY(2.2%) scale(.94); transition: opacity .7s var(--ease), transform .9s var(--ease); will-change: transform, opacity }
.on .t { opacity: 1; transform: none }
.full { position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; opacity: 0; transition: opacity .6s ease }
.done .full { opacity: 1 }
/* afterwards the category icons take turns hopping in their circles, on a loop. The circle stays put; only the whole icon
   (exported from Figma without its mask) moves inside it, so the part normally hidden below the circle's edge shows as it jumps. */
.dc { position: absolute; border-radius: 50%; visibility: hidden }
.dc.hop { visibility: visible }
.dc .cl { position: absolute; border-radius: 50%; overflow: hidden }
.dc img { position: absolute; display: block }
.dc.hop img { animation: hop .95s cubic-bezier(.3, .7, .3, 1) both }
@keyframes hop { 0% { transform: translateY(0) } 34% { transform: translateY(-24%) } 60% { transform: translateY(0) } 76% { transform: translateY(-6%) } 100% { transform: translateY(0) } }
/* the shield floats: it rises and settles, and its shadow fades a little as it rises */
.sh, .shd { position: absolute; visibility: hidden }
.done .sh, .done .shd { visibility: visible }
.sh { background: #e6ebef; overflow: visible }
.sh i { position: absolute; inset: 0; background-image: var(--img); background-repeat: no-repeat; background-size: var(--bw) var(--bh); background-position: var(--bx) var(--by) }
.sh i { transform-origin: 50% 96% }
.done .sh i { animation: jump 2.9s infinite }
/* crouch, spring up, hang, drop, squash on landing, a small rebound, rest */
@keyframes jump {
  0% { transform: none; animation-timing-function: ease-out }
  9% { transform: scale(1.05, .92); animation-timing-function: cubic-bezier(.2, .7, .3, 1) }
  27% { transform: translateY(-17%) scale(.97, 1.04) rotate(-3deg); animation-timing-function: ease-in-out }
  33% { transform: translateY(-18%) rotate(-3deg); animation-timing-function: cubic-bezier(.6, 0, .9, .5) }
  47% { transform: translateY(0) scale(1.07, .9); animation-timing-function: cubic-bezier(.2, .7, .3, 1) }
  56% { transform: translateY(-4%) scale(.99, 1.02) rotate(1deg); animation-timing-function: ease-in }
  64% { transform: translateY(0) scale(1.02, .98); animation-timing-function: ease-out }
  70%, 100% { transform: none } }
.shd { border-radius: 50%; background: #e6ebef; opacity: 0 }
.done .shd { animation: shade 2.9s infinite }
@keyframes shade { 0%, 9% { opacity: 0 } 27%, 33% { opacity: .8 } 47% { opacity: 0 } 56% { opacity: .25 } 64%, 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .sh, .shd { display: none } }

.ty, .tyc { position: absolute; visibility: hidden }
.done .ty, .done .tyc { visibility: visible }
.tyc { background: #e6ebef }
.ty { font: 800 8.8vw/1 IK, Inter, system-ui, sans-serif; letter-spacing: -.045em; color: #020c16; white-space: nowrap }
.ty .car { display: inline-block; width: .07em; height: .74em; margin-left: .04em; background: #020c16; border-radius: .02em; vertical-align: -.005em; opacity: 0 }
.ty.idle .car { animation: blink 1s steps(1) infinite } .ty.busy .car { opacity: 1 }
@keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .ty, .tyc { display: none } }
@media (prefers-reduced-motion: reduce) { .t, .dc { display: none } .full { opacity: 1; animation: none !important } }
/* the seller card tile: live, so its text stays sharp and its badge ripples */
.kcl { position: absolute; overflow: hidden; opacity: 0; transform: translateY(2.2%) scale(.94); transition: opacity .7s var(--ease) .9s, transform .9s var(--ease) .9s }
.on .kcl { opacity: 1; transform: none }
.kcl .kcw { position: absolute }

/* The Kusnap seller card, from Figma (Seller Profile, 514 wide). 1em = one Figma pixel, so the card scales as one piece. */
.kcw { container-type: inline-size }
.kc { position: relative; font-size: calc(100cqw / 514); width: 514em; height: var(--kch, 312.5em); background: #fff; border-radius: 16em; font-family: KI, Inter, system-ui, sans-serif; color: #01182b; -webkit-font-smoothing: antialiased }
.kc > * { position: absolute }
.kc .lb { left: 31.1em; top: 29.8em; height: 28.8em; display: flex; align-items: center } .kc .lb span { font-size: 15.5em; font-weight: 500; letter-spacing: .02em; color: #94a3b8 }
.kc .ac { left: 419.3em; top: 29.8em; width: 63.6em; height: 28.8em; border-radius: 7em; background: #f7fff3; display: grid; place-items: center }
.kc .ac span { font-size: 13.5em; font-weight: 500; color: #004d1c }
.kc .av { left: 31.1em; top: 70.1em; width: 51.4em; height: 51.4em; border-radius: 50%; overflow: hidden; background: #6aa8e6 }
.kc .av img { width: 100%; height: 100%; object-fit: cover; display: block }
.kc .nm { left: 98.7em; top: 69.4em; height: 32.5em; display: flex; align-items: center; gap: 8.2em }
.kc .nm b { font-size: 20em; font-weight: 600; letter-spacing: -.01em }
.kc .vb { position: relative; width: 24.3em; height: 24.3em }
.kc .vb svg { position: relative; width: 100%; height: 100%; display: block; z-index: 1 }
.kc .vb i { position: absolute; inset: 0; border-radius: 50%; border: 2em solid #1e87e5; opacity: 0 }
.kc .vb.go i { animation: kcr 1.5s cubic-bezier(.2, .8, .2, 1) infinite } .kc .vb.go i + i { animation-delay: .45s }
@keyframes kcr { 0% { transform: scale(.9); opacity: .85 } 70%, 100% { transform: scale(2.4); opacity: 0 } }
.kc .rt { left: 95.1em; top: 102.1em; height: 27em; display: flex; align-items: center; gap: 5.4em; white-space: nowrap }
.kc .rt svg { width: 22em; height: 22em }
.kc .rt span { font-size: 18em; color: #94a3b8 } .kc .rt span em { font-style: normal; color: #1e87e5 }
.kc .ph { left: 31.1em; bottom: 98.8em; width: 451.8em; height: 48.7em; border-radius: 8em; background: #f8fafb; border: 1em solid #f1f3f6 }
.kc .ph svg { position: absolute; left: 10.8em; top: 12.5em; width: 21.6em; height: 21.6em }
.kc .ph .n { position: absolute; left: 48.7em; top: 0; bottom: 0; display: flex; align-items: center } .kc .ph .n span { font-size: 17.5em; letter-spacing: .02em }
.kc .ph .s { position: absolute; right: 11em; top: 0; bottom: 0; display: flex; align-items: center } .kc .ph .s em { font-size: 16.5em; font-style: normal; color: #1e87e5 }
.kc .bt { left: 31.1em; bottom: 29.8em; width: 451.8em; height: 46em; display: grid; grid-template-columns: 220.5em 216.4em; justify-content: space-between }
.kc .bt span { border: 1.3em solid #d0d5dd; border-radius: 8em; display: grid; place-items: center } .kc .bt span b { font-size: 18.5em; font-weight: 500; color: #032f56 }

/* a cursor on the seller card: Show number → the number appears, the link reads Hide number → hides it again */
.kc .cu { position: absolute; left: 0; top: 0; width: 26em; height: 26em; z-index: 3; pointer-events: none; opacity: 0;
  transform: translate(var(--x, 560em), var(--y, 330em)); transition: transform .95s cubic-bezier(.45, .05, .2, 1), opacity .35s; filter: drop-shadow(0 2em 3em rgba(16, 24, 40, .25)) }
.kc .cu.on { opacity: 1 }
.kc .cu svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .12s, opacity .15s; transform-origin: 25% 15% }
.kc .cu .hd { opacity: 0 } .kc .cu.hand .hd { opacity: 1 } .kc .cu.hand .ar { opacity: 0 } .kc .cu.down svg { transform: scale(.84) }
.kc .cu i { position: absolute; left: 6.5em; top: 4em; width: 36em; height: 36em; margin: -18em 0 0 -18em; border-radius: 50%; background: rgba(30, 135, 229, .25); transform: scale(0); opacity: 0 }
.kc .cu.tap i { animation: kctap .5s ease-out } @keyframes kctap { 0% { transform: scale(.2); opacity: 1 } 100% { transform: scale(1.4); opacity: 0 } }
.kc .ph .n span, .kc .ph .s em { transition: opacity .25s }
.kc .ph .sw { opacity: 0 }
.kc .ph .s em.hov { text-decoration: underline; text-underline-offset: .2em }
/* the shoe tile is a carousel: shoes, groceries, gifts, headphones slide past in turn, on a loop */
.crl { position: absolute; overflow: hidden; border-radius: 3.55% / 4.96%; opacity: 0; transform: translateY(2.2%) scale(.94);
  transition: opacity .7s var(--ease) .63s, transform .9s var(--ease) .63s; isolation: isolate }
.on .crl { opacity: 1; transform: none }
.crl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 0; visibility: hidden }
.crl img.top, .crl img.under { visibility: visible }
.crl img.top { z-index: 2; animation: swapin .3s cubic-bezier(.33, 0, .67, 1) both } .crl img.under { z-index: 1 }
@keyframes swapin { from { opacity: 0; transform: scale(1.04) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .crl { opacity: 1; transform: none } .crl img.top { animation: none } }
</style>
</head>
