<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusnap Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f9fafb; --white: #fff; --g800: #1d2939; --g900: #101828; --g500: #475467; --g300: #98a2b3; --g200: #d0d5dd; --g100: #e4e7ec; --g25: #f8f9fa;
  --ink: #01182b; --brand: #0776d8; --brand-edge: rgba(2, 80, 149, .9); --dark-edge: rgba(0, 8, 14, .9);
  --warn-bg: #fffaeb; --warn: #792e0d; --ok-bg: #ecfdf3; --ok: #054f31; --ok-icon: #039855; --ok-big: #12b76a;
  --card-shadow: 0 0 1px 1px rgba(239, 239, 239, .6);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0 }
html, body { background: var(--bg) }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 500; color: var(--g800); -webkit-font-smoothing: antialiased; min-height: 100vh }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer; border: 0; background: none }
svg { display: block; flex: none }

/* nav */
.nav { position: sticky; top: 0; z-index: 5; height: 66px; background: #fff; box-shadow: 0 1px 4px rgba(12, 12, 13, .05), 0 1px 4px rgba(12, 12, 13, .1) }
.nav-in { max-width: 1208px; height: 100%; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between }
.logo { width: 112px; height: 42px; padding: 0 }
.logo img { width: 112px; height: 42px; display: block }
.me { display: flex; align-items: center }
.av { width: 33px; height: 33px; border-radius: 999px; background: #67bc40; overflow: hidden }
.av img { width: 33px; height: 33px; display: block }
.me b { font-family: Inter, sans-serif; font-weight: 500; font-size: 14px; line-height: 1.43; color: var(--ink); padding: 4px 8px }
.chev { width: 32px; height: 32px; border-radius: 100px; background: var(--bg); display: grid; place-items: center; transition: background .2s }
.me:hover .chev { background: #eef1f5 } .me:hover .chev svg { transform: translateY(1px) } .chev svg { transition: transform .2s }

/* page */
main { padding: clamp(48px, 11vh, 156px) 16px 96px }
.view { margin: 0 auto; animation: in .42s var(--ease) both }
.view.wide { max-width: 829px }
.view.narrow { max-width: 609px }
@keyframes in { from { opacity: 0; transform: translateY(10px) } }
.head { display: flex; flex-direction: column; gap: 4px; line-height: 1.5; margin-bottom: 24px }
.head h1 { font-size: 24px; font-weight: 700 }
.head p { font-size: 16px }
.view.narrow .head { margin-bottom: 23px }
.stack { display: flex; flex-direction: column; gap: 16px }
.view.narrow .stack { gap: 12px }
.card { background: #fff; border-radius: 12px; box-shadow: var(--card-shadow); padding: 39px 35px; transition: box-shadow .3s }
.card:focus-within { box-shadow: 0 0 1px 1px rgba(239, 239, 239, .6), 0 12px 32px -18px rgba(16, 24, 40, .18) }
.card.d1 { box-shadow: 0 1px 4px rgba(12, 12, 13, .05); padding: 39px 40px }
.view.narrow .card { padding: 46px 48px }
.view.narrow .card.id1 { padding: 38px 47px }
.view.narrow .card.id2 { padding: 37px 47px }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px }
.ttl { font-size: 16px; font-weight: 700; line-height: 1.5 }
.txt { font-size: 14px; line-height: 1.8; color: var(--g500) }
.copy { display: flex; flex-direction: column; gap: 12px; max-width: 632px }
.view.narrow .copy { gap: 8px }
.why .copy { max-width: 712px }
.lbl { font-size: 14px; line-height: 1.8 }
.lbl.b { font-weight: 700 }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 24px }
.field.s8 { gap: 8px }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; white-space: nowrap }
.badge svg { width: 18px; height: 18px }
.badge.warn { background: var(--warn-bg); color: var(--warn); min-width: 122px; justify-content: center }
.badge.lock { background: var(--g25); color: var(--g300) }
.badge.ok { background: var(--ok-bg); color: var(--ok) }
.badge.ok svg { color: var(--ok) }
.badge.pop { animation: pop .5s var(--ease) both; position: relative; overflow: hidden }
.badge.ok.pop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .8) 50%, transparent 70%); transform: translateX(-120%); animation: shine .9s .45s var(--ease) forwards }
@keyframes shine { to { transform: translateX(120%) } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.06) } }

/* inputs */
.input { height: 40px; border: 1px solid var(--g100); border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 13px; font-size: 14px; line-height: 1.8; background: #fff; width: 100% }
.input svg { width: 18px; height: 18px }
.input .grow { flex: 1; min-width: 0 }
.input.muted { color: var(--g300) }
.input input, .input select { border: 0; outline: 0; background: none; width: 100%; height: 100%; padding: 0; font-size: 14px; color: var(--g800) }
.input select { appearance: none; -webkit-appearance: none; cursor: pointer }
.input { transition: border-color .2s, box-shadow .2s }
.input:hover { border-color: var(--g200) }
.input:focus-within { border-color: #9cc8f2; box-shadow: 0 0 0 3px rgba(7, 118, 216, .12) }
.input.tx { padding-left: 11px }
.input.sel { padding-right: 10px; position: relative }
.input.sel svg { width: 24px; height: 24px; pointer-events: none; position: absolute; right: 12px }
.link { font-size: 14px; line-height: 1.8; color: var(--g800) }
.link { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .25s var(--ease) }
.link:is(:hover, .hov) { background-size: 100% 1px }
.plain { display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 1.8; color: var(--g900) }
.plain svg { width: 18px; height: 18px; color: var(--g800) }

/* buttons */
.btn { position: relative; height: 48px; border-radius: 8px; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; line-height: 1.43; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; transition: background .2s, transform .22s var(--ease), box-shadow .22s var(--ease) }
.btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none }
.btn.dark { background: var(--g800); width: 231px }
.btn.dark::after { box-shadow: inset 0 -4px 1px var(--dark-edge) }
.btn.blue { background: var(--brand); width: 100% }
.btn.blue::after { box-shadow: inset 0 -4px 1px var(--brand-edge) }
.btn.dark:is(:hover, .hov):not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 18px -6px rgba(16, 24, 40, .45) }
.btn.blue:is(:hover, .hov):not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(7, 118, 216, .6) }
.btn:is(:active, .prs):not(:disabled) { transform: translateY(1px); box-shadow: 0 2px 4px -2px rgba(16, 24, 40, .3); transition-duration: .08s }
.btn:is(:active, .prs):not(:disabled)::after { box-shadow: inset 0 -2px 1px var(--dark-edge) }
.btn.blue:is(:active, .prs):not(:disabled)::after { box-shadow: inset 0 -2px 1px var(--brand-edge) }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .22) 50%, transparent 65%); transform: translateX(-120%); pointer-events: none }
.btn:is(:hover, .hov):not(:disabled)::before { transform: translateX(120%); transition: transform .7s var(--ease) }
.btn.dark:is(:hover, .hov):not(:disabled) { background: #26354a }
.btn.blue:is(:hover, .hov):not(:disabled) { background: #0a6cc4 }
.btn:disabled { background: var(--g200); cursor: default; height: 29px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; margin: 9px 0 10px }
.btn:disabled::after { box-shadow: none }
.btn .spin { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite }
.flat { background: var(--g800); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; width: 100%; transition: background .2s, transform .22s var(--ease), box-shadow .22s var(--ease) }
.flat:is(:hover, .hov):not(.off) { background: #26354a; transform: translateY(-2px); box-shadow: 0 8px 18px -6px rgba(16, 24, 40, .45) }
.flat:is(:active, .prs):not(.off) { transform: translateY(1px); box-shadow: none; transition-duration: .08s }
.flat.off { background: var(--g200); cursor: default }
.btnwrap { margin-top: 24px; display: inline-block }
.card.locked .ttl { color: var(--g300) }
.card.locked .txt { color: var(--g200) }
.card.locked .flat { width: 182px }

/* otp */
.otp { display: flex; gap: 12px }
.otp input { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--g100); background: #fff; text-align: center; font-size: 16px; font-weight: 800; line-height: 1.8; color: var(--g800); outline: 0; padding: 0; caret-color: var(--brand); transition: background .15s, border-color .15s, box-shadow .15s }
.otp input.on { background: var(--g25); border-color: transparent; box-shadow: 0 0 1px rgba(0, 0, 0, .1) }
.otp input.land { animation: land .32s var(--ease) }
@keyframes land { 0% { transform: translateY(-5px) scale(.9) } 60% { transform: translateY(1px) scale(1.04) } }
.otp input:focus { border-color: #9cc8f2; box-shadow: 0 0 0 3px rgba(7, 118, 216, .12) }
.otp.shake { animation: shake .36s }
@keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
.resend { display: flex; gap: 85px; font-size: 13px; line-height: 1.8; margin-top: 12px; white-space: nowrap }
.resend span:first-child { color: var(--g500) }
.resend .rs { color: var(--g300) }
.resend button.rs { color: var(--brand); font-size: 13px; padding: 0 }
.resend button.rs:hover { text-decoration: underline }
.codewrap { max-width: 300px; margin-top: 24px }
.form { display: flex; flex-direction: column; gap: 16px }
.form .field { margin: 0 }
.actions { margin-top: 32px }
.err { color: #b42318; font-size: 13px; line-height: 1.5; margin-top: 6px; min-height: 0 }

/* centre cards */
.centre { min-height: 264px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 40px 24px !important }
.centre .ic { width: 32px; height: 32px; color: var(--ok-big) }
.centre .ic.draw path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .45s .15s var(--ease) forwards }
@keyframes draw { to { stroke-dashoffset: 0 } }
.centre .ic circle { transform-origin: center; animation: pop .45s var(--ease) both }
.centre .msg { display: flex; flex-direction: column; align-items: center; gap: 4px }
.centre .msg > div { display: flex; flex-direction: column; align-items: center; gap: 8px }
.centre .wide-btn { width: 252px }
.loading { min-height: 208px; gap: 24px }
.vload { gap: 28px; padding: 48px 40px !important }
.ring { position: relative; width: 76px; height: 76px }
.ring svg { position: absolute; inset: 0; width: 76px; height: 76px; transform: rotate(-90deg) }
.ring .trk { fill: none; stroke: #eef1f5; stroke-width: 4 }
.ring .bar { fill: none; stroke: var(--brand); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 207.3; stroke-dashoffset: 207.3; transition: stroke-dashoffset .9s var(--ease), stroke .3s }
.ring.done .bar { stroke: var(--ok-big) }
.ring .glint { fill: none; stroke: rgba(7, 118, 216, .16); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 18 190; transform-origin: 38px 38px; animation: orbit 1.6s linear infinite }
.ring.done .glint { opacity: 0; transition: opacity .3s }
@keyframes orbit { to { transform: rotate(360deg) } }
.ring .mid { position: absolute; inset: 14px; border-radius: 50%; background: #f2f7fd; display: grid; place-items: center; color: var(--brand); transition: background .3s, color .3s }
.ring .mid svg { position: static; width: 24px; height: 24px; transform: none }
.ring .mid .scan { position: absolute; left: 10px; right: 10px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--brand), transparent); animation: scan 1.4s ease-in-out infinite alternate; opacity: .7 }
@keyframes scan { from { top: 14px } to { top: 32px } }
.ring.done .mid { background: var(--ok-bg); color: var(--ok-big) }
.ring.done .mid .scan { display: none }
.vtitle { display: flex; flex-direction: column; align-items: center; gap: 4px }
.vtitle .txt { min-height: 25px; transition: opacity .2s }
.vtitle .txt.swap { opacity: 0 }
.checks { list-style: none; padding: 0; display: grid; gap: 12px; width: min(100%, 320px); text-align: left }
.checks li { display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 1.5; color: var(--g300); transition: color .3s }
.checks li.on { color: var(--g800) }
.checks li.ok { color: var(--g500) }
.checks .st { position: relative; width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--g100); transition: border-color .3s, background .3s }
.checks li.on .st { border-color: #cfe3f7; border-top-color: var(--brand); animation: rot .8s linear infinite }
.checks li.ok .st { border-color: var(--ok-big); background: var(--ok-big); animation: pop .4s var(--ease) both }
.checks li.ok .st::after { content: ''; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) }
/* fields typing themselves in */
.input.typing { border-color: #9cc8f2; box-shadow: 0 0 0 3px rgba(7, 118, 216, .12) }
.spinner { width: 32px; height: 32px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 25%, var(--g800) 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); animation: rot .9s linear infinite }
@keyframes rot { to { transform: rotate(360deg) } }

/* help + replay */
.help { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 48px; font-size: 14px; line-height: 1.8; color: var(--g500) }
.help svg { width: 20px; height: 20px; color: var(--g800) }
.help a { color: var(--g800); font-weight: 700; margin-left: 4px; text-decoration: none }
.replay { display: flex; justify-content: center; margin-top: 40px }
.replay button { font-size: 13px; color: var(--g300); display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px }
.replay button { transition: color .2s, background .2s } .replay button svg { transition: transform .5s var(--ease) }
.replay button:is(:hover, .hov) { color: var(--g500); background: #f2f4f7 } .replay button:is(:hover, .hov) svg { transform: rotate(-200deg) }

/* the code arrives as a message */
.sms { position: fixed; top: 80px; right: 16px; z-index: 9; width: min(340px, calc(100vw - 32px)); background: rgba(255, 255, 255, .92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 16px; box-shadow: 0 10px 30px rgba(16, 24, 40, .14), 0 0 0 1px rgba(16, 24, 40, .05); padding: 12px 14px; display: flex; gap: 12px; text-align: left; transform: translateY(-16px); opacity: 0; pointer-events: none; transition: transform .45s var(--ease), opacity .3s }
.sms.show { transform: none; opacity: 1; pointer-events: auto; cursor: pointer }
.sms.show:is(:hover, .hov) { transform: translateY(-3px) scale(1.01); box-shadow: 0 16px 36px rgba(16, 24, 40, .18), 0 0 0 1px rgba(16, 24, 40, .06) }
.sms.show.prs { transform: scale(.98); transition-duration: .08s }
.sms .app { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(#5bf675, #29c445); display: grid; place-items: center; color: #fff; flex: none }
.sms .app svg { width: 20px; height: 20px }
.sms .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--g500); line-height: 1.4 }
.sms .top b { color: var(--g800); font-weight: 700 }
.sms p { font-size: 13px; line-height: 1.45; color: var(--g800); margin-top: 2px }
.sms em { font-style: normal; color: var(--brand); font-size: 12px; display: block; margin-top: 4px }

@media (max-width: 640px) {
  .card, .card.d1, .view.narrow .card, .view.narrow .card.id1, .view.narrow .card.id2 { padding: 28px 20px }
  .row { flex-direction: column-reverse; gap: 12px }
  .badge.warn { min-width: 0 }
  .otp { gap: 8px }
  .resend { gap: 24px; justify-content: space-between }
  .codewrap { max-width: 288px }
  .btn.dark, .card.locked .flat { width: 100% }
  .btnwrap { display: block }
  .me b { display: none }
}
/* autoplay: a cursor walks through the flow on its own */
.cur { position: fixed; z-index: 20; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--x, 50vw), var(--y, 60vh)); transition: transform .9s cubic-bezier(.45, .05, .2, 1), opacity .3s; filter: drop-shadow(0 2px 3px rgba(16, 24, 40, .25)) }
.cur.on { opacity: 1 }
.cur svg { position: absolute; left: 0; top: 0; width: 26px; height: 26px; transform-origin: 6px 4px; transition: transform .12s, opacity .15s }
.cur .hd { opacity: 0; transform-origin: 10px 4px } .cur.hand .hd { opacity: 1 } .cur.hand .ar { opacity: 0 }
.cur.down svg { transform: scale(.82) }
.cur i { position: absolute; left: 6px; top: 4px; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(7, 118, 216, .22); transform: scale(0); opacity: 0 }
.cur.tap i { animation: tap .5s ease-out }
@keyframes tap { 0% { transform: scale(.2); opacity: 1 } 100% { transform: scale(1.4); opacity: 0 } }
.demo-chip { position: fixed; left: 50%; bottom: 16px; z-index: 21; translate: -50% 0; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(16, 24, 40, .86); color: #fff; font-size: 12.5px; line-height: 1.3; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; pointer-events: none }
.demo-chip.on { opacity: 1; transform: none }
.demo-chip b { width: 7px; height: 7px; border-radius: 50%; background: #32d583; box-shadow: 0 0 0 0 rgba(50, 213, 131, .6); animation: live 1.6s infinite }
@keyframes live { 70% { box-shadow: 0 0 0 7px rgba(50, 213, 131, 0) } 100% { box-shadow: 0 0 0 0 rgba(50, 213, 131, 0) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important } }
</style>
</head>

const busy = (b, label) => { b.disabled = false; b.innerHTML = `<span class="spin"></span>${label}`; b.style.pointerEvents = 'none' };

function go(view, ...a) { clear(); app.innerHTML = ''; V[view](...a); scrollTo({ top: 0 }); }

const V = {
  // 1 · nothing verified yet
  start() {
    app.innerHTML = `<section class="view wide">
      <div class="head"><h1>Verify Your Account!</h1><p>Verification helps us keep Kusnap secure for everyone</p></div>
      <div class="stack">
        <div class="card d1"><div class="row"><div class="copy"><p class="ttl">Phone Number Verification</p><p class="txt">Verify your phone number to secure your account and enable key features.</p></div>
          <span class="badge warn">${I.error}Incomplete</span></div>
          <div class="field"><p class="lbl">Phone Number</p><div class="input">${I.call}<span>${PHONE}</span></div></div>
          <div class="btnwrap"><button class="btn dark" id="go">Verify phone number</button></div></div>
        <div class="card d1 locked"><div class="row"><div class="copy"><p class="ttl">ID Verification</p><p class="txt">Confirm your identity with a government-issued ID for a safer marketplace experience</p></div>
          <span class="badge lock">${I.lock}Locked</span></div>
          <div class="btnwrap"><button class="flat off" disabled title="Verify your phone number first">Start ID Verification</button></div></div>
      </div>${help}</section>`;
    document.getElementById('go').onclick = () => go('checkPhone');
  },

  // 2 · step 1 of 2: the six digit code
  code() {
    app.innerHTML = `<section class="view narrow">
      <div class="head"><h1>Step 1 of 2</h1></div>
      <div class="stack">
        <div class="card"><div class="copy"><p class="ttl">Verify your Phone Number</p><p class="txt">Secure your account and access all features  by verifying your phone number.</p></div></div>
        <div class="card">
          <div class="field s8" style="margin:0"><p class="lbl">Phone Number</p><div class="input muted" id="ph">${I.call}<span class="grow">${PHONE}</span><button class="link" id="chg">Change</button></div></div>
          <div class="codewrap"><p class="lbl" style="margin-bottom:8px">Enter the 6-digit code</p>
            <div class="otp" id="otp">${'<input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit">'.repeat(6)}</div>
            <p class="resend"><span>Didn’t receive code?</span><span class="rs" id="rs">Resend in 30s</span></p></div>
          <div class="actions"><button class="btn blue" id="vf" disabled>Verify</button></div>
        </div>
        ${why()}
      </div></section>`;
    const box = [...document.querySelectorAll('#otp input')], vf = document.getElementById('vf'), ph = document.getElementById('ph');
    const val = () => box.map(b => b.value).join('');
    const sync = () => {
      box.forEach(b => b.classList.toggle('on', !!b.value));
      const full = val().length === 6;
      vf.disabled = !full; vf.textContent = full ? 'Verify phone number' : 'Verify';
      ph.classList.toggle('muted', !full);
    };
    const fill = code => { [...code].slice(0, 6).forEach((d, i) => box[i].value = d); sync(); if (val().length === 6) document.activeElement.blur(); else box[Math.min(code.length, 5)].focus(); };
    box.forEach((b, i) => {
      b.addEventListener('input', () => {
        const d = b.value.replace(/\D/g, '');
        if (d.length > 1) { fill(val().slice(0, i) + d); return; }
        b.value = d; sync(); if (d) { b.classList.remove('land'); void b.offsetWidth; b.classList.add('land'); } if (d && box[i + 1]) box[i + 1].focus(); else if (d && val().length === 6) b.blur();
      });
      b.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !b.value && box[i - 1]) { box[i - 1].value = ''; box[i - 1].focus(); sync(); e.preventDefault(); }
        if (e.key === 'ArrowLeft' && box[i - 1]) box[i - 1].focus();
        if (e.key === 'ArrowRight' && box[i + 1]) box[i + 1].focus();
        if (e.key === 'Enter' && !vf.disabled) vf.click();
      });
      b.addEventListener('paste', e => { const d = (e.clipboardData.getData('text') || '').replace(/\D/g, ''); if (d) { e.preventDefault(); fill(d); } });
      b.addEventListener('focus', () => b.select());
    });
    document.getElementById('chg').onclick = () => go('start');
    // the code "arrives" by text a moment later; tap it to fill
    const code = String(Math.floor(100000 + Math.random() * 900000));
    document.getElementById('smscode').textContent = code;
    sms.onclick = () => { sms.classList.remove('show'); box.forEach(b => b.value = ''); sync();
      [...code].forEach((d, i) => later(() => { box[i].value = d; box[i].classList.add('on'); box[i].classList.remove('land'); void box[i].offsetWidth; box[i].classList.add('land'); box[i].focus({ preventScroll: true }); if (i === 5) { sync(); document.activeElement.blur(); } }, 120 + i * 110)); };
    later(() => sms.classList.add('show'), 1400);
    later(() => sms.classList.remove('show'), 9000);
    let left = 30; const rs = document.getElementById('rs');
    const tick = () => {
      left--;
      if (left > 0) { rs.textContent = `Resend in ${left}s`; later(tick, 1000); return; }
      const b = document.createElement('button'); b.className = 'rs'; b.id = 'rs'; b.textContent = 'Resend code'; rs.replaceWith(b);
      b.onclick = () => { go('code'); };
    };
    later(tick, 1000);
    vf.onclick = () => { if (val().length < 6) return; sms.classList.remove('show'); busy(vf, 'Verifying'); later(() => { S.phone = true; go('phoneDone'); }, 1100); };
    box[0].focus({ preventScroll: true });
  },

  // 3 · phone verified
  phoneDone() {
    app.innerHTML = `<section class="view narrow"><div class="card centre">
      <div class="msg"><div>${I.bigcheck}<p class="ttl">Verification Successful</p></div><p class="txt">Your phone number has been verified!</p></div>
      <button class="btn dark" id="nx">ID verification next</button></div></section>`;
    document.getElementById('nx').onclick = () => go('dash');
  },

  // 4 · back on the dashboard: phone done, ID unlocked (and 7 · both done)
  dash() {
    const done = S.id;
    app.innerHTML = `<section class="view wide">
      <div class="head"><h1>Verify Your Account</h1><p>Verification helps us keep Kusnap secure for everyone</p></div>
      <div class="stack">
        ${why()}
        <div class="card"><div class="row"><div class="copy"><p class="ttl">Phone Number Verification</p><p class="txt">Verify your phone number to secure your account and enable key features.</p></div>
          <span class="badge ok${done ? '' : ' pop'}">${I.check}Verified</span></div>
          <div class="field"><p class="lbl${done ? ' b' : ''}">Phone Number</p><p class="plain">${I.call}${PHONE}</p></div></div>
        <div class="card"><div class="row"><div class="copy"><p class="ttl">ID Verification</p><p class="txt">Confirm your identity with a government-issued ID for a safer marketplace experience</p></div>
          ${done ? `<span class="badge ok pop">${I.check}Verified</span>` : ''}</div>
          ${done ? `<div class="field"><p class="lbl b">Government-Issued ID</p><p class="plain">${I.contact}${IDS[S.idType]}</p></div>`
                 : `<div class="btnwrap"><button class="btn dark" id="sid" style="height:33px;width:158px;font-size:12px">Start ID Verification</button></div>`}
        </div>
      </div>
      ${done ? `<div class="replay"><button id="again">${I.replay}Replay the flow</button></div>` : help}</section>`;
    if (done) document.getElementById('again').onclick = restart;
    else document.getElementById('sid').onclick = () => go('identity');
  },

  // 5 · step 2 of 2: identity
  identity() {
    const f = (id, label, v, extra = '') => `<div class="field"><p class="lbl">${label}</p><div class="input tx"><input id="${id}" value="" ${extra}></div></div>`;
    app.innerHTML = `<section class="view narrow">
      <div class="head"><h1>Step 2 of 2</h1></div>
      <div class="stack">
        <div class="card id1"><div class="copy"><p class="ttl">Verify your Identity</p>
          <div class="txt" style="display:flex;flex-direction:column;gap:4px"><p>Provide your <b style="font-weight:700">government-issued ID</b> to complete verification.</p><p style="line-height:1.5">For successful verification, ensure your information matches your government-issued ID exactly.</p></div></div></div>
        <div class="card id2"><div class="form">
          ${f('first', 'First name', S.first, 'autocomplete="given-name"')}
          ${f('middle', 'Middle Name', S.middle, 'autocomplete="additional-name"')}
          ${f('last', 'Last Name', S.last, 'autocomplete="family-name"')}
          <div class="field"><p class="lbl">ID Type</p><div class="input tx sel"><select id="type">${Object.keys(IDS).map(k => `<option ${k === S.idType ? 'selected' : ''}>${k}</option>`).join('')}</select>${I.drop}</div></div>
          <div class="field"><p class="lbl" id="numl">${IDS[S.idType]}</p><div class="input tx"><input id="num" inputmode="numeric" value=""></div><p class="err" id="err"></p></div>
        </div>
        <div class="actions"><button class="btn blue" id="vi">Verify identity</button></div></div>
        ${why()}
      </div></section>`;
    const $ = id => document.getElementById(id), vi = $('vi');
    const ok = () => ['first', 'last', 'num'].every(k => $(k).value.trim()) && $('num').value.replace(/\D/g, '').length >= 10;
    const sync = () => { vi.disabled = !ok(); vi.textContent = vi.disabled ? 'Verify identity' : 'Verify identity'; };
    $('type').onchange = e => { S.idType = e.target.value; $('numl').textContent = IDS[S.idType]; $('num').focus(); };
    $('num').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 15); $('err').textContent = ''; });
    ['first', 'middle', 'last', 'num'].forEach(k => $(k).addEventListener('input', sync));
    // the details type themselves in, one field after another; touching any field stops it and fills the rest
    const plan = [['first', S.first], ['middle', S.middle], ['last', S.last], ['num', S.num]];
    let typing = true;
    const finish = () => { if (!typing) return; typing = false; plan.forEach(([k, v]) => { if (!$(k).value) $(k).value = v; $(k).parentNode.classList.remove('typing'); }); sync(); };
    const type = (i, c) => { if (!typing) return; if (i >= plan.length) { typing = false; sync(); return; }
      const [k, v] = plan[i], box = $(k).parentNode; box.classList.add('typing');
      if (c <= v.length) { $(k).value = v.slice(0, c); later(() => type(i, c + 1), k === 'num' ? 38 + Math.random() * 40 : 60 + Math.random() * 70); return; }
      box.classList.remove('typing'); later(() => type(i + 1, 0), 260); };
    plan.forEach(([k]) => $(k).addEventListener('pointerdown', finish));
    $('type').addEventListener('pointerdown', finish);
    later(() => type(0, 0), 650);
    vi.onclick = () => {
      if (typing) return;
      if (!ok()) { $('err').textContent = 'Enter at least 10 digits.'; return; }
      Object.assign(S, { first: $('first').value, middle: $('middle').value, last: $('last').value, num: $('num').value });
      busy(vi, 'Checking'); later(() => go('checking'), 500);
    };
    sync();
  },

  // 6 · checking, then success
  checking() {
    loader({ icon: I.contact, title: 'Verifying your identity', done: 'Identity confirmed',
      steps: [['Checking your details', 'Reading what you entered'], [`Matching your ${S.idType} records`, `Comparing it with your ${IDS[S.idType]}`], ['Securing your account', 'Almost there']],
      next: () => { S.id = true; go('idDone'); } });
  },
  // 1b · before the code is sent: is this number free to use?
  checkPhone() {
    loader({ icon: I.call, title: 'Checking your phone number', done: 'Number is available', narrow: true,
      steps: [['Checking the number', PHONE], ['Making sure it isn’t on another account', 'Each number can only verify one Kusnap account'], ['Sending your 6-digit code', 'It should arrive in a few seconds']],
      next: () => go('code') });
  },
  idDone() {
    app.innerHTML = `<section class="view narrow"><div class="card centre">
      <div class="msg"><div>${I.bigcheck}<p class="ttl">Verification Successful</p></div><p class="txt">Your identity has been verified successfully!</p></div>
      <div class="wide-btn"><button class="flat" id="cd">Continue to Dashboard</button></div></div></section>`;
    document.getElementById('cd').onclick = () => go('dash');
  }
};
// a loader that walks through its checks: a ring fills as each one ticks, then it moves on
function loader({ icon, title, steps, done, next }) {
  app.innerHTML = `<section class="view narrow"><div class="card centre vload" aria-live="polite">
    <div class="ring" id="ring"><svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="33"/><circle class="glint" cx="38" cy="38" r="33"/><circle class="bar" id="bar" cx="38" cy="38" r="33"/></svg>
      <div class="mid" id="mid">${icon}<span class="scan"></span></div></div>
    <div class="vtitle"><p class="ttl">${title}</p><p class="txt" id="vsub">Please wait...</p></div>
    <ul class="checks">${steps.map(x => `<li><span class="st"></span>${x[0]}</li>`).join('')}</ul></div></section>`;
  const li = [...app.querySelectorAll('.checks li')], bar = document.getElementById('bar'), sub = document.getElementById('vsub'), C = 207.3;
  const say = t => { sub.classList.add('swap'); later(() => { sub.textContent = t; sub.classList.remove('swap'); }, 200); };
  const at = (k, p) => { li.forEach((x, j) => { x.classList.toggle('ok', j < k); x.classList.toggle('on', j === k); }); bar.style.strokeDashoffset = C * (1 - p); if (steps[k]) say(steps[k][1]); };
  requestAnimationFrame(() => at(0, .14));
  later(() => at(1, .45), 1200);
  later(() => at(2, .78), 2500);
  later(() => { at(3, 1); document.getElementById('ring').classList.add('done'); document.getElementById('mid').innerHTML = I.check; say(done); }, 3500);
  later(next, 4300);
}
function restart() { Object.assign(S, { phone: false, id: false, idType: 'BVN', num: '467849058372345' }); go('start'); }
document.getElementById('home').onclick = restart;
go('start');

// ---- autoplay (?autoplay=1): a cursor clicks through the whole flow and starts over, forever.
// The moment a visitor clicks, taps or types, the demo stops and the prototype is theirs.
(function autoplay() {
  if (!/[?&]autoplay=(1|true|yes)/.test(location.search)) return;
  const cur = document.createElement('div'); cur.className = 'cur'; cur.setAttribute('aria-hidden', 'true');
  cur.innerHTML = '<i></i><svg class="ar" viewBox="0 0 26 26"><path d="M6 3.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5h6.3z" fill="#101828" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
    + '<svg class="hd" viewBox="0 0 26 26"><path d="M9.2 12.4V5.6a1.7 1.7 0 0 1 3.4 0v5.3l.1-1.2a1.6 1.6 0 0 1 3.2.2v1.3a1.6 1.6 0 0 1 3.1.4v1.1a1.5 1.5 0 0 1 3 .3v4.4c0 3.5-2.6 6.1-6.1 6.1h-1.6c-2 0-3.4-.8-4.6-2.4l-3.6-4.8a1.6 1.6 0 0 1 2.4-2.1z" fill="#fff" stroke="#101828" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const chip = document.createElement('div'); chip.className = 'demo-chip'; chip.innerHTML = '<b></b>Playing on its own · click anywhere to try it';
  document.body.append(cur, chip);
  let live = true, x = innerWidth * .62, y = innerHeight * .7;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const place = (nx, ny) => { x = nx; y = ny; cur.style.setProperty('--x', (x - 6) + 'px'); cur.style.setProperty('--y', (y - 4) + 'px'); };
  const q = sel => document.querySelector(sel);
  const ready = (sel, test) => { const e = q(sel); return e && !e.disabled && (!test || test(e)) ? e : null; };
  const until = async (sel, test, ms = 20000) => { const t0 = Date.now(); while (live && Date.now() - t0 < ms) { const e = ready(sel, test); if (e) return e; await sleep(120); } return null; };
  async function press(sel, { test, pause = 900 } = {}) {
    let e = await until(sel, test); if (!e || !live) return false;
    await sleep(pause); if (!live) return false;
    let r = e.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 20) { scrollBy({ top: r.top + r.height / 2 - innerHeight / 2, behavior: 'smooth' }); await sleep(700); r = e.getBoundingClientRect(); }   // scroll this page only, never the case study around it
    cur.classList.remove('hand'); cur.classList.add('on'); place(r.left + Math.min(r.width * .55, r.width - 10), r.top + r.height * .55);
    await sleep(720); if (!live) return false;
    e = ready(sel, test); if (!e) return false;
    cur.classList.add('hand'); e.classList.add('hov'); await sleep(520); if (!live) { e.classList.remove('hov'); return false; }   // arrive: the cursor turns to a hand and the button lifts
    e.classList.add('prs'); cur.classList.add('down'); await sleep(130);
    cur.classList.remove('down', 'tap'); void cur.offsetWidth; cur.classList.add('tap'); e.classList.remove('prs');
    await sleep(90); e.classList.remove('hov'); e.click(); setTimeout(() => cur.classList.remove('hand'), 300); return true;
  }
  const typed = () => { const b = q('#vi'); return b && !b.disabled; };
  async function loop() {
    place(x, y); await sleep(500); chip.classList.add('on'); setTimeout(() => chip.classList.remove('on'), 4200);
    while (live) {
      if (!q('#go')) { restart(); await sleep(400); }
      await press('#go', { pause: 1400 });                                   // dashboard → step 1
      await press('#sms', { test: e => e.classList.contains('show'), pause: 700 });   // the text message fills the code
      await press('#vf', { pause: 900 });                                    // verify the phone
      await press('#nx', { pause: 1100 });                                   // ID verification next
      await press('#sid', { pause: 1200 });                                  // start ID verification
      await until('#vi', typed); await press('#vi', { pause: 700 });          // the form types itself, then verify
      await press('#cd', { pause: 1300 });                                   // continue to the dashboard
      await press('#again', { pause: 2600 });                                // and round again
      await sleep(300);
    }
  }
  const stop = e => { if (!e.isTrusted || !live) return; live = false; cur.classList.remove('on'); chip.innerHTML = '<b style="background:#0776d8;animation:none"></b>Your turn · Restart to watch again';
    chip.classList.add('on'); setTimeout(() => chip.classList.remove('on'), 2600); };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, stop, { capture: true, passive: true }));
  loop();
})();
</script>
