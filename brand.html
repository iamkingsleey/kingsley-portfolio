<style>

/* ================= A · Index: a Swiss grid. Numbered sections, the heading holds its place while the section scrolls past ================= */

@media (max-width: 1100px) { .G .note { position: static; width: auto; margin: 20px 0 0; padding-left: 12px; border-left: 1px solid var(--line) } }
@media (max-width: 760px) { .G h2 { padding-top: 96px } .G .pair, .G .nums { grid-template-columns: 1fr } .G .nums div:nth-child(odd) { border-right: 0 } }

.rows { --gap: 16px; --mh: var(--pmh, 68vh); display: grid; gap: var(--gap); width: 100%; max-width: var(--w, none) }
.rows .row { display: flex; align-items: flex-start; gap: var(--gap); width: 100%; max-width: calc(var(--mh) * var(--sum) + var(--gap) * (var(--n) - 1)) }
.rows .row.full { max-width: none }
.rows .row .m { flex: calc(var(--r) * 100) 1 0; min-width: 0; aspect-ratio: var(--r) }
.rows .row .m img, .rows .row .m video { width: 100%; height: auto; aspect-ratio: var(--r); object-fit: cover }
.rows .row .blk { height: 100%; aspect-ratio: auto }
.rows.c { margin-left: auto; margin-right: auto }
.rows > .cap2 { margin-top: calc(12px - var(--gap)) }
@media (max-width: 560px) { .rows { --gap: 8px } }
@media (max-width: 640px) { :root { --gut: max(20px, env(safe-area-inset-left, 0px)) } }

/* ================= H · Story: a single narrative column. Tags, a big title, the result up front; eyebrow + heading per chapter,
   pictures a step wider than the text with a caption under each, results as a plain list, credits at the end ================= */
.H { --tx: 680px; --fr: 1280px }
.H .tx { width: min(var(--tx), calc(100% - 2 * var(--gut))); margin: 0 auto }
.H .fr { --gap: 16px; width: min(var(--fr), calc(100% - 2 * var(--gut))); margin: 56px auto 0 }
@media (max-width: 560px) { .H .fr { --gap: 8px } }
.H .hd { padding: 72px 0 0 }
.H .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px }
.H .tags span { padding: 5px 11px; border-radius: 999px; background: var(--pill); font-size: 12.5px; color: var(--text); text-transform: lowercase }
.H h1 { font: 600 clamp(38px, 5vw, 64px)/1.02 var(--body); letter-spacing: -.045em; color: var(--ink) }
.H .lede { margin-top: 24px; font-size: 20px; line-height: 1.5; color: var(--text) } .H .lede b { font-weight: 600; color: var(--ink) }
.H figcaption, .H .cap2 { margin-top: 12px; font: 400 13px/1.5 var(--body); color: var(--muted) }
.H .cap2 b { font: 600 11px var(--mono); letter-spacing: .6px; text-transform: uppercase; margin-right: 8px; color: var(--muted) }
.H .ch { padding-top: 120px }
.H .eb { font: 600 11px var(--mono); letter-spacing: .8px; text-transform: uppercase; color: var(--muted) }
.H h2 { margin: 12px 0 22px; font: 600 clamp(28px, 3vw, 38px)/1.1 var(--body); letter-spacing: -.035em; color: var(--ink) }
.H h4 { margin: 32px 0 8px; font: 600 16px/1.3 var(--body); color: var(--ink) }
.H .tx > p, .H .tx li, .H .tx dl { font-size: 18px; line-height: 1.65 } .H .tx p + p { margin-top: 16px }
.H .punch { margin-top: 24px; font: 500 22px/1.35 var(--body); letter-spacing: -.015em; color: var(--ink) }
.H .lead { display: grid; gap: 14px; margin-top: 8px } .H .lead div { font-size: 18px; line-height: 1.6 } .H .lead b { font-weight: 600; color: var(--ink) }
.H .role { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px } .H .role span { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--ink) }
.H ul.res { list-style: none; display: grid; gap: 0; margin-top: 8px } .H ul.res li { padding: 16px 0; border-top: 1px solid var(--line) } .H ul.res li:last-child { border-bottom: 1px solid var(--line) }
.H ul.res b { font-weight: 600; color: var(--ink); margin-right: 6px }
.H .tx .pull { font: 600 clamp(30px, 3.6vw, 48px)/1.08 var(--body); letter-spacing: -.04em; color: var(--ink) }
.H .cred { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 32px; margin-top: 8px } .H .cred dd { margin-top: 4px; color: var(--ink); font-size: 16px }
.H .sp { height: 120px }
.H .bign { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line) }
.H .bign > div { padding: 32px 32px 36px 0; border-bottom: 1px solid var(--line) } .H .bign > div:nth-child(even) { padding-left: 32px; border-left: 1px solid var(--line) }
.H .bign b { display: block; font: 600 clamp(40px, 4.4vw, 64px)/1 var(--body); letter-spacing: -.045em; color: var(--ink); font-variant-numeric: tabular-nums }
.H .bign span { display: block; margin-top: 12px; max-width: 32ch; font-size: 14px; line-height: 1.5; color: var(--muted) }
.H .bign.l b { font-size: clamp(36px, 4.4vw, 68px); line-height: 1.02; letter-spacing: -.04em; margin-top: 12px }
.H .bign.l i { font-style: normal }
.H .bign + .cap2 { margin-top: 14px }
@media (max-width: 640px) { .H .bign { grid-template-columns: 1fr } .H .bign > div, .H .bign > div:nth-child(even) { padding: 28px 0 32px; border-left: 0 } }

@media (max-width: 640px) { .H .lede { font-size: 18px } .H .ch { padding-top: 88px } .H .cred { grid-template-columns: 1fr 1fr } }

/* the index: a vertical ruler beside the chapters, like the one on About. One long tick per chapter with its name; the red
   needle slides down the ruler as you read, the chapter you're in turns dark, and the ticks swell around the needle. Click a name to go there. */
.ix { position: fixed; z-index: 40; left: var(--gut); top: 42%; translate: 0 -50%; width: 260px; opacity: 0; pointer-events: none; transition: opacity .35s }
.ix.on { opacity: 1; pointer-events: auto }
.ix .lb { display: block; margin: 0 0 18px 34px; font: 500 14px var(--body); color: var(--muted) }
.ix .tr { position: relative }
.ix .tk { position: absolute; left: 0; top: 0; bottom: 0; width: 24px }
.ix .tk i { position: absolute; left: 0; height: 1px; background: var(--ink); border-radius: 1px }
.ix .nd { position: absolute; left: -6px; width: 30px; height: 2px; margin-top: -1px; background: var(--red); border-radius: 1px }
.ix ol { list-style: none; margin: 0; padding: 0 0 0 34px; display: grid }
.ix li button { display: block; width: 100%; height: 40px; padding: 0; border: 0; background: none; text-align: left; font: 500 17px/40px var(--body); letter-spacing: -.01em; color: var(--muted);
  opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .25s, opacity .25s }
.ix li button:hover { color: var(--ink); opacity: 1 }
.ix li button.on { color: var(--ink); opacity: 1 }
.ix li button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
/* the page stays centred on the screen; with the index showing, pictures stop short of it on both sides so the column stays symmetric */
@media (min-width: 1200px) { .H .tx { width: min(var(--tx), calc(100vw - 2 * 340px)) } }
.ix.dim { opacity: 0; pointer-events: none }   /* steps aside while a wide picture passes under it */
@media (max-width: 1199px) { .ix { display: none } }
@media (prefers-reduced-motion: reduce) { .ix { transition: none } }
/* lists and stats, shared */
.ls { display: grid; gap: 0 }
.ls div { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px }
.ls div:last-child { border-bottom: 1px solid var(--line) }
.ls dt { color: var(--ink); font-weight: 500 }
.sts { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 24px }
.sts b { display: block; font: 600 clamp(40px, 4.4vw, 64px)/1 var(--body); letter-spacing: -.045em; color: var(--ink) }
.sts span { display: block; margin-top: 8px; font-size: 15px; max-width: 28ch }
@media (max-width: 520px) { .ls div { grid-template-columns: 1fr; gap: 2px } }


/* ======================================================================================================================
   BRAND layouts. All five sit on one 12-column grid (4 on phones) with the same gutter, so each idea is a different way of
   playing that grid. "Grid" in the switch shows the columns.
   ====================================================================================================================== */
.bz { --g: 24px; --cols: 12; --cw: calc((100vw - 2 * var(--gut) - (var(--cols) - 1) * var(--g)) / var(--cols)) }
@media (max-width: 760px) { .bz { --g: 12px; --cols: 4 } }
.bz .gr { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--g); padding: 0 var(--gut) }
.bz .mono { font: 600 11px/1.4 var(--mono); letter-spacing: .7px; text-transform: uppercase; color: var(--muted) }
.bz h2 { font: 600 clamp(26px, 2.6vw, 36px)/1.08 var(--body); letter-spacing: -.035em; color: var(--ink) }
.bz p { font-size: 17px; line-height: 1.6 }
.bz .m img, .bz .m video { width: 100%; height: 100%; object-fit: cover }
.bz .fill { position: relative; overflow: hidden; background: var(--panel) } .bz .fill .m { position: absolute; inset: 0 }
.bz .sw8 { display: flex; height: 100% } .bz .sw8 i { flex: 1 }
@media (max-width: 760px) { .bz .gr > * { grid-column: 1 / -1 !important; grid-row: auto !important } }

/* the grid overlay */
.gov { position: fixed; inset: 0; z-index: 45; pointer-events: none; display: none; padding: 0 var(--gut); gap: 24px; grid-template-columns: repeat(12, 1fr) }
.gov i { background: color-mix(in srgb, var(--ink) 4%, transparent); border-left: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); border-right: 1px solid color-mix(in srgb, var(--ink) 14%, transparent) }
html.grid-on .gov { display: grid }
@media (max-width: 760px) { .gov { gap: 12px; grid-template-columns: repeat(4, 1fr) } .gov i:nth-child(n+5) { display: none } }

/* ---------- I · Guidelines: a brand book. Every part is a numbered spread with its label in columns 1–3 and the work in 4–12 ---------- */
.I .hd { padding-top: 80px; align-items: end }
.I .hd h1 { grid-column: 1 / span 9; font: 600 clamp(64px, 12vw, 200px)/.86 var(--bfont, var(--body)); letter-spacing: -.05em; color: var(--ink) }
.I .hd dl { grid-column: 10 / -1; display: grid; gap: 12px; font-size: 14px; padding-bottom: 12px } .I .hd dd { color: var(--ink) }
.I .lede { grid-column: 4 / span 6; margin-top: 48px; font: 500 clamp(20px, 1.8vw, 26px)/1.35 var(--body); letter-spacing: -.01em; color: var(--ink) }
.I .sp { padding-top: 120px; border-top: 1px solid var(--line); margin-top: 120px }
.I .lab { grid-column: 1 / span 3 } .I .lab h2 { margin-top: 10px }
.I .wk { grid-column: 4 / -1 }
.I .tx { grid-column: 4 / span 5; margin-top: 28px }
.I .logo { aspect-ratio: 16 / 9 }
.I .sws { display: grid; grid-template-columns: repeat(var(--n), 1fr); height: 420px }
.I .sws div { display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; font-size: 13px; line-height: 1.4 } .I .sws b { display: block; font-weight: 500 }
.I .spec { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g) }
.I .spec .aa { font: 400 clamp(120px, 16vw, 260px)/.9 var(--sf, var(--body)); color: var(--ink); letter-spacing: -.03em }
.I .spec .abc { font: 400 clamp(22px, 2.2vw, 32px)/1.3 var(--sf, var(--body)); color: var(--ink); word-break: break-all }
.I .spec .nm { margin-top: 18px }
.I .pq { grid-column: 4 / -1; font: 600 clamp(36px, 5vw, 80px)/1 var(--bfont, var(--body)); letter-spacing: -.045em; color: var(--ink); max-width: 18ch }
@media (max-width: 760px) { .I .sws { height: 260px } .I .spec { grid-template-columns: 1fr } .I .sp { margin-top: 80px; padding-top: 72px } }

/* ---------- J · Mosaic: one modular board. The grid's unit is a square column; every tile takes whole units by its shape ---------- */
.J { padding-top: 32px }
.J .gr { grid-auto-rows: var(--cw); grid-auto-flow: dense }
.J .t { background: var(--panel); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; overflow: hidden; min-width: 0 }
.J .t p { font-size: 15px; line-height: 1.5 }
.J .ti { grid-column: span 6; grid-row: span 3; background: var(--ink); color: var(--bg) }
.J .ti h1 { font: 600 clamp(48px, 7vw, 120px)/.88 var(--bfont, var(--body)); letter-spacing: -.05em }
.J .ti .mono { color: color-mix(in srgb, var(--bg) 55%, transparent) } .J .ti p { color: color-mix(in srgb, var(--bg) 80%, transparent); max-width: 40ch }
.J .p34 { grid-column: span 3; grid-row: span 4 } .J .p33 { grid-column: span 3; grid-row: span 3 } .J .p64 { grid-column: span 6; grid-row: span 4 } .J .p66 { grid-column: span 6; grid-row: span 6 }
.J .p32 { grid-column: span 3; grid-row: span 2 } .J .p62 { grid-column: span 6; grid-row: span 2 } .J .p31 { grid-column: span 3; grid-row: span 1 } .J .p12 { grid-column: span 12; grid-row: span 3 }
.J .im { padding: 0; position: relative } .J .im .m { position: absolute; inset: 0 }
.J .ty .aa { font: 400 clamp(64px, 8vw, 140px)/.85 var(--sf, var(--body)); color: var(--ink) }
.J .pal { padding: 0; display: flex } .J .pal i { flex: 1; display: flex; align-items: flex-end; padding: 12px; font: 600 11px var(--mono); font-style: normal; letter-spacing: .4px }
.J .q { grid-column: span 9; grid-row: span 2; background: none; padding: 0; justify-content: center; font: 600 clamp(28px, 3.6vw, 56px)/1.02 var(--bfont, var(--body)); letter-spacing: -.04em; color: var(--ink) }
@media (max-width: 760px) { .J .gr { grid-auto-rows: auto } .J .t { min-height: 140px } .J .im { aspect-ratio: var(--r, 1) } .J .ti { min-height: 360px } .J .pal { min-height: 140px } }

/* ---------- K · Specimen: the brand's facts stand still in columns 1–4; the work runs down 6–12 ---------- */
.K .gr { align-items: start; padding-top: 72px }
.K .side { grid-column: 1 / span 4; position: sticky; top: 40px }
.K .side h1 { font: 600 clamp(48px, 5.4vw, 88px)/.9 var(--bfont, var(--body)); letter-spacing: -.05em; color: var(--ink); margin: 14px 0 22px }
.K .side .lede { color: var(--ink) }
.K .side dl { margin-top: 32px; display: grid; gap: 0 } .K .side dl div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px } .K .side dd { color: var(--ink); text-align: right }
.K .dots { display: flex; gap: 6px; margin-top: 18px } .K .dots i { width: 22px; height: 22px; box-shadow: inset 0 0 0 1px var(--edge) }
.K .main { grid-column: 6 / -1; display: grid; gap: 120px; padding-bottom: 120px }
.K .main section > p { margin-top: 12px; max-width: 56ch }
.K .main .rows { margin-top: 28px }
.K .cap3 { display: flex; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--muted) }
.K .bars { display: grid; gap: 4px; margin-top: 28px } .K .bars div { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 13px }
.K .tyl { margin-top: 28px; display: grid; gap: 4px } .K .tyl div { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 20px 0; border-top: 1px solid var(--line) }
.K .tyl b { font: 400 clamp(36px, 4vw, 60px)/1 var(--sf, var(--body)); color: var(--ink); letter-spacing: -.02em }
.K .kp { margin-top: 40px; display: grid; gap: 12px }
.K .kps { display: flex; flex-wrap: wrap; gap: 6px }
.K .kps button { width: 28px; height: 28px; padding: 0; border: 0; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 16%, transparent); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s }
.K .kps button:hover { transform: translateY(-2px) }
.K .kps button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 16%, transparent), 0 0 0 2px var(--bg), 0 0 0 3px var(--ink) }
html.themed body, html.themed .K { transition: background .45s, color .45s }
@media (max-width: 760px) { .K .side { position: static } .K .main { gap: 80px } }

/* ---------- L · Contact sheet: everything as equal frames on one tight grid, labelled like a film sheet ---------- */
.L .hd { padding-top: 72px; padding-bottom: 40px; align-items: end }
.L .hd h1 { grid-column: 1 / span 6; font: 600 clamp(48px, 6vw, 96px)/.9 var(--bfont, var(--body)); letter-spacing: -.05em; color: var(--ink) }
.L .hd p { grid-column: 7 / span 4 } .L .hd .mono { grid-column: 11 / -1; text-align: right }
.L .row { border-top: 1px solid var(--line); padding-top: 18px; padding-bottom: 56px }
.L .row .lab { grid-column: 1 / span 2 } .L .row .lab b { display: block; margin-top: 6px; font: 600 18px/1.2 var(--body); color: var(--ink) }
.L .row .lab p { font-size: 14px; margin-top: 8px; color: var(--muted) }
.L .row .fr { grid-column: 3 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--g) }
.L .fr figure { margin: 0 }
.L .fr .box { aspect-ratio: 4 / 5; position: relative; overflow: hidden; background: var(--panel) } .L .fr .box .m { position: absolute; inset: 0 }
.L .fr figcaption { display: flex; justify-content: space-between; margin-top: 8px; font: 600 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--muted) }
.L .fr .w2 { grid-column: span 2 } .L .fr .w2 .box { aspect-ratio: auto; height: calc(100% - 26px) }
.L .fr .swc { display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; font-size: 12px }
.L .fr .ty { display: grid; place-items: center; font: 400 64px/1 var(--sf, var(--body)); color: var(--ink) }
@media (max-width: 760px) { .L .row .fr { grid-template-columns: repeat(2, 1fr) } .L .fr .w2 { grid-column: span 2 } .L .fr .w2 .box { height: auto; aspect-ratio: 4 / 3 } .L .hd .mono { text-align: left } }

/* ---------- M · Broken grid: the work steps across the columns and over the lines, still landing on them ---------- */
.M { overflow-x: clip }
.M .hd { padding-top: 64px }
.M .word { grid-column: 1 / -1; font: 700 clamp(80px, 19vw, 340px)/.78 var(--bfont, var(--body)); letter-spacing: -.07em; color: var(--ink); margin-left: -.05em; white-space: nowrap }
.M .hd .lede { grid-column: 7 / span 5; margin-top: 40px; font: 500 clamp(19px, 1.6vw, 24px)/1.4 var(--body); color: var(--ink) }
.M .hd .mono { grid-column: 1 / span 4; margin-top: 46px }
.M .st { position: relative; margin-top: 120px; align-items: start }
.M .a { position: relative; z-index: 1 } .M .b { position: relative; z-index: 2 }
.M .card { background: var(--bg); padding: 28px; box-shadow: 0 0 0 1px var(--line) }
.M .card p { margin-top: 12px }
.M .num { font: 700 clamp(64px, 8vw, 132px)/.8 var(--body); letter-spacing: -.06em; color: var(--ink); opacity: .08 }
.M .pal { display: flex; height: 100% } .M .pal i { flex: 1 }
.M .q { grid-column: 2 / span 10; margin-top: 160px; font: 700 clamp(40px, 6.4vw, 110px)/.92 var(--bfont, var(--body)); letter-spacing: -.055em; color: var(--ink) }
.M .ty { font: 400 clamp(90px, 13vw, 220px)/.85 var(--sf, var(--body)); color: var(--ink) }
@media (max-width: 760px) { .M .word { font-size: 21vw } .M .st { margin-top: 72px } .M .b { margin-top: -32px; margin-left: 24px } }

/* the switch: product / brand */
.sw .grp { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--pill); margin-right: 6px; flex: none }
.sw .grp button { height: 30px; padding: 0 12px }
.sw .grp button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--edge) }
.sw .gbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

/* ---------- N · Showcase ---------- */
.N { --ng: 22px; --ne: max(48px, env(safe-area-inset-left, 0px)) }
@media (max-width: 899px) { .N { --ng: 12px; --ne: max(16px, env(safe-area-inset-left, 0px)) } }
.N .nh { padding: 64px var(--ne) 56px }
.N .nh h1 { margin: 14px 0 0 -.04em; font: 600 clamp(64px, 13vw, 220px)/.84 var(--bfont, var(--body)); letter-spacing: -.055em; color: var(--ink) }
.N .nhr { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ng); margin-top: 40px; align-items: start }
.N .nhr .lede { font: 500 clamp(19px, 1.6vw, 24px)/1.4 var(--body); color: var(--ink); max-width: 34ch }
.N .nhr dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px var(--ng); font-size: 14px } .N .nhr dd { margin-top: 4px; color: var(--ink) }
.N .nf { padding: 0 var(--ne); margin-top: var(--ng) }
.N .nf .rows { --gap: var(--ng); --mh: 110vh; max-width: none }
.H { --ng: 22px } @media (max-width: 899px) { .H { --ng: 12px } }
:is(.N, .H) .cl { display: grid; gap: var(--ng) }
:is(.N, .H) .clp { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: var(--ng) }
:is(.N, .H) .cl .fill { position: relative; overflow: hidden; background: var(--panel); aspect-ratio: 1 } :is(.N, .H) .cl .fill.clw { aspect-ratio: 16 / 9 }
:is(.N, .H) .cl .m { position: absolute; inset: 0 } :is(.N, .H) .cl .m img, :is(.N, .H) .cl .m video { width: 100%; height: 100%; object-fit: cover }
:is(.N, .H) .cl .clt { --fo: 50% 64% }
:is(.N, .H) .clp.asy { grid-template-columns: var(--cols); aspect-ratio: 2 / 1 } :is(.N, .H) .clp.asy .fill { aspect-ratio: auto; height: 100% }
:is(.N, .H) .cl .m img, :is(.N, .H) .cl .m video { object-position: var(--fo, 50% 50%) }
:is(.N, .H) .cl .fill.own { aspect-ratio: auto } :is(.N, .H) .cl .fill.own .m { position: static } :is(.N, .H) .cl .fill.own .m img, :is(.N, .H) .cl .fill.own .m video { height: auto; display: block }
