<script src="tuner.js?v=584c79d8"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand case study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Logo design template. Top: a pinned horizontal run (after lpas.com) where vertical scrolling slides the
   logo's "stations" past a tick ruler and red needle. Then vertical (after Onda): split facts/story,
   construction drawing with annotations, palette as frequencies, type specimen, landscape/portrait media
   rhythm, statement, next on the dial. Station readout top-left, section
   dial at the bottom, as on the rest of the site. */
:root {
  --bg: #ffffff; --ink: #000000; --text: #3b3b3b; --muted: #8c8c8c; --pill: #f2f2f2; --panel: #f4f4f4; --on-ink: #ffffff;
  --line: #e4e4e4; --edge: rgb(0 0 0 / .08); --red: #ff4a1c;
  --b1: #2b3bff; --b2: #c6f432; --b3: #f4efe6; --b4: #0e0e10;     /* the sample brand's colours */
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gut: max(48px, env(safe-area-inset-left, 0px));
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
html[data-theme="dark"] { --bg: #0b0b0b; --ink: #ffffff; --text: #c9c9c9; --muted: #7a7a7a; --pill: #1c1c1c; --panel: #121212; --on-ink: #000000;
  --line: #242424; --edge: rgb(255 255 255 / .1); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased }
img, svg { display: block; max-width: 100% }
button, a { font: inherit; color: inherit }
button { background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
figure { margin: 0 }
.mono { font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.wrap { padding: 0 var(--gut) }

/* station readout */
.station { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); left: var(--gut); z-index: 40; display: flex; align-items: center; gap: 18px; mix-blend-mode: difference; color: #fff }
.station .back { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; background: rgb(255 255 255 / .1); font-size: 13px }
.station .back b { font: 400 12px var(--mono); opacity: .6 }
.station .fq { font-size: 28px; letter-spacing: -.5px }
.station .nm { font-size: 13px; font-weight: 500 }

/* title words rise out of a mask */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em }
.w > span { display: inline-block; transform: translateY(105%); transition: transform .9s var(--ease); transition-delay: calc(var(--i) * 70ms + 200ms) }
.w.in > span { transform: none }

/* ---------- 1 · horizontal run (three frames, then vertical) ----------
   Frame 1: the intro panel, with the next column peeking in on the right.
   Frame 2: the row slides left; two columns of stacked media and the edge of a third.
   Frame 3: the split lines inside the columns slide (or, in "row moves" mode, the row keeps going).
   Each slot holds an image or a video, chosen in the CMS. */
.run { position: relative }                       /* height set in JS */
.run .pin { position: sticky; top: 0; height: 100vh; overflow: hidden }
.track { position: absolute; top: 0; left: 0; bottom: 72px; display: flex; will-change: transform }
.intro { flex: none; position: relative; height: 100%; padding: 0 var(--gut) 40px }
.intro .cat { position: absolute; left: var(--gut); top: 50%; transform: translateY(-50%) }
.intro .go { position: absolute; right: 48px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 12px }
.intro .go svg { width: 34px; height: 10px; overflow: visible }
.intro .go svg path { stroke: var(--ink); fill: none; stroke-width: 1.2 }
.intro .go .arr { animation: nudge 1.6s var(--ease) infinite }
@keyframes nudge { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(6px) } }
.intro .tt { position: absolute; left: var(--gut); right: 40%; bottom: 40px }
.intro h1 { margin: 0 0 14px; color: var(--ink); font-size: clamp(52px, 7vw, 116px); line-height: .9; font-weight: 500; letter-spacing: -0.055em }
.intro p { margin: 0; max-width: 44ch; font-size: 15px; line-height: 1.55 }
.col { flex: none; height: 100%; display: flex; flex-direction: column }
.slot { position: absolute; inset: 0; overflow: hidden; background: var(--panel); will-change: clip-path }
.slot > img, .slot > video, .slot > .gfx { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform }
.slot .gfx { display: grid; place-items: center }
.slot .lab { position: absolute; top: 0; margin-top: -30px; will-change: transform; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; color: #fff; mix-blend-mode: difference; pointer-events: none }
/* ruler under the run */
.split-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; margin-top: -1.5px; will-change: transform; background: var(--red); z-index: 4; pointer-events: none; opacity: 0 }
.split-tag { position: absolute; top: -11px; right: 12px; z-index: 5; will-change: transform; padding: 4px 8px; background: var(--red); color: #fff; font: 500 10px var(--mono); letter-spacing: .5px; opacity: 0; pointer-events: none }
.col { position: relative }

/* ---------- 2 · info split ---------- */
.title { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; border-bottom: 1px solid var(--line); padding: 120px 0 36px }
.title h2 { margin: 0; color: var(--ink); font-size: clamp(40px, 5.6vw, 88px); line-height: .92; font-weight: 500; letter-spacing: -0.05em }
.info { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border-bottom: 1px solid var(--line) }
.facts { margin: 0; border-right: 1px solid var(--line); padding-right: 40px }
.fact { padding: 24px 0; border-bottom: 1px solid var(--line) }
.fact:last-child { border-bottom: 0 }
.fact dt { margin-bottom: 12px }
.fact dd { margin: 0; color: var(--ink); font-size: 15px; font-weight: 500 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 500 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--ink); background: var(--pill); padding: 8px 11px }
.chip.cat { background: var(--red); color: #fff }
.tools { display: flex; gap: 8px }
.tools img { width: 34px; height: 34px; border-radius: 27%; box-shadow: 0 0 0 1px var(--edge) }
.todo { color: var(--muted); font-weight: 400; font-style: italic }
.story { padding: 26px 0 44px 40px; max-width: 720px }
.story h3 { margin: 0 0 18px; font-size: 15px; font-weight: 600; color: var(--ink) }
.story p { margin: 0 0 16px; font-size: 15px; line-height: 1.6 }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px }
.btn { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--pill); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 500; transition: background .2s, color .2s }
.btn.solid { background: var(--ink); color: var(--on-ink) }
.btn:hover { background: var(--red); color: #fff }

/* section heads */
.shead { display: flex; justify-content: space-between; align-items: baseline; padding: 112px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 16px }
.shead h4 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 500; letter-spacing: -.3px }

/* ---------- 3 · construction ---------- */
.build { position: relative; aspect-ratio: 16 / 9; background: var(--panel); overflow: hidden }
.build svg { position: absolute; inset: 0; width: 100%; height: 100% }
.build .g { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset 1.6s var(--ease); transition-delay: var(--d, 0s) }
.build .g.r { stroke: var(--red) }
.build.in .g { stroke-dashoffset: 0 }
.build .mark { fill: var(--ink); opacity: 0; transition: opacity 1s .9s }
.build.in .mark { opacity: 1 }
.build .note { font: 500 11px var(--mono); letter-spacing: .5px; text-transform: uppercase; fill: var(--red); opacity: 0; transition: opacity .6s; transition-delay: calc(var(--d, 0s) + .8s) }
.build.in .note { opacity: 1 }

/* ---------- 4 · palette as frequencies ---------- */
.freqs { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0; min-height: 420px }
.fq-sw { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; font: 500 11px var(--mono); letter-spacing: .4px; text-transform: uppercase; overflow: hidden }
.fq-sw .big { font: 500 clamp(28px, 3.4vw, 52px) var(--body); letter-spacing: -0.04em; text-transform: none }

/* ---------- 5 · type specimen ---------- */
.type { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); background: var(--panel) }
.type .aa { padding: 40px; font-size: clamp(140px, 20vw, 320px); line-height: .8; letter-spacing: -0.06em; font-weight: 600; color: var(--ink) }
.type .meta { padding: 40px; border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; gap: 24px }
.type .glyphs { color: var(--ink); font-size: 22px; line-height: 1.45; letter-spacing: -.02em; word-break: break-all }
.type .weights { display: grid; gap: 8px; color: var(--ink); font-size: 28px; letter-spacing: -.03em }

/* ---------- 6 · media rhythm ---------- */
.seq { display: grid; gap: 16px; padding: 16px 0 }
.panel { position: relative; overflow: hidden; background: var(--panel) }
.panel > img { width: 100%; height: 100%; object-fit: cover }
.panel .plab { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; color: #fff; mix-blend-mode: difference; pointer-events: none }
.full { aspect-ratio: 16 / 9 } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px } .two .panel { aspect-ratio: 4 / 5 }
/* arrival: tune in (blocky signal that locks sharp) */
/* arrival: the frame opens upward while the picture settles from a slight zoom */
.reveal { clip-path: inset(100% 0 0 0); transition: clip-path 1.2s cubic-bezier(.16,1,.3,1) }
.reveal > img { transform: scale(1.14); transition: transform 1.8s cubic-bezier(.16,1,.3,1) }
.reveal.in { clip-path: inset(0 0 0 0) } .reveal.in > img { transform: none }
.panel canvas.tune { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; image-rendering: pixelated }

/* ---------- 8 · statement + next ---------- */
.statement { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); padding: 140px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 96px }
.statement p { margin: 0; padding-left: 40px; color: var(--ink); font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; font-weight: 500; letter-spacing: -0.03em; text-wrap: balance }
.next { display: grid; grid-template-columns: minmax(0, 1fr) 260px; column-gap: 48px; row-gap: 0; grid-template-rows: auto 1fr; align-items: start; padding: 40px 0 200px; text-decoration: none }
.next > .mono, .next > .fq { grid-column: 1; grid-row: 1 } .next .r { display: contents } .next .r > :first-child { grid-column: 1; grid-row: 2; margin-left: -0.065em } .next .th { grid-column: 2; grid-row: 1 / 3 }
.next h5 { margin: 12px 0 0; color: var(--ink); font-size: clamp(36px, 5vw, 72px); line-height: .95; font-weight: 500; letter-spacing: -0.045em; transition: transform .4s var(--ease) }
.next:hover h5 { transform: translateX(10px) }
.next .th { aspect-ratio: 4 / 5; overflow: hidden; background: var(--panel) }
.next .th img { width: 100%; height: 100%; object-fit: cover }

/* fade for text blocks */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .8s var(--ease) }
.rv.in { opacity: 1; transform: none }

/* ---------- section dial (bottom) ---------- */
.sdial { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 30; pointer-events: none; transition: opacity .3s }
.sdial canvas { width: 100%; height: 100% }

/* preview: theme */
.theme { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 40; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--pill); color: var(--ink); font-size: 12px; font-weight: 500 }

@media (prefers-reduced-motion: reduce) {
  .w > span, .rv { transform: none !important; opacity: 1 !important; transition: none !important }
  .build .g { stroke-dashoffset: 0; transition: none } .build .mark, .build .note { opacity: 1; transition: none }
  .intro .hint i::after { animation: none }
  .reveal, .reveal > img { clip-path: none; transform: none; transition: none }
}
@media (max-width: 899px) {
  :root { --gut: 16px }
  .station { gap: 12px } .station .fq { font-size: 22px } .station .nm { display: none }
  .title { padding-top: 88px } .title .mono { display: none }
  .info, .statement, .next, .type { grid-template-columns: 1fr }
  .facts { border-right: 0; padding-right: 0 }
  .story { padding: 28px 0 36px; border-top: 1px solid var(--line) }
  .freqs { grid-template-columns: 1fr 1fr; min-height: 0 } .fq-sw { min-height: 200px } .fq-sw:first-child { grid-column: 1 / -1 }
  .type .meta { border-left: 0; border-top: 1px solid var(--line); padding: 24px } .type .aa { padding: 24px }
  .two { grid-template-columns: 1fr; gap: 12px }
  .statement { padding: 80px 0 } .statement p { padding: 16px 0 0 }
  .next { grid-template-columns: minmax(0, 1fr) 120px; column-gap: 16px }
  .build { aspect-ratio: 4 / 5 }
  .icons { gap: 16px }
  .intro .cat { top: 96px; transform: none }
  .intro .go { left: var(--gut); right: auto; top: auto; bottom: 24px; transform: none }
  .intro .tt { right: var(--gut); bottom: 64px }
  .theme { right: var(--gut) }
}

/* next on the dial: one structure everywhere (label, then the name under it on the left; the picture on the right) */
.next { display: grid; grid-template-columns: minmax(0, 1fr) 260px; column-gap: 48px; row-gap: 0; grid-template-rows: auto 1fr; align-items: start; padding: 40px 0 200px; text-decoration: none; cursor: pointer }
.next > .mono, .next > .fq, .next > .d-label { grid-column: 1; grid-row: 1; margin: 0; font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.next .r { display: contents } .next .r > :first-child { grid-column: 1; grid-row: 2; margin-left: -0.065em }
.next h5 { margin: 12px 0 0; color: var(--ink); font-size: clamp(36px, 5vw, 72px); line-height: .95; font-weight: 500; letter-spacing: -0.045em; transition: transform .4s cubic-bezier(.2,.8,.2,1) }
.next:hover h5 { transform: translateX(10px) }
.next .th { grid-column: 2; grid-row: 1 / 3; aspect-ratio: 4 / 5; overflow: hidden; background: var(--panel, var(--tile)); border-radius: 0; filter: none; opacity: 1 }
.next .th img { width: 100%; height: 100%; object-fit: cover; display: block }
@media (max-width: 899px) { .next { grid-template-columns: minmax(0, 1fr) 120px; column-gap: 16px; padding-bottom: 120px } }

/* ---------- brand case study additions ---------- */
[hidden] { display: none !important }
.slot > img { position: absolute; top: 0; left: -60px; width: calc(100% + 120px); max-width: none; height: 100%; object-fit: cover; will-change: transform }
.intro .cat { display: flex; gap: 10px; align-items: center }
.cs-tag { display: inline-flex; align-items: center; gap: 7px; color: var(--ink) }
.cs-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red) }
.story .brief { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line) }
.story .brief h3 { margin: 0 0 8px }
.story .brief p { margin: 0; font-size: 14px }
.build.pic { aspect-ratio: 3 / 2 } .build.pic > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.build.pic { clip-path: inset(100% 0 0 0); transition: clip-path 1.2s cubic-bezier(.16,1,.3,1) } .build.pic.in { clip-path: inset(0 0 0 0) }
.full { aspect-ratio: 3 / 2 }
.todo { color: var(--muted); font-style: italic; font-weight: 400 }
@media (max-width: 899px) { .story .brief { grid-template-columns: 1fr } }
/* ---------- brand page versions ---------- */
.cmpv { touch-action: pan-y; cursor: ew-resize; user-select: none; clip-path: none !important }
.cmpv .cl { position: absolute; inset: 0 } .cmpv .cl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none }
.cmpv .sk img { filter: grayscale(1) contrast(1.6) brightness(1.15) blur(.3px) }
.cmpv .cline { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--red); z-index: 4 }
.cmpv .cline .split-tag { opacity: 1; top: 14px; right: auto; left: 10px }
.cmpl { position: absolute; bottom: 14px; left: 16px; z-index: 5; color: #fff; mix-blend-mode: difference } .cmpl.r { left: auto; right: 16px }
/* colour dial */
.cdial { display: block; min-height: 0; margin: 0 calc(-1 * var(--gut)) }
.cpin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden }
.cfill { position: absolute; inset: 0 }
.cinfo { position: absolute; left: var(--gut); bottom: 120px; display: grid; gap: 12px; color: inherit }
.cinfo .mono { color: inherit; opacity: .75 }
.cinfo b { font-size: clamp(64px, 10vw, 168px); line-height: .9; font-weight: 500; letter-spacing: -0.055em }
.cstations { position: absolute; right: max(var(--gut), 128px); top: 50%; translate: 0 -50%; display: grid; gap: 14px; text-align: right }
.cstations .mono { color: inherit; opacity: .4; transition: opacity .3s } .cstations .mono.on { opacity: 1 }
.cruler { position: absolute; left: 0; right: 0; bottom: 36px; height: 46px } .cruler canvas { width: 100%; height: 100% }
.tread { display: flex; justify-content: space-between; gap: 16px; padding: 16px 24px; border-top: 1px solid var(--line) }
@media (max-width: 899px) { .cstations { display: none } }
/* type versions */
.tdial { display: block; padding: 0; background: none; margin: 0 calc(-1 * var(--gut)) }
.tpin { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; place-items: center; align-content: center; gap: 22px; overflow: hidden; background: var(--panel) }
.tbig { color: var(--ink); font-size: clamp(90px, 15vw, 260px); line-height: .9; letter-spacing: -0.045em; white-space: nowrap }
.tdl { position: absolute; top: 110px; left: var(--gut) }
.tdst { position: absolute; right: max(var(--gut), 128px); top: 50%; translate: 0 -50%; display: grid; gap: 12px; text-align: right }
.tdst .mono { opacity: .4; transition: opacity .3s, color .3s } .tdst .mono.on { opacity: 1; color: var(--ink) }
.truler { position: absolute; left: 0; right: 0; bottom: 96px; height: 46px } .truler canvas { width: 100%; height: 100% }
.tticker { display: block; padding: 40px 0 0; background: var(--panel); overflow: hidden }
.tkrow { white-space: nowrap; color: var(--ink); font-size: clamp(80px, 11vw, 190px); line-height: 1.05; letter-spacing: -0.04em; will-change: transform }
.tkrow.rev { font-size: clamp(28px, 3vw, 46px); color: var(--muted); letter-spacing: -0.01em; padding: 10px 0 30px }
/* opening section versions */
.isheet { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; border-bottom: 1px solid var(--line) }
.isheet > div { padding: 22px 20px 26px 0; border-right: 1px solid var(--line); margin-right: 20px } .isheet > div:last-child { border-right: 0; margin-right: 0 }
.isheet dt { margin-bottom: 12px } .isheet dd { margin: 0; color: var(--ink); font-size: 15px; font-weight: 500 }
.info.isht, .info.iread, .info.ispl { display: block; border-bottom: 0 }
.istory { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); padding: 72px 0; border-bottom: 1px solid var(--line) }
.istory h3 { margin: 0; color: var(--ink); font-size: clamp(30px, 3.4vw, 50px); line-height: 1.02; font-weight: 500; letter-spacing: -0.035em; max-width: 12ch }
.istory p { margin: 0 0 18px; padding-left: 40px; font-size: 18px; line-height: 1.6; max-width: 56ch } .istory p:last-child { margin-bottom: 0 }
.ibrief { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line) }
.ibrief > div { padding: 36px 40px 44px 0 } .ibrief > div + div { padding-left: 40px; border-left: 1px solid var(--line) }
.ibrief .mono { display: block; margin-bottom: 16px } .ibrief p { margin: 0; color: var(--ink); font-size: clamp(20px, 1.8vw, 26px); line-height: 1.35; letter-spacing: -0.015em; font-weight: 500 }
.iwords { margin: 0; padding: 96px 0; border-bottom: 1px solid var(--line); font-size: clamp(30px, 3.8vw, 58px); line-height: 1.1; font-weight: 500; letter-spacing: -0.035em; max-width: 24ch }
.iwords span { color: var(--line); transition: color .35s var(--ease) } .iwords span.on { color: var(--ink) }
.iswin { height: 200vh; margin: 0 calc(-1 * var(--gut)) } .ispin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden }
.isp { position: absolute; inset: 0; display: grid; align-content: center; gap: 26px; padding: 0 var(--gut); background: var(--panel) }
.isp.b { background: var(--ink) } .isp.b p, .isp.b .mono { color: var(--bg) }
