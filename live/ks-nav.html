<style>
.site { position: absolute; z-index: 3; left: 50%; top: 250rem; width: 1180rem; transform: translateX(-50%); border-radius: 22rem; overflow: visible; background: #fff; box-shadow: 0 1.5rem 0 .8rem #01182b0a, 0 24rem 60rem rgb(1 24 43 / .08) }
.top { height: 58rem; border-radius: 22rem 22rem 0 0; display: flex; align-items: center; padding: 0 30rem; color: #fff; transition: background .45s; position: relative }
.top.blue { background: #0156a1 } .top.dark { background: var(--high) }
.esc { position: absolute; left: 30rem; display: flex; align-items: center; gap: 10rem; font-size: 18rem; font-weight: 500; transition: opacity .35s, transform .35s } .esc u { color: #d2ffbd; text-underline-offset: 4rem; margin-left: 8rem } .top.blue .esc { opacity: 0; transform: translateY(8rem) }
.ic { margin-left: auto; display: flex; align-items: center; gap: 20rem } .ic > span { position: relative; display: grid; cursor: pointer } .ic > .me { display: flex }
.bdg { position: absolute; right: -6rem; top: -5rem; min-width: 18rem; height: 18rem; border-radius: 9rem; background: #e44040; font-size: 11rem; font-weight: 700; display: grid; place-items: center; padding: 0 4rem; transform: scale(0); transition: transform .35s cubic-bezier(.2,.9,.3,1.6) } .bdg.on { transform: scale(1) }
.me { display: flex; align-items: center; gap: 10rem; margin-left: 12rem; font-size: 17rem; font-weight: 500; cursor: pointer } .av { font-style: normal; width: 36rem; height: 36rem; border-radius: 50%; background: #67bc40; display: grid; place-items: center; font-size: 16rem; font-weight: 600 }
.me svg { transition: transform .3s } .me.open svg { transform: rotate(180deg) }
.body { height: 82rem; display: flex; align-items: center; gap: 28rem; padding: 0 30rem; border-radius: 0 0 22rem 22rem }
.logo { display: flex; align-items: center; gap: 10rem; font-size: 29rem; font-weight: 700; color: #0156a1; letter-spacing: -.5rem; flex: none }
.sb { position: relative; flex: 1; height: 54rem; border-radius: 14rem; background: var(--surface); box-shadow: inset 0 0 0 1.4rem var(--subtle); display: flex; align-items: center; transition: box-shadow .2s, background .2s }
.sb.f { background: #fff; box-shadow: inset 0 0 0 2.4rem var(--brand) }
.q { flex: 1; display: flex; align-items: center; gap: 12rem; padding: 0 18rem; font-size: 17rem; color: var(--small); white-space: nowrap; overflow: hidden } .q.has { color: var(--high) }
.stt { width: 196rem; height: 100%; border-left: 1.4rem solid var(--divider); display: flex; align-items: center; justify-content: space-between; padding: 0 16rem; font-size: 17rem; color: var(--small); cursor: pointer } .stt.has { color: var(--high) } .stt svg { color: var(--small) }
.sell { flex: none; height: 54rem; padding: 0 22rem; border-radius: 14rem; background: var(--ok); color: #fff; display: flex; align-items: center; gap: 10rem; font-size: 18rem; font-weight: 500; box-shadow: inset 0 -3rem 1.5rem #2a8400 }
.dd { position: absolute; top: calc(100% + 10rem); background: #fff; border-radius: 16rem; box-shadow: 0 0 0 1.4rem var(--subtle), 0 20rem 44rem rgb(1 24 43 / .12); padding: 8rem; opacity: 0; transform: translateY(-8rem); pointer-events: none; transition: .25s; z-index: 5 }
.dd.on { opacity: 1; transform: none; pointer-events: auto } .dd div { display: flex; align-items: center; gap: 12rem; height: 46rem; padding: 0 14rem; border-radius: 10rem; font-size: 17rem; color: var(--head) } .dd div.hv { background: var(--brandbg); color: var(--high) }
.dd .lb { height: 30rem; font-size: 13rem; font-weight: 600; letter-spacing: 1.4rem; text-transform: uppercase; color: var(--small) } .dd img { width: 26rem; height: 26rem } .dd b { font-weight: 600; color: var(--high) }
#sug { left: 0; width: 520rem } #sts { right: 0; width: 196rem } #mm { right: 30rem; top: 54rem; width: 240rem }
.pg { position: absolute; left: 50%; top: 300rem; width: 1180rem; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 16rem; opacity: .9 }
.pg div { height: 400rem; border-radius: 18rem; background: #fff; box-shadow: inset 0 0 0 1.4rem var(--subtle); overflow: hidden } .pg img { width: 100%; height: 280rem; object-fit: cover; display: block } .pg i { display: block; height: 14rem; margin: 18rem 16rem 0; border-radius: 7rem; background: var(--subtle) } .pg i + i { width: 50%; margin-top: 10rem }
</style>

<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const { naira } = CO;
  const type = async (H, el, text, ms = 55, from = '') => { el.classList.remove('ph'); for (let i = from.length; i <= text.length; i++) { el.innerHTML = text.slice(0, i) + '<i class="caret"></i>'; await H.sleep(ms); } };
  const settle = (el, text) => { el.textContent = text; };
  const toast = (t, ms = 1600) => { const e = $('.toast'); if (!e) return; e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms); };

  const SUG = q => `<div class="lb">Suggestions</div><div><b>${q}</b>&nbsp;15 Pro Max</div><div><b>${q}</b>&nbsp;14, 128GB</div><div class="lb">Category</div><div><img src="ks/ic-gadgets.svg" alt="">Gadgets · Phones</div>`;
  const close = () => ['#sug', '#sts', '#mm'].forEach(s => $(s).classList.remove('on')), set = (s, on) => $(s).classList.toggle('on', on);
  const variant = d => { $('#top').className = 'top ' + (d ? 'dark' : 'blue'); };
  const reset = () => { close(); variant(true); $('#sb').classList.remove('f'); $('#q').classList.remove('has'); $('#qt').textContent = 'Search for products, brands or categories'; $('#stt').classList.remove('has'); $('#stv').textContent = 'Select state'; $('#bdg').classList.remove('on'); $('#me').classList.remove('open'); $$('.dd div').forEach(d => d.classList.remove('hv')); };
  $('#q').onclick = () => { close(); $('#sb').classList.add('f'); };
  $('#stt').onclick = e => { e.stopPropagation(); const o = !$('#sts').classList.contains('on'); close(); set('#sts', o); };
  $$('#sts div').forEach(d => d.onclick = e => { e.stopPropagation(); $('#stv').textContent = d.textContent; $('#stt').classList.add('has'); close(); });
  $('#me').onclick = e => { e.stopPropagation(); const o = !$('#mm').classList.contains('on'); close(); set('#mm', o); $('#me').classList.toggle('open', o); };
  $('#bell').onclick = () => $('#bdg').classList.toggle('on'); $('.esc u').onclick = () => variant(false);
  addEventListener('click', e => { if (!e.target.closest('.dd, .stt, .me')) { close(); $('#me').classList.remove('open'); } });
  reset();
  const hv = async (H, el, ms = 380) => { await H.at(el, .3, .5, ms); $$('.dd div').forEach(d => d.classList.remove('hv')); el.classList.add('hv'); };
  CO.demo(async H => { reset(); await H.sleep(700);
    await H.tap('#q', () => { $('#sb').classList.add('f'); $('#q').classList.add('has'); }, .3); H.away();
    for (let i = 1; i <= 6; i++) { $('#qt').innerHTML = 'iphone'.slice(0, i) + '<i class="caret"></i>'; await H.sleep(90); } $('#qt').textContent = 'iphone'; $('#sug').innerHTML = SUG('iphone'); set('#sug', true); await H.sleep(700);
    await hv(H, $$('#sug div')[2]); await H.sleep(500); await H.tap($$('#sug div')[2], () => { $('#qt').textContent = 'iphone 14, 128GB'; close(); });
    await H.tap('#stt', () => set('#sts', true), .5); await hv(H, $$('#sts div')[0]); await H.sleep(300); await H.tap($$('#sts div')[0], () => { $('#stv').textContent = 'Lagos'; $('#stt').classList.add('has'); close(); }); $('#sb').classList.remove('f');
    await H.sleep(400); await H.at('#bell', .5, .5); $('#bdg').classList.add('on'); await H.sleep(700);
    await H.tap('#me', () => { set('#mm', true); $('#me').classList.add('open'); }, .5); await hv(H, $$('#mm div')[1]); await H.sleep(900); await H.tap($$('#mm div')[1], () => { close(); $('#me').classList.remove('open'); });
    await H.tap('.esc u', () => variant(false)); H.away(); await H.sleep(2000); variant(true); await H.sleep(1500); });
})();
</script>
