<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fear and greed gauge</title>
<link rel="preload" href="../assets/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/inter-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="kit.css">
<style>
/* a sentiment gauge: the needle swings with a little overshoot as the reading changes, history beside it */
.body { display: grid; grid-template-columns: 470rem 1fr; gap: 56rem; align-items: center; margin-top: 30rem }
.g { position: relative } .g svg { width: 100% }
.g .c { text-align: center; margin-top: 14rem }
.g .c b { display: block; font-size: 64rem; font-weight: 500; letter-spacing: -1rem; line-height: 1 } .g .c span { font-size: 22rem; transition: color .5s }
.hist .h { display: flex; align-items: center; justify-content: space-between; padding: 17rem 0; border-top: 1px solid var(--line) }
.hist .h:first-child { border-top: 0 }
.pill { display: inline-flex; align-items: center; gap: 12rem } .pill i { width: 46rem; height: 46rem; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 19rem; font-weight: 500; color: #0b0b0b; transition: background .5s }
@media (max-aspect-ratio: 6/5) { .body { grid-template-columns: 1fr; gap: 22rem } .hist { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26rem } .hist .h:nth-child(2) { border-top: 0 } }
</style>
</head>
<body>
<div class="card">
  <div class="row between">
    <div class="col" style="gap:6rem"><div class="mid">Fear &amp; Greed Index</div><span class="small">Crypto market sentiment</span></div>
    <span class="small wide-only" id="upd">Updated just now</span>
  </div>
  <div class="body">
    <div class="g"><svg viewBox="0 0 470 262" id="svg"></svg><div class="c"><b id="val">72</b><span id="word">Greed</span></div></div>
    <div class="hist" id="hist"></div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(() => {
  const Z = [[0, 25, 'Extreme fear', '#ff5d5d'], [25, 45, 'Fear', '#f5a524'], [45, 55, 'Neutral', '#c9c9c9'], [55, 75, 'Greed', '#8fdb5a'], [75, 101, 'Extreme greed', '#34da62']];
  const zone = v => Z.find(z => v >= z[0] && v < z[1]);
  const svg = document.getElementById('svg'), valEl = document.getElementById('val'), word = document.getElementById('word'), hist = document.getElementById('hist');
  const H = [['Now', 72], ['Yesterday', 64], ['Last week', 48], ['Last month', 31]];
  hist.innerHTML = H.map(h => `<div class="h"><span class="label">${h[0]}</span><span class="pill"><span class="label" style="color:var(--text)"></span><i></i></span></div>`).join('');
  const rows = [...hist.children];
  const paintHist = () => H.forEach((h, i) => { const z = zone(h[1]); rows[i].querySelector('.label + .pill .label, .pill .label').textContent = z[2]; const d = rows[i].querySelector('i'); d.textContent = Math.round(h[1]); d.style.background = z[3]; });
  paintHist();
  let target = 72, ang = 72, vel = 0;
  const cx = 235, cy = 240, R = 196, pol = (v, r) => { const a = Math.PI * (1 - v / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (a, b, r) => { const [x0, y0] = pol(a, r), [x1, y1] = pol(b, r); return `M${x0.toFixed(1)},${y0.toFixed(1)}A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; };
  KM.every(2400, () => { target = KM.clamp(target + KM.rnd(-9, 9.5), 12, 92); H[0][1] = target; paintHist(); });
  KM.frame((now, dt) => {
    vel += (target - ang) * 60 * dt; vel *= Math.pow(.02, dt); ang += vel * dt;        // a spring: the needle overshoots a touch and settles
    const z = zone(KM.clamp(ang, 0, 100)); let s = '';
    Z.forEach(q => { s += `<path d="${arc(q[0] + .8, Math.min(100, q[1]) - .8, R)}" fill="none" stroke="${q[3]}" stroke-width="26" stroke-linecap="butt" opacity="${q === z ? 1 : .32}"/>`; });
    for (let t = 0; t <= 100; t += 5) { const [a1, b1] = pol(t, R - 26), [a2, b2] = pol(t, R - (t % 25 ? 33 : 40)); s += `<line x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}" stroke="#3a3a3a" stroke-width="2"/>`; }
    const [nx, ny] = pol(KM.clamp(ang, 0, 100), R - 52), [bx, by] = pol(KM.clamp(ang, 0, 100) + 50, 9), [b2x, b2y] = pol(KM.clamp(ang, 0, 100) - 50, 9);
    s += `<path d="M${bx.toFixed(1)},${by.toFixed(1)}L${nx.toFixed(1)},${ny.toFixed(1)}L${b2x.toFixed(1)},${b2y.toFixed(1)}Z" fill="#fff" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="12" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="5" fill="#171717"/>`;
    svg.innerHTML = s; valEl.textContent = Math.round(KM.clamp(ang, 0, 100)); word.textContent = z[2]; word.style.color = z[3];
  });
})();
</script>
</body>
</html>
