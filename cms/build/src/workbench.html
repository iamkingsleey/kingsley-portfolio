<!-- Engineering · the dial: the tools sit on a ruler at their own frequency. Tune the red needle (drag, tap, scroll or arrow
     keys) and it settles on the nearest tool; that tool's small live demo plays on the stage, with its words underneath.
     Between tools the stage fills with static. On phones the ruler runs across the top.
     The demo comes from the tool's "demo" setting in the CMS (Line, Mesh, Paper, Reel, Dial), or a picture if it has one. -->
<style>
.wbband { display: none !important }

.wb .live .dot::before, .wb .live .dot::after { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--red); animation: wbring 2.4s cubic-bezier(.2,.6,.3,1) infinite }
.wb .live .dot::after { animation-delay: 1.2s }
.wb .stage.static .live .dot { background: var(--faint) } .wb .stage.static .live .dot::before, .wb .stage.static .live .dot::after { border-color: var(--muted) }
.wb .stage { transition: transform .5s cubic-bezier(.2,.8,.2,1) }   /* leans towards the pointer */
.wb .stage.play { cursor: crosshair }
.wb .stage .hint { position: absolute; z-index: 3; left: 24px; bottom: 18px; font: 600 11px var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity .3s; pointer-events: none } .wb .stage.play .hint { opacity: .8 }

.wb .stage.chan .live, .wb .stage.chan .fqr { animation: flick .35s steps(6) }

@keyframes flick { 0%, 100% { opacity: 1 } 20% { opacity: .2 } 40% { opacity: .9 } 60% { opacity: .1 } 80% { opacity: .7 } }
@keyframes beam { 0%, 20% { opacity: 0; transform: scaleX(.3) } 34% { opacity: 1; transform: scaleX(1) } 46% { opacity: 1; transform: scaleX(1) } 62% { opacity: 0; transform: scaleX(.02) } 100% { opacity: 0 } }
@keyframes wbring { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(3.2); opacity: 0 } }
.wb .stage canvas.demo { position: absolute; left: 0; right: 0; top: 64px; width: 100%; height: calc(100% - 64px); display: block }
.wb .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.wb .stage canvas.st { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none }
.wb .tx { display: grid; gap: 14px; transition: opacity .35s } .wb .tx.fade { opacity: .15 }
.wb .tx .hd { display: flex; align-items: center; gap: 14px }
.wb .tx h3 { margin: 0 auto 0 0; color: var(--ink); font-size: 34px; font-weight: 500; letter-spacing: -.035em; line-height: 1.1 }
.wb .tx p { margin: 0 0 10px; color: var(--text); font-size: 16px; line-height: 1.55; max-width: 54ch }
.wb .tx .meta { font: 600 11.5px var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) } .wb .tx .meta i { font-style: normal; color: var(--ink) }
.wb .arr { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 99px; background: var(--pill); color: var(--ink); text-decoration: none; font-size: 17px; transition: background .2s, color .2s, transform .25s }
.wb .arr:hover { background: var(--ink); color: var(--bg); transform: rotate(45deg) }
@media (max-width: 860px) { .wb .stage .hint { left: 18px; bottom: 14px } .wb .stage.chan::after { top: calc(50% + 25px) } .wb { grid-template-columns: 1fr; gap: 24px; padding-top: 75px } .wb .dial { min-height: 96px; height: 96px }
  .wb .stage { height: calc((100vw - 36px) * .625); max-height: 70vh }   /* Safari on iPhone ignored the 16:10 shape here and folded the card flat */
  /* phones: card first, dial under it so the thumb on the dial never covers the card */ .wb .right { display: contents } .wb .stage { order: 1 } .wb .dial { order: 2 } .wb .tx { order: 3 }
  .wb .stage .live, .wb .stage .fqr { top: 18px; font-size: 11.5px } .wb .stage .live { left: 18px } .wb .stage .fqr { right: 18px } .wb .stage canvas.demo { top: 50px; height: calc(100% - 50px) } .wb .tx h3 { font-size: 26px } }

</style>

    mesh(g, W, H, t, C) { const R = Math.min(W, H) * .32, cx = W / 2, cy = H / 2, a = t * .0005 + PT.rot, b = .45 + (PT.on ? (PT.y - .5) * .9 : 0),   // drag to spin, up and down to tilt

    // a quick scripted session on a ghost dashboard: everything drawn as faint rounded outlines (a sidebar, an input,

      if (live) { g.strokeStyle = C.red; g.lineWidth = 1.2; rr(F.x + .5, F.y + .5, F.w, F.h, 8); g.stroke(); } else ghost(F.x, F.y, F.w, F.h, 8, .28);

    // Origa: a banknote drawn as a wireframe sheet. It lies flat, then its far end rolls up into a tight cylinder of cash,

  const show = i => { if (i === cur) return; if (cur >= 0 && !reduce) { stage.classList.remove('chan'); void stage.offsetWidth; stage.classList.add('chan'); burst = performance.now(); } cur = i; const t = TOOLS[i]; if (window._wbHint) window._wbHint();
