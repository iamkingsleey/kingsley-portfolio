<!-- Engineering · the workbench: a card per tool, each with a small live demo on top (drawn only while on screen).
     The demo comes from the tool's "demo" setting in the CMS (Line, Mesh, Reel, Dial), or a picture if it has one.
     Under the drawing: the name with a round arrow to the tool, what it does, then the details (users, frequency, tech). -->
<style>
.wbband { display: none !important }
.wb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-bottom: 40px }
.wb .tool { background: var(--panel); border-radius: 4px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; transition: transform .5s cubic-bezier(.2,.8,.2,1) }
.wb .tool:hover { transform: translateY(-3px) }
.wb .view { position: relative; aspect-ratio: 16 / 11; background: color-mix(in srgb, var(--ink) 4%, var(--bg)); border-bottom: 1px solid var(--line); overflow: hidden }
.wb .view img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover }
.wb .view canvas { position: absolute; left: 0; right: 0; top: 72px; width: 100%; height: calc(100% - 72px); display: block }   /* the drawing starts below the label, the same gap on every card */
.wb .live { position: absolute; z-index: 2; left: 24px; top: 24px; display: flex; align-items: center; font: 500 12.5px var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.wb .live .dot { position: relative; width: 8px; height: 8px; border-radius: 99px; background: var(--faint); margin-right: 10px; transition: background .3s }
.wb .live .dot::before, .wb .live .dot::after { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--muted); animation: wbring 2.4s cubic-bezier(.2,.6,.3,1) infinite }   /* rings, like Open to new work on Home */
.wb .live .dot::after { animation-delay: 1.2s }
.wb .tool.on .live .dot { background: var(--red) } .wb .tool.on .live .dot::before, .wb .tool.on .live .dot::after { border-color: var(--red) }
@keyframes wbring { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(3.2); opacity: 0 } }
.wb .t2 { display: flex; flex-direction: column; gap: 14px; padding: 30px 32px }
.wb .t2 .hd { display: flex; align-items: center; gap: 14px }
.wb .t2 h3 { margin: 0 auto 0 0; color: var(--ink); font-size: 30px; font-weight: 500; letter-spacing: -.035em; line-height: 1.1 }
.wb .t2 p { margin: 0 0 22px; color: var(--text); font-size: 16px; line-height: 1.55; max-width: 52ch }
.wb .t2 .meta { margin-top: auto; font: 500 11.5px var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) } .wb .t2 .meta i { font-style: normal; color: var(--ink) }
.wb .t2 .arr { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 99px; background: var(--pill); color: var(--ink); text-decoration: none; font-size: 17px; transition: background .2s, color .2s, transform .25s }
.wb .t2 .arr:hover { background: var(--ink); color: var(--bg); transform: rotate(45deg) }
@media (max-width: 860px) { .wb { grid-template-columns: 1fr } .wb .live { left: 18px; top: 18px; font-size: 11.5px } .wb .view canvas { top: 56px; height: calc(100% - 56px) } .wb .t2 { padding: 24px 20px } .wb .t2 h3 { font-size: 25px } }
@media (prefers-reduced-motion: reduce) { .wb .live .dot::before, .wb .live .dot::after { animation: none; opacity: 0 } }
</style>
<script>
(() => {
  const TOOLS = __TOOLS__, host = document.getElementById('wb'); if (!host) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const guess = t => t.demo || (/line/i.test(t.name) ? 'line' : /mesh|3d|wire/i.test(t.name + t.type) ? 'mesh' : /reel|video|playwright/i.test(t.name + t.type) ? 'reel' : 'dial');
  const col = () => { const s = getComputedStyle(document.documentElement); return { ink: s.getPropertyValue('--ink').trim() || '#000', muted: s.getPropertyValue('--muted').trim() || '#888', panel: s.getPropertyValue('--panel').trim() || '#eee', red: '#ff4a1c' }; };
  const DEMOS = {
    line(g, W, H, t, C) { g.lineWidth = 2; g.lineJoin = 'round'; const rows = 7;
      for (let r = 0; r < rows; r++) { const y0 = H * (.2 + r * .6 / (rows - 1)), amp = H * .045 * (1 + Math.sin(t * .0012 + r * .6) * .6), n = 9 + r, ph = t * .0006 * (r % 2 ? 1 : -1);
        g.globalAlpha = r === 3 ? 1 : .55; g.strokeStyle = r === 3 ? C.red : C.ink; g.beginPath(); for (let i = 0; i <= n * 2; i++) { const x = W * .12 + (W * .76) * i / (n * 2), y = y0 + (i % 2 ? -amp : amp) * Math.cos(ph + i * .2); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); } g.globalAlpha = 1; },
    mesh(g, W, H, t, C) { const R = Math.min(W, H) * .32, cx = W / 2, cy = H / 2, a = t * .0005, b = .45, P = (la, lo) => { const x = Math.cos(la) * Math.cos(lo + a), y = Math.sin(la), z = Math.cos(la) * Math.sin(lo + a); return [cx + x * R, cy + (y * Math.cos(b) - z * Math.sin(b)) * R]; };
      g.lineWidth = 1.2; g.strokeStyle = C.ink; g.globalAlpha = .5; for (let i = 1; i < 9; i++) { const la = -Math.PI / 2 + i * Math.PI / 9; g.beginPath(); for (let k = 0; k <= 60; k++) { const [x, y] = P(la, k / 60 * Math.PI * 2); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
      for (let j = 0; j < 12; j++) { const lo = j / 12 * Math.PI * 2; g.beginPath(); for (let k = 0; k <= 40; k++) { const [x, y] = P(-Math.PI / 2 + k / 40 * Math.PI, lo); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.globalAlpha = j ? .32 : 1; g.strokeStyle = j ? C.ink : C.red; g.lineWidth = j ? 1.2 : 2; g.stroke(); } g.globalAlpha = 1; },
    // a quick scripted session on a ghost dashboard: everything drawn as faint rounded outlines (a sidebar, an input,
    // a card with a switch, a pill button). The cursor darts between them; each click lands with a small ring and a little push in.
    reel(g, W, H, t, C) {
      const T = 3600, q = (t % T) / T, step = Math.min(2, Math.floor(q * 3)), u = q * 3 - step;
      const eo = x => 1 - Math.pow(1 - x, 3), back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
      const ghost = (x, y, w, h, r, a = .2) => { g.strokeStyle = C.ink; g.globalAlpha = a; g.lineWidth = 1; rr(x + .5, y + .5, w, h, r); g.stroke(); g.globalAlpha = 1; };
      const fw = Math.min(W * .7, 460), fh = Math.min(H * .62, 250), fx = (W - fw) / 2, fy = (H - fh) / 2 - H * .04;
      const sw = fw * .22, px = fx + sw + 18, pw = fw - sw - 36;
      const F = { x: px, y: fy + 20, w: pw * .7, h: 28 }, K = { x: px, y: fy + 64, w: pw, h: fh - 64 - 64 }, S = { x: px + pw - 16 - 36, y: K.y + K.h / 2 - 10, w: 36, h: 20 }, B = { x: px + pw - 104, y: fy + fh - 20 - 30, w: 104, h: 30 };
      const tg = [[F.x + F.w * .75, F.y + F.h / 2], [S.x + S.w / 2, S.y + S.h / 2], [B.x + B.w / 2, B.y + B.h / 2]];
      const from = step ? tg[step - 1] : [fx + fw * .86, fy + fh * .8], to = tg[step], k = Math.min(1, u / .4), mv = back(k);
      const cx = from[0] + (to[0] - from[0]) * mv, cy = from[1] + (to[1] - from[1]) * mv - Math.sin(k * Math.PI) * 14;
      const since = u - .44, clicked = since > 0, kick = clicked ? Math.exp(-since * 14) : 0;
      const z = 1 + kick * .035; g.save(); g.translate(cx, cy); g.scale(z, z); g.translate(-cx, -cy);
      // the ghost dashboard
      ghost(fx, fy, fw, fh, 12, .22);
      ghost(fx + 10, fy + 10, sw - 10, fh - 20, 8, .14);
      for (let i = 0; i < 4; i++) ghost(fx + 20, fy + 22 + i * 24, sw - 30, 14, 7, i ? .14 : .3);
      ghost(K.x, K.y, K.w, K.h, 10, .16);
      g.fillStyle = C.ink; g.globalAlpha = .14; rr(K.x + 16, K.y + K.h / 2 - 4, pw * .34, 8, 4); g.fill(); g.globalAlpha = 1;
      // input: outlines red when clicked, fills with typing
      const typed = step > 0 ? 1 : clicked ? Math.min(1, since / .45) : 0, live = step === 0 && clicked;
      if (live) { g.strokeStyle = C.red; g.lineWidth = 1.2; rr(F.x + .5, F.y + .5, F.w, F.h, 8); g.stroke(); } else ghost(F.x, F.y, F.w, F.h, 8, .28);
      g.fillStyle = C.ink; g.globalAlpha = .7; const tw = (F.w - 24) * .82 * eo(typed); if (tw > 2) { rr(F.x + 12, F.y + F.h / 2 - 3.5, tw, 7, 3.5); g.fill(); }
      if (live && Math.floor(t / 260) % 2) { g.globalAlpha = 1; g.fillRect(F.x + 14 + tw, F.y + 8, 1.5, F.h - 16); } g.globalAlpha = 1;
      // switch in the card
      const on = step > 1 ? 1 : step === 1 && clicked ? eo(Math.min(1, since / .16)) : 0;
      if (on > .5) { g.fillStyle = C.red; rr(S.x, S.y, S.w, S.h, 10); g.fill(); } else ghost(S.x, S.y, S.w, S.h, 10, .45);
      g.fillStyle = on > .5 ? C.panel : C.ink; g.beginPath(); g.arc(S.x + 10 + on * (S.w - 20), S.y + 10, 6, 0, 7); g.fill();
      // pill button
      const hit = step === 2 && clicked, bs = 1 - (hit ? kick : 0) * .07;
      g.save(); g.translate(B.x + B.w / 2, B.y + B.h / 2); g.scale(bs, bs);
      if (hit) { g.fillStyle = C.red; rr(-B.w / 2, -B.h / 2, B.w, B.h, B.h / 2); g.fill(); } else { g.strokeStyle = C.ink; g.globalAlpha = .5; g.lineWidth = 1.2; rr(-B.w / 2, -B.h / 2, B.w, B.h, B.h / 2); g.stroke(); g.globalAlpha = .35; g.fillStyle = C.ink; rr(-B.w * .25, -3, B.w * .5, 6, 3); g.fill(); g.globalAlpha = 1; }
      g.restore();
      g.restore();
      if (clicked && since < .3) { g.strokeStyle = C.red; g.globalAlpha = 1 - since / .3; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, 5 + since * 110, 0, 7); g.stroke(); g.globalAlpha = 1; }
      const sq = 1 - kick * .2; g.save(); g.translate(cx, cy); g.scale(sq, sq); g.fillStyle = C.ink; g.strokeStyle = C.panel; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, 0); g.lineTo(11, 13); g.lineTo(5.5, 13); g.lineTo(1, 18); g.closePath(); g.fill(); g.stroke(); g.restore();
      // the take: one thin rounded line
      const ly = fy + fh + 26; g.fillStyle = C.ink; g.globalAlpha = .12; rr(fx, ly, fw, 2, 1); g.fill(); g.globalAlpha = 1; g.fillStyle = C.red; rr(fx, ly, fw * q, 2, 1); g.fill(); },
    dial(g, W, H, t, C) { const mid = W / 2, off = (Math.sin(t * .0007) * .5 + .5) * 260, gap = 12, by = H * .66; g.fillStyle = C.ink; for (let i = -10; i < 60; i++) { const x = mid + i * gap - off; if (x < 0 || x > W) continue; g.globalAlpha = Math.max(.1, 1 - Math.abs(x - mid) / mid); const h = i % 10 === 0 ? 30 : i % 5 === 0 ? 18 : 10; g.fillRect(x, by - h, 1.2, h); }
      g.globalAlpha = 1; g.fillStyle = C.red; g.fillRect(mid - 1.5, by - 46, 3, 54); g.fillStyle = C.ink; g.font = '500 ' + Math.round(H * .16) + 'px Geist, ui-sans-serif, sans-serif'; g.textAlign = 'center'; g.fillText((88 + off / 60).toFixed(1), mid, H * .36); g.textAlign = 'left'; }
  };
  const live = [];
  TOOLS.forEach(t => { const el = document.createElement('article'); el.className = 'tool'; const kind = t.picture ? 'picture' : guess(t);
    el.innerHTML = `<div class="view">${t.picture ? `<img alt="" loading="lazy" src="${esc(t.picture)}">` : '<canvas></canvas>'}<span class="live"><i class="dot"></i>${t.picture ? '' : 'Live · '}${esc(t.type)}</span></div>
      <div class="t2"><div class="hd"><h3>${esc(t.name)}</h3>${t.link ? `<a class="arr" href="${esc(t.link)}" target="_blank" rel="noopener" aria-label="${esc(t.linkLabel || 'Open')}" title="${esc(t.linkLabel || 'Open')}">↗</a>` : ''}</div>
        <p>${esc(t.what)}</p>
        <span class="meta">${t.stat ? `<i>${esc(t.stat)} ${esc(t.statLabel)}</i> · ` : ''}${esc(t.fq)} FM${t.tech ? ' · ' + esc(t.tech) : ''}</span></div>`;
    host.append(el); el.addEventListener('pointerenter', () => el.classList.add('on')); el.addEventListener('pointerleave', () => el.classList.remove('on'));
    const c = el.querySelector('canvas'); if (c && DEMOS[kind]) live.push({ c, kind, el, vis: false }); });
  // demos draw only while on screen
  const io = new IntersectionObserver(es => es.forEach(e => { const L = live.find(x => x.el === e.target); if (L) L.vis = e.isIntersecting; }), { threshold: 0 });
  host.querySelectorAll('.tool').forEach(el => io.observe(el));
  let C = col(); new MutationObserver(() => { C = col(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  (function loop(t) { for (const L of live) { if (!L.vis) continue; const W = L.c.clientWidth, H = L.c.clientHeight, d = Math.min(2, devicePixelRatio || 1); if (!W) continue;
      if (L.c.width !== Math.round(W * d)) { L.c.width = Math.round(W * d); L.c.height = Math.round(H * d); } const g = L.c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, W, H); DEMOS[L.kind](g, W, H, reduce ? 1200 : t, C); }
    requestAnimationFrame(loop); })(0);
})();
</script>
