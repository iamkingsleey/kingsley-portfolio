<style>
/* Layout: the V1 side menu top-left, category chips top-right, a horizontal row of work in the middle where the
   piece on the needle is full size and its neighbours sit smaller and faded, its caption above and meta below,
   and the ruler dial along the bottom that scrubs the row. Single light look, matching the site. */
:root {
  --bg: #ffffff;
  --ink: #000000;
  --text: #3b3b3b;
  --muted: #6f6f6f;
  --faint: #d4d4d4;
  --tile: #f3f3f3;
  --on-ink: #ffffff;
  --hover: #e8e8e8;
  --line: #ececec;
  --edge: rgb(0 0 0 / .08);
  --pill: #f2f2f2;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100%; overflow: hidden }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  -webkit-user-select: none; user-select: none }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px }

/* ---------- Station indicator: where you are, and the way back to Home (98.0) ---------- */
.station { position: fixed; left: max(48px, env(safe-area-inset-left, 0px)); top: 108px; z-index: 20;   /* level with the filter row */ display: flex; align-items: center; gap: 6px }
.back { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px 0 10px; border-radius: 999px; background: var(--pill); font: 600 12px var(--mono); color: var(--muted); letter-spacing: .3px; transition: background .25s, color .25s }
.back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.2,.8,.2,1) }
.back span { font-family: var(--body); font-size: 13px; letter-spacing: -.1px }
.back:hover { background: var(--hover); color: var(--ink) }
.back:hover svg { transform: translateX(-3px) }
.now { display: flex; align-items: baseline; gap: 9px; padding: 0 10px 0 0; color: var(--ink) }   /* no left padding: the frequency lines up with the left edge of the pictures */
.now .fq { font: 500 26px/1 var(--body); letter-spacing: -1px; font-variant-numeric: tabular-nums; min-width: 3.4ch }
.now .nm { font-size: 13px; font-weight: 500 }
.now .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; margin-left: 2px }
.now .bars i { width: 2.5px; border-radius: 1px; background: var(--ink); transition: opacity .2s }
.now .bars i:nth-child(1) { height: 4px } .now .bars i:nth-child(2) { height: 7px } .now .bars i:nth-child(3) { height: 11px }
.tune-out .now .bars i { animation: fade .3s steps(1) infinite }
.tune-out .now .bars i:nth-child(2) { animation-delay: .1s } .tune-out .now .bars i:nth-child(3) { animation-delay: .2s }
@keyframes fade { 50% { opacity: .15 } }
.toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; background: var(--ink); color: var(--on-ink); font-size: 13px; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .3s }
.toast.show { opacity: 1 }
body { transition: opacity .35s }
body.leaving .row, body.leaving .cap { opacity: .25; filter: blur(6px); transition: opacity .4s, filter .4s }

/* ---------- Top right: category chips + count ---------- */
.top { position: fixed; left: 50%; transform: translateX(-50%); top: 106px; z-index: 20; display: flex; align-items: center; gap: 18px }
.chips { display: flex; gap: 4px } .chips button { white-space: nowrap }
:root[data-theme="light"] .ov-t.fits .ov-c .fit { box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14) }   /* the white tag keeps an edge on the light page */   /* the white selection already shows it's active */
.ov-c .fit, .ov-t.fits .ov-c .fit { display: none } .ov-t.fits .ov-c .fit-x { margin: 0 6px 0 0; padding: 2px 7px; border-radius: 999px; background: #fff; color: #0a0a0a; font: 600 10px var(--mono); font-style: normal; letter-spacing: .3px; vertical-align: 2px }
.chips button { font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 999px; color: var(--muted); transition: background .25s, color .25s }
.chips button sup { font: 600 10px var(--mono); margin-left: 3px }
.chips button:hover { color: var(--ink) }
.chips button.on { background: var(--ink); color: var(--on-ink) }
.count { font: 600 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right }
.count b { color: var(--ink); font-weight: 500 }

/* ---------- Row of work ---------- */
.row { position: fixed; inset: 0 0 96px 0; z-index: 5; touch-action: pan-y; cursor: grab }
.row.drag { cursor: grabbing }
.slot .cstag { position: absolute; top: 12px; left: 12px; z-index: 4; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px 6px 8px; border-radius: 999px; background: rgb(0 0 0 / .55); color: #fff; font: 600 9.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none }
.slot .cstag::before, .cap .csc::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #fb233b }
.cap .csc { display: inline-flex; align-items: center; gap: 6px; color: var(--ink) }
/* the small view for a design shot: the picture, its title and a line about it */
/* small view: two columns, the picture on the left and its details on the right (they stay put as you scroll) */
.d-mini .d-cols { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 64px; align-items: start }
.d-mini .d-info { position: sticky; top: 140px; margin-top: 0; max-width: none }
.d-mini .d-frame.m { width: min(100%, calc((100svh - 200px) * var(--r))) }
@media (max-width: 899px) { .d-mini .d-cols { grid-template-columns: 1fr; gap: 36px } .d-mini .d-info { position: static } }
@media (max-width: 899px) { .d-mini .d-frame.m { width: 100%; margin-inline: auto } }   /* phones: every piece spans the page's content width (its own margins), centred, however tall it is */
.d-mini .d-frame.m { height: auto; overflow: hidden; background: var(--tile) }
.d-mini .d-frame.m .d-pic { inset: 0 }
.d-info { display: grid; gap: 44px; max-width: 620px; margin-top: 44px }
.d-ih h1 { margin: 0; color: var(--ink); font-size: clamp(36px, 4.4vw, 60px); line-height: .95; font-weight: 500; letter-spacing: -0.045em }
.d-yr { display: block; margin-top: 12px; color: var(--muted); font-size: 15px }
.d-chip { display: inline-block; margin-top: 16px; padding: 7px 11px; background: var(--tile); color: var(--ink); font: 600 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase }
.d-ib h3 { margin: 0 0 12px; color: var(--ink); font-size: 15px; font-weight: 600 }
.d-ib p { margin: 0; color: var(--text); font-size: 17px; line-height: 1.6 }
.d-read { display: inline-block; margin-top: 18px; color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px }
.d-cred { margin: 0; max-width: 420px } .d-cred > div { display: flex; justify-content: space-between; gap: 24px; padding: 6px 0 } .d-cred dt { color: var(--muted) } .d-cred dd { margin: 0; color: var(--ink) }
.d-mini .d-intro .d-sum { max-width: 46ch; font-size: clamp(20px, 2vw, 26px); line-height: 1.35 }
.d-mini .d-sec[data-s="1"] { padding-bottom: 80px }
body.open.mini .sdial { opacity: 0; pointer-events: none }
.slot { position: absolute; left: 50%; top: 0; transform-origin: center; will-change: transform; overflow: hidden; background: var(--tile); cursor: pointer; opacity: 0 }   /* hit areas + video sources; the canvas draws them */
canvas.field { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1 }
.slot.active { cursor: default }
.slot img, .slot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none }
.slot.white { background: #fff; outline: 1px solid var(--edge); outline-offset: -1px }

/* Caption: follows the piece on the needle */
.cap { position: absolute; left: 50%; top: 0; z-index: 6; pointer-events: none; will-change: transform, opacity }
.cap h2 { position: absolute; left: 0; bottom: 14px; margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.5px; color: var(--ink); white-space: nowrap }
.cap .num { position: absolute; left: 0; font: 600 12px var(--mono); color: var(--muted) }
.cap .num i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); margin-right: 7px; vertical-align: 1px }
.cap .meta { position: absolute; right: 0; text-align: right; font: 11px/1.6 var(--mono); letter-spacing: .3px; text-transform: uppercase; color: var(--muted); white-space: nowrap }
.cap .meta b { color: var(--ink); font-weight: 500 }
/* Tool icons (the same files as Home's dock); a tool without an icon shows its name in a small chip */
.tools { display: inline-flex; gap: 6px; align-items: center; vertical-align: middle }
.tools img, .tools .tx { width: var(--ts, 18px); height: var(--ts, 18px); border-radius: 27%; display: block; flex: none; box-shadow: 0 0 0 1px var(--edge) }   /* hairline keeps dark icons visible on dark */
.tools .tx { width: auto; padding: 0 .5em; display: grid; place-items: center; background: var(--pill); color: var(--ink); font: 500 calc(var(--ts, 18px) * .5) var(--mono); text-transform: uppercase; letter-spacing: .3px }
.cap .meta .tools { --ts: 18px; margin: 2px 0 0 4px }
.d-meta .tools { --ts: 30px; gap: 8px; margin-top: 2px }

/* ---------- Ruler dial ---------- */
.dial { position: fixed; left: 0; right: 0; bottom: 0; height: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 14; touch-action: none; cursor: grab }
.dial.drag { cursor: grabbing }
.dial svg { position: absolute; left: 0; top: 0; width: 100%; height: 96px; overflow: visible }
.dial .needle { position: absolute; left: 50%; top: 6px; width: 3px; height: 58px; margin-left: -1.5px; border-radius: 2px; background: #fb233b }   /* the main tick is the one red thing on the page */
.px { position: fixed; left: max(48px, env(safe-area-inset-left, 0px)); bottom: calc(106px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; align-items: center; gap: 4px; font-size: 12px }
.px > span { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-right: 6px }
.px button { padding: 5px 10px; border-radius: 999px; color: var(--muted); font-weight: 500; transition: background .2s, color .2s }
.px button:hover { color: var(--ink) }
.px button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink) }
@media (hover: none), (max-width: 899px) { .px { display: none } }
body.open .px { opacity: 0; pointer-events: none }
.hint { position: fixed; right: max(48px, env(safe-area-inset-right, 0px)); bottom: calc(140px + env(safe-area-inset-bottom, 0px));   /* clear of the FM wave line above the ruler */ z-index: 15; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; gap: 14px; align-items: center }
.hint button { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--pill) }
.hint button svg { width: 14px; height: 14px; fill: var(--ink); color: var(--ink) }

@media (max-width: 899px) {
  .station { left: max(16px, env(safe-area-inset-left, 0px)); top: calc(18px + env(safe-area-inset-top, 0px)) }
  .now .fq { font-size: 22px }
  .top { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); justify-content: space-between; transform: none }
  .chips { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); padding-right: 32px }   /* runs to the right edge, in line with the menu button, and fades there: more filters this way */
  .top .count { display: none }   /* the count has no room on a phone; it held the filters short of the edge */
  .chips button { padding: 10px 11px; font-size: 12.5px; white-space: nowrap; flex: none }   /* taller, for thumbs */
  .chips button sup { display: none }
  .hint span { display: none }
  .hint { right: 16px }
  .cap h2 { font-size: 18px }
}
@media (prefers-reduced-motion: reduce) { .chips button { transition: none } }

/* ---------- Project page ---------- */
.vp { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 500; padding: 7px 11px; border-radius: 999px; opacity: 0; transform: translate(-50%, -50%) scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.2,1.3,.3,1); white-space: nowrap }
.vp.show { opacity: 1; transform: translate(-50%, -50%) scale(1) }
.detail { position: fixed; inset: 0; z-index: 18; background: var(--bg); overflow-y: auto; overscroll-behavior-y: contain; visibility: hidden; clip-path: circle(0px at var(--rx, 50%) var(--ry, 50%)); transition: clip-path .62s cubic-bezier(.65,0,.35,1), visibility 0s .62s; scrollbar-width: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.detail::-webkit-scrollbar { display: none }

.fly canvas { display: block; width: 100%; height: 100% }
@media (prefers-reduced-motion: reduce) { .detail, body.open .detail { transition: none } }
body.open .row, body.open .cap, body.open .top, body.open .dial, body.open .hint { opacity: 0; pointer-events: none; transition: opacity .2s .45s }
body.noanim .row, body.noanim .cap, body.noanim .top, body.noanim .dial, body.noanim .hint { transition: none }
.d-wrap { max-width: 1180px; margin: 0 auto; padding: 160px 32px 180px; transition: opacity .3s }
.d-wrap.swap { opacity: 0 }
.d-sec { padding: 0 0 120px }
.d-label { font: 600 11px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center }
.d-label i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink) }
.d-frame { position: relative; width: 100%; height: min(74vh, 720px); overflow: hidden; background: var(--tile) }

.d-frame.hidden { visibility: hidden }
.d-pic { position: absolute; inset: -5%; will-change: transform }
.d-pic img, .d-pic video { width: 100%; height: 100%; object-fit: cover; display: block }

/* ---------- Category static ---------- */
canvas.static { position: fixed; inset: 0 0 96px 0; width: 100%; height: calc(100% - 96px); z-index: 7; pointer-events: none; opacity: 0; image-rendering: pixelated; mix-blend-mode: multiply }
/* ---------- Opening a project that has its own page ---------- */
.pagecover { position: fixed; inset: 0; z-index: 90; background: var(--bg); pointer-events: none; clip-path: circle(0px at var(--rx, 50%) var(--ry, 50%)); transition: clip-path .42s cubic-bezier(.55,0,.45,1) }
.pagecover.on { clip-path: circle(150vmax at var(--rx, 50%) var(--ry, 50%)) }
/* ---------- See everything ---------- */
/* shuffle: a round button at the far right of the filter row; grey like "Hiring for" until used, then white */
.shuf { position: fixed; z-index: 20; right: max(48px, env(safe-area-inset-right, 0px)); top: 101px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); color: var(--muted); transition: color .18s, background .18s }
.shuf:hover { color: var(--ink) }
.shuf.on { color: var(--ink) }
.shuf svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
body.open .shuf { opacity: 0; pointer-events: none }
@media (max-width: 900px) { .shuf { top: auto; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: auto; left: calc(50% + 22px); width: 40px; height: 40px; box-shadow: 0 6px 20px rgba(0,0,0,.18) } }   /* phones: floats bottom-centre beside the view toggle, clear of the sound/theme/menu buttons */
.allbtn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--pill); font-size: 13px; font-weight: 500; color: var(--ink); transition: background .2s, color .2s }
.allbtn svg { width: 12px; height: 12px; fill: currentColor }
.allbtn:hover { background: var(--hover) }
.allbtn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink) }
.row { transition: transform .6s cubic-bezier(.65,0,.35,1), opacity .45s }
body.all .row { transform: scale(.42); opacity: 0; pointer-events: none }
body.all .cap { visibility: hidden }
body.all .dial, body.all .hint, body.all .px, body.all .count { opacity: 0; pointer-events: none; transition: opacity .3s }
.ov { position: fixed; inset: 0; z-index: 12; overflow-y: auto; padding: 196px max(48px, env(safe-area-inset-right, 0px)) 80px max(48px, env(safe-area-inset-left, 0px)); visibility: hidden; opacity: 0; transition: opacity .35s, visibility 0s .4s; scrollbar-width: none }
.ov::-webkit-scrollbar { display: none }
body.all .ov { visibility: visible; opacity: 1; transition: opacity .4s .15s, visibility 0s }
.ov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 40px; margin: 0 }   /* spans edge to edge between the station pill and the All button */
.ov-t { display: block; text-align: left; transform: scale(.86); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s }
body.all .ov-t { transform: none; opacity: 1; transition-delay: calc(var(--d) + 120ms) }
.ov-im { display: block; aspect-ratio: 4 / 5; opacity: 0 }   /* layout + hit area; the canvas draws the picture */
.ov.flat .ov-im { opacity: 1; background-image: var(--bg, none), var(--th, none); background-size: cover; background-position: center }   /* the 240px thumbnail first; the sharp picture is laid over it as the tile nears the screen */   /* fallback: the plain pictures, when the canvas can't draw them */
.ovc { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0 }
.ov-grid { position: relative; z-index: 1 }
.ov-t:hover .ov-c b { color: var(--ink) }
.ov-c { will-change: transform; display: block; margin-top: 12px; font-size: 15px; letter-spacing: -.2px; font-weight: 500; color: var(--ink); line-height: 1.35 }
/* no captions under the pictures: the title stays for screen readers only; a role match still shows its "Fits" tag on the picture */
/* the grid: a true masonry. Each piece keeps its own shape and spans as many 1px rows as it is tall (plus the gap),
   so the columns pack tight, start level and still read left to right. Pieces fly in from the centre once their picture has arrived. */
.ov-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; grid-auto-rows: 1px; row-gap: 0 !important; column-gap: 22px !important; grid-auto-flow: row dense; align-items: start }
.ov-t { grid-row-end: span var(--sp, 300); background: none; border: 0; padding: 0; border-radius: 0 }
.ov-im { aspect-ratio: var(--r, 4 / 5) !important; transition: transform .65s var(--spring), box-shadow .65s var(--spring); box-shadow: 0 12px 31px rgb(0 0 0 / 0) }
:root { --spring: linear(0, .008, .032 2%, .13 4.4%, .26 6.6%, .681 13%, .891 17.1%, .968, 1.028, 1.073, 1.103 25.2%, 1.114, 1.119, 1.12, 1.115 31.4%, 1.098 34.4%, 1.042 41.6%, 1.017 45.4%, .998 49.5%, .988 53.9%, .986 60.4%, 1.001 80.9% 100%) }
@media (hover: hover) and (pointer: fine) { .ov-t:hover .ov-im { transform: scale(1.015); box-shadow: 0 12px 31px rgb(0 0 0 / .22) } }
.ov-t:active .ov-im { transform: scale(.97) }
.ov-t:not(.ok) .ov-im { opacity: 0 }
.ov-im:has(.ov-v) { position: relative; overflow: hidden } iframe.ov-live { border: 0; background: transparent } .ov-v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; border-radius: inherit; pointer-events: none } .ov-v.on { opacity: 1 }   /* the loop fades in over the still once it plays */
.ov.fx-tilt .ov-t { perspective: 900px }
.ov-t.m-in .ov-im { animation: flyin var(--fd, 1.8s) cubic-bezier(.16, 1, .3, 1) var(--fdl, 0s) both }
@keyframes flyin { 0% { opacity: 0; transform: translate(var(--fx, 0), var(--fy, 400px)) scale(var(--fs, 1.5)) } 5% { opacity: 1 } 100% { opacity: 1; transform: none } }
@media (max-width: 899px) { .ov-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; column-gap: 12px !important } }
@media (max-width: 899px) { body.cs1 .ov-grid { grid-template-columns: 1fr !important } }   /* case studies: one column on phones */
@media (max-width: 900px) { body.cs1 .vtog { display: none !important } body.cs1 .shuf { display: none !important } }   /* and no reel view to switch to */
@media (prefers-reduced-motion: reduce) { .ov-t.m-in .ov-im { animation: none } }
.ov-t { position: relative } .ov-c { position: absolute; left: 12px; top: 12px; margin: 0; font-size: 0 !important; line-height: 0; z-index: 3; pointer-events: none } .ov-t .ov-c b, .ov-t .ov-c em { display: none }
.ov-c b { font: 600 12px var(--mono); color: var(--muted); margin-right: 4px }
.ov-t .ov-c .ov-n { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; font-size: 15px; line-height: 1.2 }   /* the title stays for screen readers; the grid itself shows only pictures */
.ov-c em { display: block; font: 10.5px var(--mono); font-style: normal; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 3px }
/* Side ruler (All view): a vertical dial for the whole grid. One tick per row, a long tick and label where each
   category starts, a fixed needle in the middle. It moves with the page; drag it or tap a label to travel. */
.ov { padding-right: max(48px, env(safe-area-inset-right, 0px)) }   /* the side ruler is off, so the grid's margins match */
.vrul { position: fixed; right: 0; top: 0; bottom: 0; width: 96px; z-index: 13; cursor: ns-resize; touch-action: none; opacity: 0; pointer-events: none; transition: opacity .3s }
body.all .vrul { opacity: 1; pointer-events: auto; transition: opacity .4s .2s }
.vrul canvas { display: block; width: 100%; height: 100% }
@media (max-width: 899px) { .ov { padding: 148px 60px 60px 16px } .vrul { width: 48px } }
@media (max-width: 899px) { .ov { padding: 148px 60px 60px 16px } .ov-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px } .ov-c { font-size: 14px } .allbtn { height: 28px; padding: 0 10px } }
@media (prefers-reduced-motion: reduce) { .row, .ov, .ov-t { transition: none } }

/* ---------- Dark mode ---------- */

  background: var(--pill, #1a1a1a); color: var(--ink); font: 500 13px var(--body, Geist), system-ui, sans-serif; cursor: pointer; opacity: 0; transform: translateX(-6px); pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1), background .2s }

  vrul.addEventListener('pointermove', e => { if (vrDrag) ov.scrollTop = vrScrollFor(vrDrag.fr - (e.clientY - vrDrag.y) / VR_ROW); });   // drag down = go back, like turning the dial

  vrul.addEventListener('pointerup', vrEnd); vrul.addEventListener('pointercancel', vrEnd);

  $('allBtn').addEventListener('click', () => ovOpen ? (tap(), closeOverview(-1)) : openOverview());
  // Designs opens straight on All: every piece in the grid. (The single-row view with its dial is retired; the code stays so it can come back.)
  ov.style.transition = 'none'; ovOpen = true; document.body.classList.add('all'); $('allBtn').setAttribute('aria-pressed', 'true');
  requestAnimationFrame(() => requestAnimationFrame(() => { ov.style.transition = ''; }));   // no fade on arrival: the grid is there as the page paints
  addEventListener('pageshow', e => { if (e.persisted) setTimeout(markHere, 0); });   // back from another page: this place keeps its own name
  const H0 = readHash();

  { const pi = H0.p;
    // a piece opened straight from another page (a link on a case study) goes back to that page; one we opened ourselves goes back a step
    if (pi >= 0 && !(history.state || {}).km) { const look = () => { const p = window.KM && KM.trail && KM.trail.prev(); cameFrom = p ? KM.trail.back('designs.html', 'All designs') : null; if (cameFrom && /designs\.html/.test(cameFrom.href)) cameFrom = null; dbackLabel(); };
      document.addEventListener('km-trail', look, { once: true }); setTimeout(look, 450); }
    if (pi >= 0) setTimeout(() => { const t = ov.querySelector(`.ov-t[data-i="${pi}"]`); if (!t) return; if (t.hidden) { leaveRole(); }
      t.scrollIntoView({ block: 'center' }); setTimeout(() => openDetail(pi, undefined, undefined, t.querySelector('.ov-im').getBoundingClientRect(), true), 120); }, 700); }
  // a tile in the All view opens the piece in the small view, or the page the CMS points it to

  ov.addEventListener('keydown', e => {

    const j = e.key === 'ArrowRight' ? k + 1 : e.key === 'ArrowLeft' ? k - 1 : e.key === 'ArrowDown' ? k + cols : k - cols;
    e.preventDefault(); if (j < 0 || j >= vis.length) return;
    tap(); vis[j].focus({ preventScroll: true }); vis[j].scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
  });
  addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' || e.metaKey || e.ctrlKey || e.altKey || openIdx >= 0 || (document.activeElement && document.activeElement !== document.body)) return;

  });
  ov.addEventListener('click', e => {
    const t = e.target.closest('.ov-t'); if (!t) return;
    const i = +t.dataset.i;
    const dest = items[i].link || (items[i].cs && items[i].page);   // a case study goes straight to it; "link" points a piece anywhere

    if (dest && window.Tuner) { tap();
      try { sessionStorage.setItem('km-return', items[i].t); } catch (_) {}

      if (window.KM && KM.keep && !reduce) { const r = t.querySelector('.ov-im').getBoundingClientRect(), u = mdOf(still(items[i]));
        const k = document.createElement('div'); k.className = 'km-keep'; k.innerHTML = `<img alt="" src="${u}">`;
        Object.assign(k.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '0px' }); document.body.appendChild(k);
        k.animate([{ transform: 'none' }, { transform: 'scale(1.03)' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
        KM.keep(u, r); }
      Tuner.go({ from: 100, to: +(100 + (i + 1) / 10).toFixed(1), name: items[i].t, href: dest });
      return;
    }
    const r = (t.querySelector('.ov-im') || t).getBoundingClientRect(), cx = e.clientX, cy = e.clientY;
    openDetail(i, cx, cy, r);   // straight from the tile into the small view
  });
  if ($('fxsw')) $('fxsw').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.fx === 'test') { stationJump(items[active].cat); return; }
    FX = b.dataset.fx;
    $('fxsw').querySelectorAll('[data-fx="split"],[data-fx="scan"]').forEach(x => x.setAttribute('aria-pressed', x === b));
    field.style.filter = ''; splitOn = false; sweep.style.opacity = '0';
    stationJump(items[active].cat);
  });
  if ($('edgesw')) $('edgesw').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    EDGE = b.dataset.e;
    $('edgesw').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });

  // =================================================================================================
  // Radio physics preview. Each effect can be switched on and off in the panel (bottom left).
  // =================================================================================================
  // chosen: 1 FM wave, 4 Doppler, 5 Signal falloff, 7 Standing wave, 8 Broadcast ring, 9 Noise floor, 10 Spectrum
  const PHY = { fm: 1, resonance: 0, interference: 0, doppler: 1, falloff: 1, diffraction: 0, standing: 1, broadcast: 1, noise: 1, spectrum: 1 };
  const PHY_NAMES = { fm: 'FM wave', resonance: 'Resonance', interference: 'Interference', doppler: 'Doppler', falloff: 'Signal falloff',
    diffraction: 'Diffraction', standing: 'Standing wave', broadcast: 'Broadcast ring', noise: 'Noise floor', spectrum: 'Spectrum' };
  const speedAmt = () => Math.min(1, Math.abs(vel) * 30);
  // grain tile shared by falloff and noise floor
  const grain = document.createElement('canvas'); grain.width = grain.height = 160;
  const gx = grain.getContext('2d');
  function regrain() {
    const im = gx.createImageData(160, 160), d = im.data;
    for (let k = 0; k < d.length; k += 4) { const v = Math.random() * 255 | 0; d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255; }
    gx.putImageData(im, 0, 0);
  }
  regrain();
  let grainPat = null;

  // 2 Resonance + 5 Signal falloff: pieces fill in on a sharp peak as they near the needle
  function cardFilter(i) {
    if (reduce) return 'none';
    const d = Math.min(3, Math.abs(i - p));
    let f = '';
    if (PHY.resonance) {
      const q = 1 / (1 + (d * 2.2) ** 2);                // resonance curve: sharp peak at the needle
      f += `saturate(${(.35 + .65 * q).toFixed(3)}) `;
    }
    if (PHY.falloff) f += `contrast(${(1 - .22 * Math.min(1, d / 2)).toFixed(3)}) brightness(${(1 - .12 * Math.min(1, d / 2)).toFixed(3)}) `;
    return f || 'none';
  }
  // 6 Diffraction: near the screen edge the picture spreads past its frame as a soft glow
  function diffract(i, L, T, w, h, src, sx, sy, scw, sch) {
    if (!PHY.diffraction || reduce) return;
    const e = Math.max(0, Math.max(W * .14 - L, (L + w) - W * .86)) / (W * .14);
    if (e <= 0) return;
    const k = Math.min(1, e);
    fx.save(); fx.filter = `blur(${(10 + 16 * k).toFixed(1)}px)`; fx.globalAlpha = .55 * k;
    const g = 18 * k;
    fx.drawImage(src, sx, sy, scw, sch, L - g, T - g, w + g * 2, h + g * 2);
    fx.restore();
  }
  // 4 Doppler + 5 falloff grain, drawn over each piece
  function cardFX(i, L, T, w, h) {
    if (reduce) return;
    const rel = i - p;
    if (PHY.doppler && Math.abs(vel) > .0005 && Math.abs(rel) > .05) {
      const toward = rel * vel > 0;                     // moving toward the needle?
      const a = Math.min(.32, Math.abs(vel) * 9) * Math.min(1, Math.abs(rel));
      fx.save(); fx.globalCompositeOperation = 'soft-light'; fx.globalAlpha = a;
      fx.fillStyle = toward ? '#3d7bff' : '#ff6a2b'; fx.fillRect(L, T, w, h); fx.restore();
    }
    if (PHY.falloff) {
      const d = Math.min(2, Math.abs(rel));
      if (d > .15) {
        if (!grainPat) grainPat = fx.createPattern(grain, 'repeat');
        fx.save(); fx.globalCompositeOperation = 'overlay'; fx.globalAlpha = .14 * d; fx.fillStyle = grainPat; fx.fillRect(L, T, w, h); fx.restore();
      }
    }
  }
  // 3 Interference: two sets of fine lines with slightly different spacing; their beat makes moving moiré bands
  function rowFX() {
    if (!PHY.interference || reduce) return;
    const a = speedAmt(); if (a < .02) return;
    const [w0, h0] = sizes[Math.round(p)] || [400, 500], top = cy - h0 / 2, hh = h0;
    fx.save(); fx.globalAlpha = .22 * a; fx.strokeStyle = THEME.ink; fx.lineWidth = 1;
    const ph = p * 60;
    fx.beginPath();
    for (let x = -(ph % 6); x < W; x += 6) { fx.moveTo(x, top); fx.lineTo(x, top + hh); }
    for (let x = -((ph * 1.08) % 6.4); x < W; x += 6.4) { fx.moveTo(x, top); fx.lineTo(x, top + hh); }
    fx.stroke(); fx.restore();
  }
  // 7 Standing wave (ruler rings on settle) + 10 Spectrum (peaks at categories while moving)
  function tickFX(L, v, x) {
    if (reduce) return L;
    if (PHY.standing) {
      const t = performance.now() - settleAt;
      if (t < 1100) L += 9 * Math.sin((v - p) * Math.PI * 1.25) * Math.cos(t / 38) * Math.exp(-t / 320);
    }
    if (PHY.spectrum) {
      const a = speedAmt();
      if (a > .02) {
        let pk = 0;
        for (const ci of firstOf) pk = Math.max(pk, Math.exp(-((v - ci) ** 2) / .06));
        L += a * (34 * pk + 6 * Math.random() * Math.exp(-((v - p) ** 2) / 4));
      }
    }
    return Math.max(4, L);
  }
  // 1 FM wave above the ruler + 9 noise floor over the row
  const fm = document.createElement('canvas'); fm.className = 'fmwave'; fm.setAttribute('aria-hidden', 'true'); document.body.appendChild(fm);
  const fmx = fm.getContext('2d');
  const nf = document.createElement('canvas'); nf.className = 'noisefloor'; nf.setAttribute('aria-hidden', 'true'); nf.width = 480; nf.height = 300; document.body.appendChild(nf);
  const nfx = nf.getContext('2d');
  let fmPhase = 0, fmFreq = 0;
  function overlaysFX() {
    // FM wave
    const dpr = Math.min(2, devicePixelRatio || 1), fw = innerWidth, fh = 30;
    if (fm.width !== Math.round(fw * dpr)) { fm.width = Math.round(fw * dpr); fm.height = Math.round(fh * dpr); }
    fmx.setTransform(dpr, 0, 0, dpr, 0, 0); fmx.clearRect(0, 0, fw, fh);
    if (PHY.fm && !reduce && openIdx < 0) {
      const a = speedAmt();
      fmFreq += ((.018 + a * .11) - fmFreq) * .08;     // carrier speeds up with scroll speed (frequency modulation)
      fmPhase += .05 + a * .5;
      fmx.beginPath();
      for (let x = 0; x <= fw; x += 2) {
        const env = Math.exp(-(((x - fw / 2) / (fw * .33)) ** 2));
        const y = fh / 2 + Math.sin(x * fmFreq - fmPhase) * (2 + 7 * a) * env;
        x ? fmx.lineTo(x, y) : fmx.moveTo(x, y);
      }
      fmx.strokeStyle = THEME.ink; fmx.globalAlpha = .25 + .45 * a; fmx.lineWidth = 1.2; fmx.stroke(); fmx.globalAlpha = 1;
    }
    // noise floor: faint grain while between pieces
    const between = Math.abs(p - Math.round(p)) * 2;
    if (PHY.noise && !reduce && openIdx < 0 && between > .02) {
      const im = nfx.createImageData(nf.width, nf.height), d = im.data;
      for (let k = 0; k < d.length; k += 4) { const v = Math.random() * 255 | 0; d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255; }
      nfx.putImageData(im, 0, 0);
      nf.style.opacity = (.1 * Math.min(1, between * 1.5)).toFixed(3);
    } else nf.style.opacity = '0';
    if (PHY.falloff && Math.random() < .2) { regrain(); grainPat = null; }
  }
  // 8 Broadcast: opening a project sends rings out from the tap across the page
  function broadcast(x, y) {
    return;   // off: opening a piece ripples the picture itself, without rings across the page
    for (let k = 0; k < 3; k++) {
      const r = document.createElement('i'); r.className = 'bcast';
      r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.animationDelay = (k * 140) + 'ms';
      document.body.appendChild(r); setTimeout(() => r.remove(), 1400 + k * 140);
    }
  }
  // panel
  const ph = document.createElement('div'); ph.className = 'phys'; ph.setAttribute('role', 'group'); ph.setAttribute('aria-label', 'Radio physics (preview)');
  ph.innerHTML = '<span>Radio physics</span>' + Object.keys(PHY).map((k, n) => `<button type="button" data-k="${k}" aria-pressed="true">${n + 1} ${PHY_NAMES[k]}</button>`).join('') +
    '<button type="button" class="all" data-all="1">All off</button>';
  // (preview panel not shown on the site)
  ph.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.all) {
      const on = b.textContent === 'All on';

  });
  addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('leaving'); $('fq').textContent = '100.0'; $('nm').textContent = 'Designs'; leaving = false; } });
  addEventListener('resize', measure);
  measure(); requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(drawStrip);
})();
