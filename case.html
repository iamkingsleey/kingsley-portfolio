<style>
/* Product design (UI/UX), simple versions. One feature, a few large screens on calm panels, short text,
   credits. Shared by every version: the opening screen is the working prototype (drag the dial), and the
   section dial at the bottom is clickable. Versions (switch at the top, a CMS setting on the site):
   Panels · Colour · Tune (pinned, screens crossfade as the needle sweeps) · Story (sticky text, scrolling
   screens) · Camera (one screen, the view zooms to each detail) · Devices (one screen reshapes phone → tablet → web). */
@property --z { syntax: "<number>"; inherits: true; initial-value: 1 }
:root {
  --bg: #ffffff; --ink: #000000; --text: #3b3b3b; --muted: #8c8c8c; --faint: #c8c8c8; --pill: #f2f2f2; --panel: #f4f4f4; --on-ink: #ffffff;
  --line: #e4e4e4; --edge: rgb(0 0 0 / .08); --red: #ff4a1c;
  --a1: #2b3bff; --a2: #c6f432; --a3: #f4efe6; --a4: #0e0e10;            /* the sample app's colours */
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gut: max(48px, env(safe-area-inset-left, 0px));
  --ease: cubic-bezier(.2,.8,.2,1); --sweep: cubic-bezier(.7,0,.25,1);
  --pop: cubic-bezier(.34,1.56,.64,1);
  --pop: linear(0, .42 7%, .88 14%, 1.06 20%, 1.09 25%, 1.05 32%, .99 44%, .99 56%, 1.003 70%, 1);
  color-scheme: light;
}
html[data-theme="dark"] { --bg: #0b0b0b; --ink: #ffffff; --text: #c9c9c9; --muted: #7a7a7a; --faint: #3a3a3a; --pill: #1c1c1c; --panel: #121212; --on-ink: #000000;
  --line: #242424; --edge: rgb(255 255 255 / .1); color-scheme: dark }
* { box-sizing: border-box }
html { background: var(--bg) }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden }
img, video { display: block; max-width: 100% }
button, a { font: inherit; color: inherit }
button { background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
figure { margin: 0 }
.mono { font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.wrap { padding: 0 var(--gut) }

/* station readout + preview theme switch */
.station { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); left: var(--gut); z-index: 40; display: flex; align-items: center; gap: 18px; mix-blend-mode: difference; color: #fff }
.station .back { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; background: rgb(255 255 255 / .1); font-size: 13px }
.station .back b { font: 400 12px var(--mono); opacity: .6 }
.station .fq { font-size: 28px; letter-spacing: -.5px }
.station .nm { font-size: 13px; font-weight: 500 }
.theme { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 40; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--pill); color: var(--ink); font-size: 12px; font-weight: 500 }

/* ---------- the phone (device frames keep their rounded corners; pictures elsewhere stay sharp) ---------- */
.ph { position: relative; width: var(--w, 240px); aspect-ratio: 9 / 19.5; border-radius: calc(var(--w, 240px) * .16); background: #050505; padding: calc(var(--w, 240px) * .035);
  box-shadow: 0 0 0 1px rgb(255 255 255 / .08), 0 30px 60px -20px rgb(0 0 0 / .55); flex: none }
html:not([data-theme="dark"]) .ph { box-shadow: 0 0 0 1px rgb(0 0 0 / .1), 0 30px 60px -24px rgb(0 0 0 / .35) }
.scr { position: relative; width: 100%; height: 100%; border-radius: calc(var(--w, 240px) * .13); overflow: hidden; background: var(--a4); color: #fff; font-family: var(--body); font-size: calc(var(--w, 240px) * .05) }
.scr::before { content: ""; position: absolute; top: 2.2%; left: 50%; width: 30%; height: 3.2%; margin-left: -15%; border-radius: 99px; background: #000; z-index: 5 }   /* camera island */
.scr video, .scr > img { width: 100%; height: 100%; object-fit: cover }
.s-pad { position: absolute; inset: 9% 7% 5%; display: flex; flex-direction: column; gap: 4% }
.s-t { font-weight: 600; font-size: 1.6em; letter-spacing: -.04em; line-height: 1 }
.s-sm { font: 500 .62em var(--mono); letter-spacing: .05em; text-transform: uppercase; opacity: .6 }
.s-card { border-radius: .9em; padding: 7%; background: rgb(255 255 255 / .06) }
.s-row { display: flex; align-items: center; gap: 6%; padding: 4% 0; border-bottom: 1px solid rgb(255 255 255 / .08) }
.s-av { width: 2.3em; height: 2.3em; border-radius: .5em; flex: none }
.s-btn { margin-top: auto; border-radius: 99px; padding: 5% 0; text-align: center; font-weight: 600; background: var(--a2); color: var(--a4) }
.s-tabs { position: absolute; left: 7%; right: 7%; bottom: 3.5%; display: flex; justify-content: space-between; padding: 4% 6%; border-radius: 99px; background: rgb(255 255 255 / .08) }
.s-tabs i { width: 1.1em; height: 1.1em; border-radius: 4px; background: rgb(255 255 255 / .35) } .s-tabs i.on { background: var(--a2) }
.s-dial { position: relative; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1b1b20 0 58%, transparent 59%), conic-gradient(from 200deg, var(--a1), var(--a2), var(--a1)); }
.s-dial::after { content: ""; position: absolute; left: 50%; top: 8%; width: 3%; height: 22%; margin-left: -1.5%; background: var(--red); border-radius: 2px }
.s-ruler { height: 2.4em; background: repeating-linear-gradient(90deg, rgb(255 255 255 / .55) 0 1px, transparent 1px 7%); mask: linear-gradient(90deg, transparent, #000 25% 75%, transparent); position: relative }
.s-ruler::after { content: ""; position: absolute; left: 50%; top: -20%; bottom: -20%; width: 2px; background: var(--red) }
.s-bars { display: flex; align-items: flex-end; gap: 4%; height: 3em } .s-bars i { flex: 1; border-radius: 2px; background: var(--a2) }

/* ---------- web and tablet devices (Mobile + Web / Web + Tablet versions) ---------- */
.ph.br, .ph.tb { aspect-ratio: auto; width: var(--w); height: auto }
.ph.br { padding: 0; border-radius: 10px; background: #1a1a1d }
.ph.br .bar { position: relative; height: calc(var(--w) * .042); display: flex; align-items: center; gap: calc(var(--w) * .008); padding: 0 2.2% }
.ph.br .bar i { width: calc(var(--w) * .012); aspect-ratio: 1; border-radius: 50%; background: rgb(255 255 255 / .18) }
.ph.br .bar span { position: absolute; left: 33%; width: 34%; height: 62%; border-radius: 99px; background: rgb(255 255 255 / .06); font: 500 calc(var(--w) * .014) var(--mono); color: rgb(255 255 255 / .45); display: grid; place-items: center }
.ph.br .scr { height: auto; aspect-ratio: 16 / 10; border-radius: 0 0 9px 9px; font-size: calc(var(--w) * .019) }
.ph.tb { padding: calc(var(--w) * .024); border-radius: calc(var(--w) * .045) }
.ph.tb .scr { height: auto; aspect-ratio: 4 / 3; border-radius: calc(var(--w) * .022); font-size: calc(var(--w) * .023) }
.ph.br .scr::before, .ph.tb .scr::before { display: none }
.wv { position: absolute; inset: 0; display: grid; grid-template-columns: 17% 1fr; background: var(--a4); color: #fff }
.wside { padding: 18% 14%; display: flex; flex-direction: column; gap: 1.1em; background: rgb(255 255 255 / .03); border-right: 1px solid rgb(255 255 255 / .06) }
.wside b { font-weight: 700; letter-spacing: -.04em; font-size: 1.3em; margin-bottom: .8em }
.wside span { opacity: .5; font-size: .85em } .wside span.on { opacity: 1; color: var(--a2) }
.wmain { position: relative; padding: 4.5% 5.5%; display: flex; flex-direction: column; gap: .9em; min-width: 0; overflow: hidden }
.wgrid { display: grid; gap: .9em }
.wcard { border-radius: .6em; aspect-ratio: 1 }
.wv.land { grid-template-columns: 1.1fr .9fr; align-items: center; padding: 0 8%; gap: 6%; background: linear-gradient(120deg, #2B3BFF, #0e0e10 65%) }
.wv.land > div:first-child { display: flex; flex-direction: column; gap: .9em }
.wv.white { display: grid; place-items: center; grid-template-columns: 1fr; background: #fff }
.wv.white video { width: 100% !important; height: 100% !important; object-fit: contain !important }
.pv { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 40; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--pill) }
.pv button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background .3s, color .3s }
.pv button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.pv #theme { color: var(--ink) }
/* flow as a zigzag when the screens are wide */
.flow.zz { grid-template-columns: 1fr 1fr; gap: 90px clamp(60px, 9vw, 160px); max-width: none }
.flow.zz .node { margin-top: 0 !important }
.flow.zz .node:nth-child(even) { translate: 0 160px }
.ph.br .live, .ph.tb .live { padding: 5% 6%; gap: .5em } .ph.br .live .ld, .ph.tb .live .ld { width: 30%; margin-top: 1% } .ph.br .live .lf { font-size: 2.6em }


:root { --panel: #f3f3f3; --max: 1320px }
html[data-theme="dark"] { --panel: #141414 }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut) }

/* ---------- opening: the horizontal run (as on the logo page) ----------
   Frame 1: the title panel with the next column peeking in. Frame 2: the row slides to columns 1–2.
   Frame 3: on to columns 3–4. Frame 4: the split lines inside the columns slide. Then the page goes vertical. */
.run { position: relative }
.run .rpin { position: sticky; top: 0; height: 100vh; overflow: hidden }
.track { position: absolute; top: 0; left: 0; bottom: 0; display: flex; will-change: transform }
.intro { flex: none; position: relative; height: 100%; padding: 0 var(--gut) 40px }
.intro .cat { position: absolute; left: var(--gut); top: 50%; transform: translateY(-50%) }
.intro .go { position: absolute; right: 48px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 12px }
.intro .go svg { width: 34px; height: 10px; overflow: visible }
.intro .go svg path { stroke: var(--ink); fill: none; stroke-width: 1.2 }
.intro .go .arr { animation: nudge 1.6s var(--ease) infinite }
@keyframes nudge { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(6px) } }
.intro .tt { position: absolute; left: var(--gut); right: 40%; bottom: 56px }
.intro h1 { margin: 0 0 16px; font-size: clamp(48px, 6.4vw, 104px); line-height: .92; letter-spacing: -.055em; max-width: 12ch }
.intro p { margin: 0; max-width: 44ch; font-size: 16px; line-height: 1.55 }
.col { flex: none; position: relative; height: 100% }
.slot { position: absolute; inset: 0; overflow: hidden; background: var(--panel); will-change: clip-path; margin: 0 }
.slot > video, .slot > .gfx { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform }
.slot > video { background: #fff }
.slot .gfx { display: grid; place-items: center; left: -60px; right: -60px; width: auto }   /* wider than the slot, so the sideways pan never shows an edge */
.slot .lab { position: absolute; top: 0; margin-top: -30px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; color: #fff; mix-blend-mode: difference; pointer-events: none; will-change: transform }
.split-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; margin-top: -1.5px; background: var(--red); z-index: 4; pointer-events: none; opacity: 0; will-change: transform }
.split-tag { position: absolute; top: -11px; right: 12px; z-index: 5; padding: 4px 8px; background: var(--red); color: #fff; font: 500 10px var(--mono); letter-spacing: .5px; opacity: 0; pointer-events: none; will-change: transform }

/* panels: sharp, quiet, the screen floats in the middle */
.pn { position: relative; background: var(--panel); overflow: hidden; display: grid; place-items: center; aspect-ratio: 16 / 9.4; transition: background .6s var(--ease) }
.pn.tall { aspect-ratio: 4 / 5 }
.pn > .in { will-change: transform; transition: translate 1.4s var(--pop), opacity .9s var(--ease); translate: 0 90px; opacity: 0 }
.pn.on > .in { translate: 0 0; opacity: 1 }
.ph.br { box-shadow: 0 0 0 1px var(--edge), 0 40px 80px -40px rgb(0 0 0 / .45) }
[data-video] { background: #fff }   /* the clip is recorded on white, so its panel is white in both themes */
video.raw { width: 100%; height: 100%; object-fit: contain; display: block }
.cap { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0 0 }
.cap span:last-child { color: var(--faint) }
.cap b { color: var(--ink); font-weight: 500 }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
.blk { margin-top: 16px }
/* colour version: panels take the app's own colours */
html.colour .pn[data-c="1"] { background: var(--a1) } html.colour .pn[data-c="2"] { background: var(--a2) }
html.colour .pn[data-c="3"] { background: var(--a3) } html.colour .pn[data-c="4"] { background: #1d1d22 }

/* the working dial (opening screen) */
.live { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 5% 6%; gap: .5em }
.live .lf { font: 600 2.8em/1 var(--body); letter-spacing: -.05em; font-variant-numeric: tabular-nums }
.live .ln { opacity: .7; min-height: 1.3em }
.live .ld { position: relative; width: 31%; aspect-ratio: 1; margin-top: 1%; border-radius: 50%; touch-action: none; cursor: grab;
  background: radial-gradient(circle, #1b1b20 0 56%, transparent 57%), conic-gradient(from 0deg, var(--a1), var(--a2), #ff4a1c, var(--a1)) }
.live .ld:active { cursor: grabbing }
.live .ld i { position: absolute; left: 50%; top: 50%; width: 3px; height: 46%; margin-left: -1.5px; background: #fff; border-radius: 2px; transform-origin: 50% 0; rotate: var(--a, 180deg) }
.live .ld::after { content: ""; position: absolute; left: 50%; top: 2%; width: 4px; height: 14%; margin-left: -2px; background: var(--red); border-radius: 2px }
.live .lh { margin-top: auto; font: 500 .62em var(--mono); letter-spacing: .05em; text-transform: uppercase; opacity: .55 }
.ld.hint { animation: hint 2.4s var(--ease) 1.2s 2 }
@keyframes hint { 0%, 100% { rotate: 0deg } 30% { rotate: 24deg } 60% { rotate: -8deg } }

/* text */
.top { padding-top: 96px }
h1 { margin: 64px 0 0; color: var(--ink); font-weight: 500; font-size: clamp(36px, 5.2vw, 72px); line-height: 1; letter-spacing: -.045em; max-width: 13ch }
h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .06em }
h1 .w > span { display: inline-block; translate: 0 105%; transition: translate 1.1s var(--pop); transition-delay: calc(var(--i) * 60ms + .15s) }
h1 .w.in > span { translate: 0 0 }
.sub { margin: 22px 0 0; font-size: 18px; line-height: 1.45; max-width: 46ch }
.meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin: 40px 0 0; padding-top: 18px; border-top: 1px solid var(--line) }
.meta b { display: block; margin-top: 8px; color: var(--ink); font-weight: 500; font-size: 14px }
.meta .ic { display: flex; gap: 8px; margin-top: 8px } .meta .ic img { width: 22px; height: 22px }
.txt { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; padding: 120px 0 }
.txt h2 { margin: 0; color: var(--ink); font-size: 15px; font-weight: 500 }
.txt .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px }
.txt p { margin: 0; font-size: 16px; line-height: 1.6 }
.txt h3 { margin: 0 0 10px; color: var(--ink); font-size: 15px; font-weight: 500 }
.rv { opacity: 0; translate: 0 26px; transition: opacity .8s var(--ease), translate 1.1s var(--pop) } .rv.in { opacity: 1; translate: 0 0 }

/* pinned versions share this: a sticky stage the height of the screen, a caption under the panel */
.pin { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 84px 0 76px }
.pin .pn { aspect-ratio: auto; flex: 1; min-height: 0 }
.pcap { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; align-items: start; padding-top: 16px; min-height: 92px }
.pcap .mono b { color: var(--ink); font-weight: 500 }
.pcap h3 { margin: 0; color: var(--ink); font-size: 18px; font-weight: 500; letter-spacing: -.01em }
.pcap p { margin: 6px 0 0; font-size: 15px; line-height: 1.5; max-width: 52ch }
.pcap .sw { transition: opacity .35s var(--ease), translate .6s var(--pop) } .pcap .sw.out { opacity: 0; translate: 0 8px }

/* Tune: layers crossfade, a ruler with the red needle under the panel */
.lay { position: absolute; inset: 0; display: grid; place-items: center; will-change: opacity, transform }
.truler { height: 46px; margin-top: 12px } .truler canvas { width: 100%; height: 100%; display: block }

/* Story: sticky text with a needle on the left, panels scroll on the right */
.sty { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 48px; padding: 40px 0 }
.sst { position: sticky; top: 140px; padding-left: 22px }
.sst::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line) }
.sneedle { position: absolute; left: -1px; top: 0; width: 3px; height: 40px; background: var(--red); transition: translate .9s var(--pop), height .9s var(--pop) }
.si { padding: 0 0 34px; opacity: .28; transition: opacity .5s var(--ease); cursor: pointer }
.si.on { opacity: 1 }
.si h3 { margin: 8px 0 8px; color: var(--ink); font-size: 22px; font-weight: 500; letter-spacing: -.02em }
.si p { margin: 0; font-size: 15px; line-height: 1.55; max-width: 38ch }
.sr { display: flex; flex-direction: column; gap: 16px }
.sr .pn { aspect-ratio: 8 / 7 }

/* Camera: one screen, the view moves */
.cam .pn .cw { will-change: transform; transform-origin: 50% 50% }
.dots { display: flex; gap: 6px; margin-top: 10px }
.dots i { width: 22px; height: 3px; background: var(--line); transition: background .4s } .dots i.on { background: var(--red) }

/* Devices: one frame reshapes */
.mf { position: relative; background: #050505; box-shadow: 0 0 0 1px var(--edge), 0 40px 80px -40px rgb(0 0 0 / .45); overflow: hidden }
.mf .mbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #1a1a1d; overflow: hidden }
.mf .mbar i { width: 8px; height: 8px; border-radius: 50%; background: rgb(255 255 255 / .18); flex: none }
.mf .mscr { position: absolute; overflow: hidden; background: var(--a4) }
.mf .ml { position: absolute; inset: 0 }
.mf .ml.p { display: grid; place-items: center } .mf .ml.p .scr { position: relative; width: var(--w); height: calc(var(--w) * 2.04); flex: none; border-radius: 0 }
.mf .ml.p .scr::before { display: none }
.mf .ml.w .scr { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; font-size: calc(var(--w) * .019) }
.mf .ml.w .scr::before { display: none }
.dlab { display: flex; gap: 22px; margin-top: 10px } .dlab span { transition: color .4s } .dlab span.on { color: var(--ink) }

/* credits + next */
.cred { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; padding: 120px 0 80px; border-bottom: 1px solid var(--line) }
.cred h2 { margin: 0; color: var(--ink); font-size: 15px; font-weight: 500 }
.cred dl { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 32px }
.cred dt { font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.cred dd { margin: 8px 0 0; color: var(--ink); font-size: 15px; line-height: 1.5 }
.next { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 64px 0 160px; text-decoration: none }
.next .fq { font: 500 12px var(--mono); color: var(--muted) }
.next b { display: block; margin-top: 10px; color: var(--ink); font-weight: 500; font-size: clamp(28px, 4vw, 52px); letter-spacing: -.04em; line-height: 1 }
.next i { font-style: normal; display: inline-block; transition: translate .6s var(--pop) } .next:hover i { translate: 10px 0 }

/* version switch + theme, section dial (click a label to tune there) */
.pv { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 40; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--pill); max-width: calc(100vw - 2 * var(--gut)); overflow-x: auto; scrollbar-width: none }
.pv::-webkit-scrollbar { display: none }
.pv button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background .3s, color .3s }
.pv button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.pv #theme { color: var(--ink) }
/* the section dial runs down the right edge (like the ruler on Designs' All view); content keeps clear of it */
.sdial { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 30; transition: background-color .4s } .sdial::before { content: ""; position: absolute; inset: -28px 0 0; background: linear-gradient(to top, var(--bg) 62%, transparent); opacity: 0; transition: opacity .4s; pointer-events: none } .sdial.bgd::before { opacity: 1 }
.sdial canvas { position: relative; width: 100%; height: 100%; cursor: pointer }



@media (max-width: 899px) {
  :root { --gut: 18px }
