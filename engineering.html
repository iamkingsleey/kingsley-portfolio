<title>Engineering · Kingsley M.</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jockey+One&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap">
<style>
/* About page: the signal tunes in to a face (lines across the whole screen), one statement, the career as a
   band you tune through, skills as a mixing desk, on air from Lagos and calling in to the station. Geist throughout; Jockey One only for the name. */
:root {
  --bg: #ffffff; --ink: #000000; --text: #3b3b3b; --muted: #8c8c8c; --faint: #c8c8c8; --pill: #f2f2f2; --panel: #f3f3f3;
  --line: #e4e4e4; --edge: rgb(0 0 0 / .08); --red: #ff4a1c;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display: "Jockey One", "Arial Narrow", Impact, sans-serif;
  --gut: max(48px, env(safe-area-inset-left, 0px)); --max: 1320px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --pop: linear(0, .42 7%, .88 14%, 1.06 20%, 1.09 25%, 1.05 32%, .99 44%, .99 56%, 1.003 70%, 1);
  color-scheme: light;
}
html[data-theme="dark"] { --bg: #0b0b0b; --ink: #ffffff; --text: #c9c9c9; --muted: #7a7a7a; --faint: #3a3a3a; --pill: #1c1c1c; --panel: #141414;
  --line: #242424; --edge: rgb(255 255 255 / .1); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden }
img { display: block; max-width: 100% }
button, a, input, textarea { font: inherit; color: inherit }
button { background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
.mono { font: 600 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 max(var(--gut), 128px) 0 var(--gut) }
.todo { font-style: italic; color: var(--muted) }

/* chrome */
.station { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); left: var(--gut); z-index: 40; display: flex; align-items: center; gap: 18px; mix-blend-mode: difference; color: #fff }
.station .back { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; background: rgb(255 255 255 / .1); font-size: 13px }
.station .back b { font: 400 12px var(--mono); opacity: .6 }
.station .fq { font-size: 28px; letter-spacing: -.5px }
.station .nm { font-size: 13px; font-weight: 500 }
.theme { position: fixed; top: max(28px, env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 40; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--pill); color: var(--ink); font-size: 12px; font-weight: 500 }
.sdial { position: fixed; right: 0; top: 0; bottom: 0; width: 112px; z-index: 30 }
.sdial canvas { width: 100%; height: 100%; display: block; cursor: pointer }

/* one spacing step between every section */
:root { --sp: 180px } @media (max-width: 899px) { :root { --sp: 112px } }
.shead { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: var(--sp) 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 24px }
.shead h2 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 500; letter-spacing: -.02em }
.shead p { margin: 6px 0 0; font-size: 15px; max-width: 48ch }
.rv { opacity: 0; translate: 0 26px; transition: opacity .8s var(--ease), translate 1.1s var(--pop) } .rv.in { opacity: 1; translate: 0 0 }

/* ---------- 1 · hero: one field of signal lines across the screen; the face resolves as it tunes in ---------- */
.sig { position: relative; height: 100vh; height: 100svh; touch-action: pan-y; background: #0b0b0b; color-scheme: dark }   /* plain black, the same black as the site in dark mode */
.sread { position: absolute; left: 50%; top: 34px; translate: -50% 0; color: #fff; font-size: 11px; display: flex; gap: 10px; align-items: center }
.sread #sst { color: rgb(255 255 255 / .5) }
/* one small centred column, with the same breathing room as Home */
/* the picture and name line up with the text column below (the statement's second column) */
.hc { position: absolute; left: 0; right: 0; top: 50%; translate: 0 -50%; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: 24px }
.hcol { grid-column: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 22px }
.hm { position: relative; width: 220px; aspect-ratio: 4 / 5; overflow: hidden; background: #141414 }
.sname { margin: 0; font: 400 50px/1.05 var(--display); color: #fff; letter-spacing: -1px; opacity: 0; translate: 0 12px; transition: opacity .8s var(--ease) .2s, translate 1.1s var(--pop) .2s }
.sline { margin-top: 8px; font-size: 14px; line-height: 1.5; color: rgb(255 255 255 / .62); opacity: 0; transition: opacity .8s var(--ease) .45s }
.sig.locked .sname { opacity: 1; translate: 0 0 } .sig.locked .sline { opacity: 1 }
.hp { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; filter: grayscale(1) brightness(.88); transform: scale(var(--hs, 1.04)); transition: transform 1.6s var(--ease) }
/* slit: the portrait sits in the dark; a lit window with the red needle follows the cursor across it, like the window on a radio dial */
.hp.dim { filter: grayscale(1) brightness(.07) }
.hp.lit { filter: grayscale(1) brightness(.92); clip-path: inset(0 calc(100% - var(--sx, 50%) - var(--sw, 12%)) 0 calc(var(--sx, 50%) - var(--sw, 12%))) }
.sl-edge { position: absolute; top: 0; bottom: 0; left: var(--sx, 50%); width: 2px; margin-left: -1px; background: var(--red) }
.sl-rul { display: block; width: 220px; height: 30px; margin-top: -14px }

/* ---------- 2 · statement ---------- */
.stmt { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: 24px; padding: var(--sp) 0 0 }
main > .stmt:first-child { padding-top: calc(var(--sp) + 60px) }   /* first thing on the page: clear of the readout */
.stmt p { margin: 0; color: var(--ink); font-size: clamp(28px, 3.4vw, 50px); line-height: 1.12; letter-spacing: -.035em; font-weight: 500 }
.stmt p span { opacity: .2; filter: blur(1.4px); transition: opacity .6s var(--ease), filter .6s var(--ease) } .stmt p span.on { opacity: 1; filter: none } .stmt p span.rd { opacity: .5; filter: blur(2.6px) }   /* read and upcoming lines go soft, so only the band reads */
@media (prefers-reduced-motion: reduce) { .stmt p span { filter: none } }

/* ---------- 3 · career band ---------- */
.band { position: relative }
.band { --pt: 0px; margin: calc(240px - 50vh) 0 calc(var(--sp) + 30px - 50vh + max(0px, var(--bh, 340px) / 2 + var(--pt) / 2 - 170px) + var(--pad, 0px)) }   /* the pinned card sits mid-screen; pull the neighbours in so the gaps match the rest */
.bpin { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; align-items: center; padding: 0 }
.bruler { position: relative; height: 72vh; touch-action: none } .bruler canvas { width: 100%; height: 100%; display: block; cursor: grab }   /* drag it (or tap a station) */
.bruler.drag canvas, .skscale.drag { cursor: grabbing }
.bcard { position: relative; min-height: 340px }
.bcard .ch { position: absolute; inset: 0; opacity: 0; translate: 0 30px; transition: opacity .5s var(--ease), translate .9s var(--pop); pointer-events: none }
.bcard .ch.on { opacity: 1; translate: 0 0; pointer-events: auto }
/* the bulge: the chapters sit on a drum that turns as you scroll, like the Designs grid. The one facing you is flat and full size; the ones above and below bend away, shrink and fade */
.bcard.drum .ch { transition: none; translate: none; transform-origin: 0 35%; will-change: transform, opacity }
.bpin:has(.bcard.drum) { -webkit-mask-image: linear-gradient(transparent 100px, #000 230px, #000 calc(100% - 140px), transparent calc(100% - 20px)); mask-image: linear-gradient(transparent 100px, #000 230px, #000 calc(100% - 140px), transparent calc(100% - 20px)) }   /* the curve fades out well before the nav */
.bcard .fqv { font: 600 12px var(--mono); color: var(--muted); letter-spacing: .5px }
.bcard h3 { margin: 14px 0 0; color: var(--ink); font-size: clamp(36px, 4.6vw, 68px); line-height: .98; font-weight: 500; letter-spacing: -.045em; max-width: 14ch }
.bcard .role { margin-top: 14px; color: var(--ink); font-size: 16px }
.bcard p { margin: 14px 0 0; font-size: 16px; line-height: 1.6; max-width: 52ch }
.bcard .stats { display: flex; gap: 40px; flex-wrap: wrap }
.bcard .ext { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--pill, rgb(127 127 127 / .12)); color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none; transition: background .18s }
.bcard .ext:hover { background: var(--pill-hover, rgb(127 127 127 / .2)) }
.bcard .ext i { font-style: normal; transition: transform .3s var(--ease) }
.bcard .ext:hover i { transform: translate(2px, -2px) }
.bcard .stat { display: inline-flex; align-items: baseline; gap: 10px; margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line) }
.bcard .stat b { color: var(--ink); font-size: 34px; font-weight: 500; letter-spacing: -.03em }

/* ---------- 4 · mixing desk ---------- */
/* what I do: the five skills as stations on one dial line; the red needle slides to the one you point at and its tools rise out from under it */
.skrow { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0 0 }
.skw { color: var(--faint); font-size: clamp(22px, 3.2vw, 46px); font-weight: 500; letter-spacing: -.04em; line-height: 1; cursor: pointer; transition: color .45s var(--ease); user-select: none; white-space: nowrap }
.skw.on { color: var(--ink) }
.skscale { position: relative; height: 120px; margin-top: 14px; touch-action: none; cursor: grab; user-select: none }   /* drag the needle along the scale */
.skscale canvas { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 44px }
.sktools { position: absolute; top: 56px; left: 0; display: flex; gap: 8px; translate: -50% 0; will-change: transform }
.sktools img { width: 34px; height: 34px; border-radius: 9px; animation: tup .7s var(--pop) both; animation-delay: calc(var(--k) * 60ms) }
@keyframes tup { from { opacity: 0; translate: 0 -16px; scale: .5 } to { opacity: 1; translate: 0 0; scale: 1 } }

/* ---------- 5 · how I work ---------- */
.how { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center }
.knob { position: relative; width: min(380px, 100%); aspect-ratio: 1; justify-self: center; touch-action: none; cursor: grab; user-select: none }
.knob:active { cursor: grabbing }
.knob svg { width: 100%; height: 100% }
.knob .face { transition: none }
.say { position: relative; min-height: 260px }
.say .q { position: absolute; inset: 0; opacity: 0; translate: 0 24px; transition: opacity .45s var(--ease), translate .9s var(--pop) }
.say .q.on { opacity: 1; translate: 0 0 }
.say .q p { margin: 14px 0 0; color: var(--ink); font-size: clamp(30px, 3.6vw, 52px); line-height: 1.05; letter-spacing: -.035em; font-weight: 500; max-width: 18ch }
.say .q small { display: block; margin-top: 18px; font-size: 15px; line-height: 1.55; max-width: 46ch; color: var(--text) }

/* ---------- 6 · on air + call in ---------- */
.air { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px }
.onair { background: var(--panel); padding: 24px; display: flex; flex-direction: column; gap: 22px; min-height: 420px }
.onair .lt { display: flex; align-items: center; gap: 10px }
.onair .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--faint) }
.onair .lamp { position: relative }
.onair.live .lamp { background: #2fb35b }   /* the same green on-air light as Home's "Open to new work", rippling outwards */
.onair.live .lamp::before, .onair.live .lamp::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgb(47 179 91 / .7); animation: lampring 2.4s cubic-bezier(.2,.6,.3,1) infinite }
.onair.live .lamp::after { animation-delay: 1.2s }
@keyframes lampring { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(3.4); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .onair.live .lamp::before, .onair.live .lamp::after { animation: none; opacity: 0 } }
.onair .clock { color: var(--ink); font: 500 clamp(56px, 6vw, 88px)/1 var(--body); letter-spacing: -.04em; font-variant-numeric: tabular-nums }
.onair .clock small { font-size: .32em; color: var(--muted); margin-left: 8px; letter-spacing: 0 }
.onair dl { margin: auto 0 0; display: grid; gap: 14px }
.onair dt { font: 600 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--muted) }
.onair dd { margin: 4px 0 0; color: var(--ink); font-size: 15px }
.sw { position: relative; width: 44px; height: 24px; border-radius: 99px; background: var(--line); transition: background .3s }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: translate .5s var(--pop) }
.sw[aria-pressed="true"] { background: var(--ink) } .sw[aria-pressed="true"]::after { translate: 20px 0 }
.call { border: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden }
.call h3 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 500; letter-spacing: -.02em }
.call label { display: grid; gap: 6px }
.call input, .call textarea { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 0; font-size: 16px; color: var(--ink); outline: none; resize: none; transition: border-color .3s }
.call input:focus, .call textarea:focus { border-color: var(--ink) }
.call .cerr { margin: 0; color: #ff4a1c }
.call .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: auto }
.call .send { height: 44px; padding: 0 20px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500 }
.call .links { display: flex; gap: 16px; flex-wrap: wrap } .call .links a { color: var(--muted); font-size: 13px; text-decoration: none } .call .links a:hover { color: var(--ink) }
.call .done { position: absolute; inset: 0; background: var(--bg); display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s var(--ease) }
.call.sent .done { opacity: 1; pointer-events: auto }
.call .done b { display: block; color: var(--ink); font-size: 34px; font-weight: 500; letter-spacing: -.03em; margin-top: 12px }
.call .done .lamp { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); vertical-align: middle; margin-right: 8px }
/* the email, said plainly: in the Call in card, and as the page's sign-off */
.cmail { color: var(--ink); font-size: 18px; font-weight: 600; letter-spacing: -.02em; text-decoration: none; margin-top: -6px; width: fit-content; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px }
.bigmail { display: grid; gap: 0; padding: calc(var(--sp) + 20px) 0 0; color: var(--ink) }
.bigmail > .mono { margin-bottom: 22px }
.bigmail .bm { color: var(--ink); text-decoration: none; cursor: pointer }
.bigmail b { display: block; font-size: clamp(36px, 7vw, 108px); line-height: 1; font-weight: 600; letter-spacing: -.05em; white-space: nowrap; font-variant-numeric: tabular-nums }
.bigmail b span { display: inline }
/* tune in: when the address comes into view, each letter rolls through static and locks in from left to right */
.bigmail b em { font-style: normal; display: inline-block; transition: color .2s }
.bigmail b em.rx { color: var(--muted); font-family: var(--mono); font-weight: 500; letter-spacing: -.08em }
.bigmail .mrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-top: 34px }
.bigmail .cpill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); font-weight: 500; font-size: 15px; text-decoration: none; transition: background .2s, color .2s }
.bigmail .cpill:hover { background: var(--ink); color: var(--bg) } .bigmail .cpill svg { width: 15px; height: 15px; fill: currentColor } .bigmail .cpill i { font-style: normal }
.bigmail .tfq { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums } .bigmail .tfq b { all: unset; color: var(--red) }
@media (max-width: 700px) { .bigmail b { white-space: normal; font-size: 10.4vw } .bigmail b span { display: inline-block; white-space: nowrap } }   /* on phones it wraps before @gmail.com */
.foot { padding: var(--sp) 0 140px; display: flex; justify-content: space-between; gap: 16px }

@media (max-width: 899px) {
  :root { --gut: 18px }
  .wrap { padding: 0 var(--gut) }   /* the side dial is retired, so no room kept for it */
  .station { gap: 12px } .station .fq { font-size: 22px } .station .nm { display: none }
  .sdial { width: 38px }
  .sname { font-size: 42px }
  .stmt { grid-template-columns: 1fr } .hc { grid-template-columns: 1fr } .hcol { grid-column: 1 }
  .band { --pt: 80px; --pad: 64px }   /* the card drifts a little as you scroll (parallax): room for that too */ .bpin { grid-template-columns: 74px minmax(0, 1fr); gap: 16px; padding-top: var(--pt) }
  .skrow { gap: 8px } .skw { font-size: 17px } .sktools img { width: 28px; height: 28px; border-radius: 7px }
  .how, .air { grid-template-columns: 1fr } .knob { width: 260px }
  .shead { flex-direction: column; align-items: start }
  .call .row { flex-direction: column; align-items: stretch; gap: 20px } .call .send { width: 100% }   /* Go on air on its own line */
}
/* phones: the skills dial stands up. The words stack, the scale runs down beside them, the needle points across at the one picked
   and its tools sit to the right of it */
@media (max-width: 640px) {
  .skills { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; padding-top: 8px }
  .skrow { flex-direction: column; justify-content: flex-start; gap: 26px; padding: 14px 0 }
  .skw { font-size: clamp(24px, 7.6vw, 30px) }
  .skscale { height: auto; margin: 0 }
  .skscale canvas { width: 44px; height: 100%; right: auto }
  .sktools { top: 0; left: 54px; gap: 6px; translate: 0 -50% }
  .sktools img { width: clamp(28px, 8.4vw, 34px); height: clamp(28px, 8.4vw, 34px); border-radius: 8px }
}
@media (max-width: 360px) { .skills { column-gap: 10px } .sktools { left: 46px; gap: 5px } .skscale canvas { width: 38px } }   /* the smallest phones: keep the tools inside the margin */

<!-- Engineering · the dial: the tools sit on a ruler at their own frequency. Tune the red needle (drag, tap, scroll or arrow
     keys) and it settles on the nearest tool; that tool's small live demo plays on the stage, with its words underneath.
     Between tools the stage fills with static. On phones the ruler runs across the top.
     The demo comes from the tool's "demo" setting in the CMS (Line, Mesh, Reel, Dial), or a picture if it has one. -->
<style>
.wbband { display: none !important }
.wb { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; align-items: stretch; padding: 75px 0 40px }   /* the same room under the heading's line as About has before its first chapter */
.wb .dial { position: relative; min-height: 520px; cursor: grab; touch-action: none; outline: none; user-select: none; -webkit-user-select: none } .wb .dial.drag { cursor: grabbing }
.wb .dial canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.wb .dial:focus-visible { outline: 2px solid var(--red); outline-offset: 6px }
.wb .right { display: grid; gap: 30px; align-content: start; min-width: 0 }
.wb .stage { position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--ink) 2%, var(--bg)) }
.wb .stage .live { position: absolute; z-index: 3; left: 24px; top: 24px; display: flex; align-items: center; font: 600 12.5px var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
