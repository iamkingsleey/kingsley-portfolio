# Cloudflare hosting: the site is served as static files straight from this repo.
# Cloudflare deploys it on every push to main (from the CMS Publish button or git push).
name = "kingsley-portfolio"
compatibility_date = "2026-10-01"

[assets]
directory = "./"
not_found_handling = "404-page"   # 404.html, as on GitHub Pages
html_handling = "drop-trailing-slash"   # /designs serves designs.html; /designs.html and /index.html redirect to the clean address
